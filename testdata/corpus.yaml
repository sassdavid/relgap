# The 30-tool corpus from docs/plan/testing.md, written the way a user types each tool. The nightly
# live test (internal/cli/live_test.go, `mise run test:live`) digests each range against GitHub:
#   range     digested as in `relgap digest <tool> <range>`
#   adapters  source adapters that must produce entries (at --min-confidence 0)
#   breaking  breaking entries at the default --min-confidence; a change by more than tolerance
#             (default 2) is drift
#   golden    a digest golden under testdata/golden whose data must match exactly
#   skip      why the tool isn't digested yet
# Ranges and counts were checked live on 2026-11-12. The live test never rewrites this file or a
# golden; a person updates both after reviewing the drift issue.
tools:
  - tool: terraform
    range: 1.15.8..1.17.1
    adapters: [changelog-file]
    breaking: 1
    golden: corpus/terraform.json
  - tool: opentofu
    range: 1.12.3..1.13.2
    adapters: [changelog-file, gh-release]
    breaking: 8
  - tool: terragrunt
    range: 1.2.0..1.2.2
    adapters: [gh-release]
    breaking: 0
  - tool: tflint
    range: 0.64.0..0.66.0
    adapters: [gh-release]
    breaking: 2
  - tool: terraform-docs
    range: 0.22.0..0.24.0
    adapters: [gh-release]
    breaking: 2
  - tool: tfprovider:hashicorp/aws
    range: 5.99.0..6.0.0
    adapters: [changelog-file, gh-release, upgrade-guide]
    breaking: 317
    tolerance: 30
  - tool: tfprovider:hashicorp/kubernetes
    range: 2.38.0..3.0.0
