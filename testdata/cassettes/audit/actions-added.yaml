\":false,\"publishedAt\":\"2024-07-05T15:12:41Z\",\"url\":\"https://github.com/actions/download-artifact/releases/tag/v4.1.8\",\"description\":\"## What's Changed\\r\\n* Update @actions/artifact version, bump dependencies by @robherley in https://github.com/actions/download-artifact/pull/341\\r\\n\\r\\n\\r\\n**Full Changelog**: https://github.com/actions/download-artifact/compare/v4.1.7...v4.1.8\"},\"r5\":{\"tagName\":\"v4.1.9\",\"isDraft\":false,\"isPrerelease\":false,\"publishedAt\":\"2025-02-25T21:26:04Z\",\"url\":\"https://github.com/actions/download-artifact/releases/tag/v4.1.9\",\"description\":\"## What's Changed\\r\\n* Add workflow file for publishing releases to immutable action package by @Jcambass in https://github.com/actions/download-artifact/pull/354\\r\\n* docs: small migration fix by @froblesmartin in https://github.com/actions/download-artifact/pull/370\\r\\n* Update MIGRATION.md by @andyfeller in https://github.com/actions/download-artifact/pull/372\\r\\n* Update artifact package to 2.2.2 by @yacaovsnc in https://github.com/actions/download-artifact/pull/380\\r\\n\\r\\n## New Contributors\\r\\n* @Jcambass made their first contribution in https://github.com/actions/download-artifact/pull/354\\r\\n* @froblesmartin made their first contribution in https://github.com/actions/download-artifact/pull/370\\r\\n* @andyfeller made their first contribution in https://github.com/actions/download-artifact/pull/372\\r\\n* @yacaovsnc made their first contribution in https://github.com/actions/download-artifact/pull/380\\r\\n\\r\\n**Full Changelog**: https://github.com/actions/download-artifact/compare/v4.1.8...v4.1.9\"},\"r6\":{\"tagName\":\"v4.2.0\",\"isDraft\":false,\"isPrerelease\":false,\"publishedAt\":\"2025-03-18T16:04:25Z\",\"url\":\"https://github.com/actions/download-artifact/releases/tag/v4.2.0\",\"description\":\"## What's Changed\\r\\n* Update README.md by @lkfortuna in https://github.com/actions/download-artifact/pull/384\\r\\n* Bump artifact version, do digest check by @GhadimiR in https://github.com/actions/download-artifact/pull/383\\r\\n\\r\\n## New Contributors\\r\\n* @lkfortuna made their first contribution in https://github.com/actions/download-artifact/pull/384\\r\\n* @GhadimiR made their first contribution in https://github.com/actions/download-artifact/pull/383\\r\\n\\r\\n**Full Changelog**: https://github.com/actions/download-artifact/compare/v4.1.9...v4.2.0\"},\"r7\":{\"tagName\":\"v4.2.1\",\"isDraft\":false,\"isPrerelease\":false,\"publishedAt\":\"2025-03-19T15:54:58Z\",\"url\":\"https://github.com/actions/download-artifact/releases/tag/v4.2.1\",\"description\":\"## What's Changed\\r\\n* Add unit tests by @GhadimiR in https://github.com/actions/download-artifact/pull/392\\r\\n* Fix bug introduced in 4.2.0 by @GhadimiR in https://github.com/actions/download-artifact/pull/391\\r\\n\\r\\n\\r\\n**Full Changelog**: https://github.com/actions/download-artifact/compare/v4.2.0...v4.2.1\"},\"r8\":{\"tagName\":\"v4.3.0\",\"isDraft\":false,\"isPrerelease\":false,\"publishedAt\":\"2025-04-24T16:28:16Z\",\"url\":\"https://github.com/actions/download-artifact/releases/tag/v4.3.0\",\"description\":\"## What's Changed\\r\\n* feat: implement new `artifact-ids` input by @GrantBirki in https://github.com/actions/download-artifact/pull/401\\r\\n* Fix workflow example for downloading by artifact ID by @joshmgross in https://github.com/actions/download-artifact/pull/402\\r\\n* Prep for v4.3.0 release by @robherley in https://github.com/actions/download-artifact/pull/404\\r\\n\\r\\n## New Contributors\\r\\n* @GrantBirki made their first contribution in https://github.com/actions/download-artifact/pull/401\\r\\n\\r\\n**Full Changelog**: https://github.com/actions/download-artifact/compare/v4.2.1...v4.3.0\"},\"r9\":{\"tagName\":\"v5.0.0\",\"isDraft\":false,\"isPrerelease\":false,\"publishedAt\":\"2025-08-05T21:38:42Z\",\"url\":\"https://github.com/actions/download-artifact/releases/tag/v5.0.0\",\"description\":\"## What's Changed\\r\\n* Update README.md by @nebuk89 in https://github.com/actions/download-artifact/pull/407\\r\\n* BREAKING fix: inconsistent path behavior for single artifact downloads by ID by @GrantBirki in https://github.com/actions/download-artifact/pull/416\\r\\n\\r\\n## v5.0.0\\r\\n\\r\\n### \U0001F6A8 Breaking Change\\r\\n\\r\\nThis release fixes an inconsistency in path behavior for single artifact downloads by ID. **If you're downloading single artifacts by ID, the output path may change.**\\r\\n\\r\\n#### What Changed\\r\\n\\r\\nPreviously, **single artifact downloads** behaved differently depending on how you specified the artifact:\\r\\n\\r\\n- **By name**: `name: my-artifact` → extracted to `path/` (direct)\\r\\n- **By ID**: `artifact-ids: 12345` → extracted to `path/my-artifact/` (nested)\\r\\n\\r\\nNow both methods are consistent:\\r\\n\\r\\n- **By name**: `name: my-artifact` → extracted to `path/` (unchanged)\\r\\n- **By ID**: `artifact-ids: 12345` → extracted to `path/` (fixed - now direct)\\r\\n\\r\\n#### Migration Guide\\r\\n\\r\\n##### ✅ No Action Needed If:\\r\\n\\r\\n- You download artifacts by **name**\\r\\n- You download **multiple** artifacts by ID\\r\\n- You already use `merge-multiple: true` as a workaround\\r\\n\\r\\n##### ⚠️ Action Required If:\\r\\n\\r\\nYou download **single artifacts by ID** and your workflows expect the nested directory structure.\\r\\n\\r\\n**Before v5 (nested structure):**\\r\\n\\r\\n```yaml\\r\\n- uses: actions/download-artifact@v4\\r\\n  with:\\r\\n    artifact-ids: 12345\\r\\n    path: dist\\r\\n# Files were in: dist/my-artifact/\\r\\n```\\r\\n\\r\\n> Where `my-artifact` is the name of the artifact you previously uploaded\\r\\n\\r\\n**To maintain old behavior (if needed):**\\r\\n\\r\\n```yaml\\r\\n- uses: actions/download-artifact@v5\\r\\n  with:\\r\\n    artifact-ids: 12345\\r\\n    path: dist/my-artifact  # Explicitly specify the nested path\\r\\n```\\r\\n\\r\\n## New Contributors\\r\\n* @nebuk89 made their first contribution in https://github.com/actions/download-artifact/pull/407\\r\\n\\r\\n**Full Changelog**: https://github.com/actions/download-artifact/compare/v4...v5.0.0\"}}}}"
