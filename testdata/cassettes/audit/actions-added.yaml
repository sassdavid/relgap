            {"query":"query($name:String!$owner:String!$t0:String!$t1:String!$t2:String!$t3:String!$t4:String!$t5:String!){repository(owner: $owner, name: $name){r0: release(tagName: $t0){tagName,isDraft,isPrerelease,publishedAt,url,description},r1: release(tagName: $t1){tagName,isDraft,isPrerelease,publishedAt,url,description},r2: release(tagName: $t2){tagName,isDraft,isPrerelease,publishedAt,url,description},r3: release(tagName: $t3){tagName,isDraft,isPrerelease,publishedAt,url,description},r4: release(tagName: $t4){tagName,isDraft,isPrerelease,publishedAt,url,description},r5: release(tagName: $t5){tagName,isDraft,isPrerelease,publishedAt,url,description}}}","variables":{"name":"download-artifact","owner":"actions","t0":"v5.0.0","t1":"v6.0.0","t2":"v7.0.0","t3":"v8.0.0","t4":"v8.0.1","t5":"v8.0.2"}}
