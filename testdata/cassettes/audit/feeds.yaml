        body: '{"id":"GHSA-4r4m-qw57-chr8","summary":"Vite has a `server.fs.deny` bypassed for `inline` and `raw` with `?import` query","details":"### Summary\n\nThe contents of arbitrary files can be returned to the browser.\n\n### Impact\nOnly apps explicitly exposing the Vite dev server to the network (using `--host` or [`server.host` config option](https://vitejs.dev/config/server-options.html#server-host)) are affected.\n\n### Details\n\n- base64 encoded content of non-allowed files is exposed using `?inline&import` (originally reported as `?import&?inline=1.wasm?init`)\n- content of non-allowed files is exposed using `?raw?import`\n\n`/@fs/` isn''t needed to reproduce the issue for files inside the project root.\n\n### PoC\n\nOriginal report (check details above for simplified cases):\n\nThe ?import&?inline=1.wasm?init ending allows attackers to read arbitrary files and returns the file content if it exists.  Base64 decoding needs to be performed twice\n```\n$ npm create vite@latest\n$ cd vite-project/\n$ npm install\n$ npm run dev\n```\n\nExample full URL `http://localhost:5173/@fs/C:/windows/win.ini?import&?inline=1.wasm?init`","aliases":["CVE-2025-31125"],"modified":"2026-09-10T03:50:56.858424937Z","published":"2025-03-31T17:31:54Z","database_specific":{"severity":"MODERATE","github_reviewed":true,"github_reviewed_at":"2025-03-31T17:31:54Z","nvd_published_at":"2025-03-31T17:15:43Z","cwe_ids":["CWE-200","CWE-284"]},"references":[{"type":"WEB","url":"https://github.com/vitejs/vite/security/advisories/GHSA-4r4m-qw57-chr8"},{"type":"ADVISORY","url":"https://nvd.nist.gov/vuln/detail/CVE-2025-31125"},{"type":"WEB","url":"https://github.com/vitejs/vite/commit/59673137c45ac2bcfad1170d954347c1a17ab949"},{"type":"PACKAGE","url":"https://github.com/vitejs/vite"},{"type":"WEB","url":"https://www.cisa.gov/known-exploited-vulnerabilities-catalog?field_cve=CVE-2025-31125"}],"affected":[{"package":{"name":"vite","ecosystem":"npm","purl":"pkg:npm/vite"},"ranges":[{"type":"SEMVER","events":[{"introduced":"6.2.0"},{"fixed":"6.2.4"}]}],"database_specific":{"source":"https://github.com/github/advisory-database/blob/main/advisories/github-reviewed/2025/03/GHSA-4r4m-qw57-chr8/GHSA-4r4m-qw57-chr8.json"}},{"package":{"name":"vite","ecosystem":"npm","purl":"pkg:npm/vite"},"ranges":[{"type":"SEMVER","events":[{"introduced":"6.1.0"},{"fixed":"6.1.3"}]}],"database_specific":{"source":"https://github.com/github/advisory-database/blob/main/advisories/github-reviewed/2025/03/GHSA-4r4m-qw57-chr8/GHSA-4r4m-qw57-chr8.json"}},{"package":{"name":"vite","ecosystem":"npm","purl":"pkg:npm/vite"},"ranges":[{"type":"SEMVER","events":[{"introduced":"6.0.0"},{"fixed":"6.0.13"}]}],"database_specific":{"source":"https://github.com/github/advisory-database/blob/main/advisories/github-reviewed/2025/03/GHSA-4r4m-qw57-chr8/GHSA-4r4m-qw57-chr8.json"}},{"package":{"name":"vite","ecosystem":"npm","purl":"pkg:npm/vite"},"ranges":[{"type":"SEMVER","events":[{"introduced":"5.0.0"},{"fixed":"5.4.16"}]}],"database_specific":{"source":"https://github.com/github/advisory-database/blob/main/advisories/github-reviewed/2025/03/GHSA-4r4m-qw57-chr8/GHSA-4r4m-qw57-chr8.json"}},{"package":{"name":"vite","ecosystem":"npm","purl":"pkg:npm/vite"},"ranges":[{"type":"SEMVER","events":[{"introduced":"0"},{"fixed":"4.5.11"}]}],"database_specific":{"source":"https://github.com/github/advisory-database/blob/main/advisories/github-reviewed/2025/03/GHSA-4r4m-qw57-chr8/GHSA-4r4m-qw57-chr8.json"}}],"schema_version":"1.9.0","severity":[{"type":"CVSS_V3","score":"CVSS:3.1/AV:N/AC:H/PR:N/UI:R/S:U/C:H/I:N/A:N"}]}'
