        body: '{"id":"GHSA-2m3v-v2m8-q956","summary":"Denial of Service Vulnerability in React Server Components","details":"## Impact\n\nThere is a denial of service vulnerability in React Server Components.\n\nReact recommends updating immediately.\n\nThe vulnerability exists in versions 19.0.0, 19.0.1 19.1.0, 19.1.1, 19.1.2, 19.2.0 and 19.2.1 of:\n\n- [react-server-dom-webpack](https://www.npmjs.com/package/react-server-dom-webpack)\n- [react-server-dom-parcel](https://www.npmjs.com/package/react-server-dom-parcel)\n- [react-server-dom-turbopack](https://www.npmjs.com/package/react-server-dom-turbopack?activeTab=readme)\n\nThese issues are present in the patches published last week.\n\n## Patches\n\nFixes were back ported to versions 19.0.2, 19.1.3, and 19.2.2. \n\nIf you are using any of the above packages please upgrade to any of the fixed versions immediately.\n\nIf your app’s React code does not use a server, your app is not affected by this vulnerability. If your app does not use a framework, bundler, or bundler plugin that supports React Server Components, your app is not affected by this vulnerability.\n\n## References\n\nSee the [blog post](https://react.dev/blog/2025/12/11/denial-of-service-and-source-code-exposure-in-react-server-components) for more information and upgrade instructions.","aliases":["CVE-2025-55184"],"modified":"2025-12-11T22:56:16.875215Z","published":"2025-12-11T22:36:44Z","database_specific":{"severity":"HIGH","github_reviewed":true,"github_reviewed_at":"2025-12-11T22:36:44Z","nvd_published_at":"2025-12-11T20:16:00Z","cwe_ids":["CWE-400","CWE-502"]},"references":[{"type":"WEB","url":"https://github.com/facebook/react/security/advisories/GHSA-2m3v-v2m8-q956"},{"type":"ADVISORY","url":"https://nvd.nist.gov/vuln/detail/CVE-2025-55184"},{"type":"PACKAGE","url":"https://github.com/facebook/react"},{"type":"WEB","url":"https://react.dev/blog/2025/12/11/denial-of-service-and-source-code-exposure-in-react-server-components"},{"type":"WEB","url":"https://www.facebook.com/security/advisories/cve-2025-55184"}],"affected":[{"package":{"name":"react-server-dom-parcel","ecosystem":"npm","purl":"pkg:npm/react-server-dom-parcel"},"ranges":[{"type":"SEMVER","events":[{"introduced":"19.0.0"},{"fixed":"19.0.2"}]}],"database_specific":{"source":"https://github.com/github/advisory-database/blob/main/advisories/github-reviewed/2025/12/GHSA-2m3v-v2m8-q956/GHSA-2m3v-v2m8-q956.json"}},{"package":{"name":"react-server-dom-turbopack","ecosystem":"npm","purl":"pkg:npm/react-server-dom-turbopack"},"ranges":[{"type":"SEMVER","events":[{"introduced":"19.0.0"},{"fixed":"19.0.2"}]}],"database_specific":{"source":"https://github.com/github/advisory-database/blob/main/advisories/github-reviewed/2025/12/GHSA-2m3v-v2m8-q956/GHSA-2m3v-v2m8-q956.json"}},{"package":{"name":"react-server-dom-webpack","ecosystem":"npm","purl":"pkg:npm/react-server-dom-webpack"},"ranges":[{"type":"SEMVER","events":[{"introduced":"19.0.0"},{"fixed":"19.0.2"}]}],"database_specific":{"source":"https://github.com/github/advisory-database/blob/main/advisories/github-reviewed/2025/12/GHSA-2m3v-v2m8-q956/GHSA-2m3v-v2m8-q956.json"}},{"package":{"name":"react-server-dom-parcel","ecosystem":"npm","purl":"pkg:npm/react-server-dom-parcel"},"ranges":[{"type":"SEMVER","events":[{"introduced":"19.1.0"},{"fixed":"19.1.3"}]}],"database_specific":{"source":"https://github.com/github/advisory-database/blob/main/advisories/github-reviewed/2025/12/GHSA-2m3v-v2m8-q956/GHSA-2m3v-v2m8-q956.json"}},{"package":{"name":"react-server-dom-parcel","ecosystem":"npm","purl":"pkg:npm/react-server-dom-parcel"},"ranges":[{"type":"SEMVER","events":[{"introduced":"19.2.0"},{"fixed":"19.2.2"}]}],"database_specific":{"source":"https://github.com/github/advisory-database/blob/main/advisories/github-reviewed/2025/12/GHSA-2m3v-v2m8-q956/GHSA-2m3v-v2m8-q956.json"}},{"package":{"name":"react-server-dom-turbopack","ecosystem":"npm","purl":"pkg:npm/react-server-dom-turbopack"},"ranges":[{"type":"SEMVER","events":[{"introduced":"19.1.0"},{"fixed":"19.1.3"}]}],"database_specific":{"source":"https://github.com/github/advisory-database/blob/main/advisories/github-reviewed/2025/12/GHSA-2m3v-v2m8-q956/GHSA-2m3v-v2m8-q956.json"}},{"package":{"name":"react-server-dom-turbopack","ecosystem":"npm","purl":"pkg:npm/react-server-dom-turbopack"},"ranges":[{"type":"SEMVER","events":[{"introduced":"19.2.0"},{"fixed":"19.2.2"}]}],"database_specific":{"source":"https://github.com/github/advisory-database/blob/main/advisories/github-reviewed/2025/12/GHSA-2m3v-v2m8-q956/GHSA-2m3v-v2m8-q956.json"}},{"package":{"name":"react-server-dom-webpack","ecosystem":"npm","purl":"pkg:npm/react-server-dom-webpack"},"ranges":[{"type":"SEMVER","events":[{"introduced":"19.1.0"},{"fixed":"19.1.3"}]}],"database_specific":{"source":"https://github.com/github/advisory-database/blob/main/advisories/github-reviewed/2025/12/GHSA-2m3v-v2m8-q956/GHSA-2m3v-v2m8-q956.json"}},{"package":{"name":"react-server-dom-webpack","ecosystem":"npm","purl":"pkg:npm/react-server-dom-webpack"},"ranges":[{"type":"SEMVER","events":[{"introduced":"19.2.0"},{"fixed":"19.2.2"}]}],"database_specific":{"source":"https://github.com/github/advisory-database/blob/main/advisories/github-reviewed/2025/12/GHSA-2m3v-v2m8-q956/GHSA-2m3v-v2m8-q956.json"}}],"schema_version":"1.9.0","severity":[{"type":"CVSS_V3","score":"CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:H"}]}'
