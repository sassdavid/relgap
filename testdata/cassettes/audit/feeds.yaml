        body: '{"id":"GHSA-fv66-9v8q-g76r","summary":"React Server Components are Vulnerable to RCE","details":"### Impact\n\nThere is an unauthenticated remote code execution vulnerability in React Server Components.\n\nWe recommend upgrading immediately.\n\nThe vulnerability is present in versions 19.0.0, 19.1.0, 19.1.1, and 19.2.0 of:\n* [react-server-dom-webpack](https://www.npmjs.com/package/react-server-dom-webpack)\n* [react-server-dom-parcel](https://www.npmjs.com/package/react-server-dom-parcel)\n* [react-server-dom-turbopack](https://www.npmjs.com/package/react-server-dom-turbopack?activeTab=readme)\n\n### Patches\n\nA fix was introduced in versions [19.0.1](https://github.com/facebook/react/releases/tag/v19.0.1), [19.1.2](https://github.com/facebook/react/releases/tag/v19.1.2), and [19.2.1](https://github.com/facebook/react/releases/tag/v19.2.1). If you are using any of the above packages please upgrade to any of the fixed versions immediately.\n\nIf your app’s React code does not use a server, your app is not affected by this vulnerability. If your app does not use a framework, bundler, or bundler plugin that supports React Server Components, your app is not affected by this vulnerability.\n\n### References\n\nSee the [blog post](https://react.dev/blog/2025/12/03/critical-security-vulnerability-in-react-server-components) for more information and upgrade instructions.","aliases":["CVE-2025-55182"],"modified":"2025-12-09T17:46:07.154758Z","published":"2025-12-03T19:07:39Z","database_specific":{"cwe_ids":["CWE-502"],"severity":"CRITICAL","github_reviewed":true,"github_reviewed_at":"2025-12-03T19:07:39Z","nvd_published_at":"2025-12-03T16:15:56Z"},"references":[{"type":"WEB","url":"https://github.com/facebook/react/security/advisories/GHSA-fv66-9v8q-g76r"},{"type":"ADVISORY","url":"https://nvd.nist.gov/vuln/detail/CVE-2025-55182"},{"type":"WEB","url":"https://github.com/facebook/react/pull/35277"},{"type":"WEB","url":"https://github.com/facebook/react/commit