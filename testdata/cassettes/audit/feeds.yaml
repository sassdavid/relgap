tem":"npm","purl":"pkg:npm/react-server-dom-webpack"},"ranges":[{"type":"SEMVER","events":[{"introduced":"19.1.0"},{"fixed":"19.1.7"}]}],"database_specific":{"source":"https://github.com/github/advisory-database/blob/main/advisories/github-reviewed/2026/05/GHSA-rv78-f8rc-xrxh/GHSA-rv78-f8rc-xrxh.json"}},{"package":{"name":"react-server-dom-parcel","ecosystem":"npm","purl":"pkg:npm/react-server-dom-parcel"},"ranges":[{"type":"SEMVER","events":[{"introduced":"19.2.0"},{"fixed":"19.2.6"}]}],"database_specific":{"source":"https://github.com/github/advisory-database/blob/main/advisories/github-reviewed/2026/05/GHSA-rv78-f8rc-xrxh/GHSA-rv78-f8rc-xrxh.json"}},{"package":{"name":"react-server-dom-turbopack","ecosystem":"npm","purl":"pkg:npm/react-server-dom-turbopack"},"ranges":[{"type":"SEMVER","events":[{"introduced":"19.2.0"},{"fixed":"19.2.6"}]}],"database_specific":{"source":"https://github.com/github/advisory-database/blob/main/advisories/github-reviewed/2026/05/GHSA-rv78-f8rc-xrxh/GHSA-rv78-f8rc-xrxh.json"}},{"package":{"name":"react-server-dom-webpack","ecosystem":"npm","purl":"pkg:npm/react-server-dom-webpack"},"ranges":[{"type":"SEMVER","events":[{"introduced":"19.2.0"},{"fixed":"19.2.6"}]}],"database_specific":{"source":"https://github.com/github/advisory-database/blob/main/advisories/github-reviewed/2026/05/GHSA-rv78-f8rc-xrxh/GHSA-rv78-f8rc-xrxh.json"}}],"schema_version":"1.9.0","severity":[{"type":"CVSS_V3","score":"CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:H"}]}'
