        body: '{"id":"GHSA-wx67-qw84-cm4g","summary":"react-server-dom: Denial of Service in Server Functions","details":"### Impact\n\nA denial of service vulnerability could be triggered by sending specially crafted HTTP requests to server function endpoints, this could lead to out-of-memory exceptions or excessive CPU usage.\n\nWe recommend updating immediately.\n\nThe vulnerability exists in versions 19.0.0 through 19.0.7, 19.1.0 through 19.1.8, and 19.2.0 through 19.2.7 of:\n- react-server-dom-webpack\n- react-server-dom-parcel\n- react-server-dom-turbopack\n\n### Patches\n\nFixes were back ported to versions 19.0.8, 19.1.9, and 19.2.8.\n\nIf you are using any of the above packages please upgrade to any of the fixed versions immediately.\n\nIf your app’s React code does not use a server, your app is not affected by this vulnerability. If your app does not use a framework, bundler, or bundler plugin that supports React Server Components, your app is not affected by this vulnerability.","aliases":["CVE-2026-44907"],"modified":"2026-07-24T21:16:20.069345400Z","published":"2026-07-24T21:12:02Z","database_specific":{"severity":"HIGH","github_reviewed":true,"github_reviewed_at":"2026-07-24T21:12:02Z","nvd_published_at":"2026-07-21T17:17:08Z","cwe_ids":["CWE-400","CWE-770"]},"references":[{"type":"WEB","url":"https://github.com/react/react/security/advisories/GHSA-wx67-qw84-cm4g"},{"type":"ADVISORY","url":"https://nvd.nist.gov/vuln/detail/CVE-2026-44907"},{"type":"PACKAGE","url":"https://github.com/react/react"}],"affected":[{"package":{"name":"react-server-dom-webpack","ecosystem":"npm","purl":"pkg:npm/react-server-dom-webpack"},"ranges":[{"type":"SEMVER","events":[{"introduced":"19.0.0"},{"fixed":"19.0.8"}]}],"database_specific":{"source":"https://github.com/github/advisory-database/blob/main/advisories/github-reviewed/2026/07/GHSA-wx67-qw84-cm4g/GHSA-wx67-qw84-cm4g.json"}},{"package":{"name":"react-server-dom-turbopack","ecosystem":"npm","purl":"pkg:npm/react-serve