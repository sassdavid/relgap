        body: '{"id":"GHSA-479c-33wc-g2pg","summary":"React Server Components have a Denial of Service Vulnerability","details":"## Impact\n\nA denial of service vulnerability exists in React Server Components, affecting the following packages: react-server-dom-parcel, react-server-dom-turbopack, react-server-dom-webpack versions 19.0.0, 19.1.0 and 19.2.0. The vulnerability is triggered by sending specially crafted HTTP requests to Server Function endpoints.\n\nThe payload of the HTTP request causes excessive CPU usage for up to a minute ending in a thrown error that is catchable.\n\nWe recommend updating immediately.\n\nThe vulnerability exists in versions 19.0.0 through 19.0.4, 19.1.0 through 19.1.5, and 19.2.0 through 19.2.4 of:\n\n[react-server-dom-webpack](https://www.npmjs.com/package/react-server-dom-webpack)\n[react-server-dom-parcel](https://www.npmjs.com/package/react-server-dom-parcel)\n[react-server-dom-turbopack](https://www.npmjs.com/package/react-server-dom-turbopack?activeTab=readme)\n\n## Patches\n\nFixes were back ported to versions 19.0.5, 19.1.6, and 19.2.5.\n\nIf you are using any of the above packages please upgrade to any of the fixed versions immediately.\n\nIf your app’s React code does not use a server, your app is not affected by this vulnerability. If your app does not use a framework, bundler, or bundler plugin that supports React Server Components, your app is not affected by this vulnerability.\n\n## References\n\nSee the [blog post](https://react.dev/blog/2025/12/11/denial-of-service-and-source-code-exposure-in-react-server-components) for more information and upgrade instructions.","aliases":["CVE-2026-23869"],"modified":"2026-04-10T15:57:10.364539Z","published":"2026-04-10T15:35:37Z","database_specific":{"github_reviewed_at":"2026-04-10T15:35:37Z","nvd_published_at":"2026-04-08T20:16:23Z","cwe_ids":["CWE-400","CWE-502"],"severity":"HIGH","github_reviewed":true},"references":[{"type":"WEB","url":"https://github.com/facebook/react/security/advisories/GHSA-479c-33wc-g2pg"},{"type":"ADVISORY","url":"https://nvd.nist.gov/vuln/detail/CVE-2026-23869"},{"type":"PACKAGE","url":"https://github.com/facebook/react"},{"type":"WEB","url":"https://react.dev/blog/2025/12/11/denial-of-service-and-source-code-exposure-in-react-server-components"}],"affected":[{"package":{"name":"react-server-dom-parcel","ecosystem":"npm","purl":"pkg:npm/react-server-dom-parcel"},"ranges":[{"type":"SEMVER","events":[{"introduced":"19.0.0"},{"fixed":"19.0.5"}]}],"database_specific":{"source":"https://github.com/github/advisory-database/blob/main/advisories/github-reviewed/2026/04/GHSA-479c-33wc-g2pg/GHSA-479c-33wc-g2pg.json"}},{"package":{"name":"react-server-dom-parcel","ecosystem":"npm","purl":"pkg:npm/react-server-dom-parcel"},"ranges":[{"type":"SEMVER","events":[{"introduced":"19.1.0"},{"fixed":"19.1.6"}]}],"database_specific":{"source":"https://github.com/github/advisory-database/blob/main/advisories/github-reviewed/2026/04/GHSA-479c-33wc-g2pg/GHSA-479c-33wc-g2pg.json"}},{"package":{"name":"react-server-dom-parcel","ecosystem":"npm","purl":"pkg:npm/react-server-dom-parcel"},"ranges":[{"type":"SEMVER","events":[{"introduced":"19.2.0"},{"fixed":"19.2.5"}]}],"database_specific":{"source":"https://github.com/github/advisory-database/blob/main/advisories/github-reviewed/2026/04/GHSA-479c-33wc-g2pg/GHSA-479c-33wc-g2pg.json"}},{"package":{"name":"react-server-dom-turbopack","ecosystem":"npm","purl":"pkg:npm/react-server-dom-turbopack"},"ranges":[{"type":"SEMVER","events":[{"introduced":"19.0.0"},{"fixed":"19.0.5"}]}],"database_specific":{"source":"https://github.com/github/advisory-database/blob/main/advisories/github-reviewed/2026/04/GHSA-479c-33wc-g2pg/GHSA-479c-33wc-g2pg.json"}},{"package":{"name":"react-server-dom-turbopack","ecosystem":"npm","purl":"pkg:npm/react-server-dom-turbopack"},"ranges":[{"type":"SEMVER","events":[{"introduced":"19.1.0"},{"fixed":"19.1.6"}]}],"database_specific":{"source":"https://github.com/github/adv