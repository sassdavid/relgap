        body: '{"id":"GHSA-xqc2-xf4c-x3h3","summary":"React: Unauthenticated Remote Code Execution in React Server Components","details":"### Impact\n\nCrafted payloads targeting frameworks supporting React Server Components can lead to remote code execution. This only affects extremely rare cases where responses transport multiple typed arrays and an attacker-controlled value.\n\nUpdating immediately is recommended.\n\nThe vulnerability exists in versions 19.0.0 through 19.0.8, 19.1.0 through 19.1.9, 19.2.0 through 19.2.8 and 19.3.0 of:\n\n- react-server-dom-webpack\n- react-server-dom-parcel\n- react-server-dom-turbopack\n\n### Patches\n\nFixes were back ported to versions 19.0.09, 19.1.10, 19.2.9, and 19.3.1.\n\nIf applications are using any of the above packages please upgrade to any of the fixed versions immediately.\n\nIf an app’s React code does not use a server, the app is not affected by this vulnerability. If an app does not use a framework, bundler, or bundler plugin that supports React Server Components, the app is not affected by this vulnerability.","aliases":["CVE-2026-126187"],"modified":"2026-11-10T23:00:03.366767332Z","published":"2026-11-10T22:44:12Z","database_specific":{"severity":"CRITICAL","github_reviewed":true,"github_reviewed_at":"2026-11-10T22:44:12Z","nvd_published_at":null,"cwe_ids":["CWE-502"]},"references":[{"type":"WEB","url":"https://github.com/react/react/security/advisories/GHSA-xqc2-xf4c-x3h3"},{"type":"WEB","url":"https://github.com/react/react/pull/37842"},{"type":"WEB","url":"https://github.com/react/react/pull/37843"},{"type":"WEB","url":"https://github.com/react/react/pull/37844"},{"type":"WEB","url":"https://github.com/react/react/pull/37845"},{"type":"WEB","url":"https://github.com/react/react/pull/37846"},{"type":"WEB","url":"https://github.com/react/react/commit/0c9913ae87283f96e868a8f1c20a3389827632d0"},{"type":"WEB","url":"https://github.com/react/react/commit/249ac87b0dadea4ba024d1393e5cb60cf1186080"},{"type":"WEB","ur