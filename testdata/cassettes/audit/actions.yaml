        body: '{"id":"GHSA-cxww-7g56-2vh6","summary":"@actions/download-artifact has an Arbitrary File Write via artifact extraction","details":"### Impact\n\nVersions of `actions/download-artifact` before 4.1.3 are vulnerable to arbitrary file write when downloading and extracting a specifically crafted artifact that contains path traversal filenames.\n\n### Patches\n\nUpgrade to version 4.1.3 or higher. Alternatively use ''v4'' tag which points to the latest and secure version.\n\n### References\n\n- https://snyk.io/research/zip-slip-vulnerability\n- https://github.com/actions/download-artifact/releases/tag/v4.1.3\n- https://github.com/actions/download-artifact/pull/299\n\n### CVE\n\nCVE-2024-42471\n\n### Credits\n\nJustin Taft from Google","modified":"2025-01-22T17:31:55Z","published":"2024-09-03T20:55:34Z","database_specific":{"cwe_ids":["CWE-22"],"severity":"HIGH","github_reviewed":true,"github_reviewed_at":"2024-09-03T20:55:34Z","nvd_published_at":null},"references":[{"type":"WEB","url":"https://github.com/actions/download-artifact/security/advisories/GHSA-cxww-7g56-2vh6"},{"type":"PACKAGE","url":"https://github.com/actions/download-artifact"},{"type":"WEB","url":"https://github.com/actions/download-artifact/releases/tag/v4.1.3"},{"type":"ADVISORY","url":"https://github.com/advisories/GHSA-6q32-hq47-5qq3"},{"type":"WEB","url":"https://snyk.io/research/zip-slip-vulnerability"}],"affected":[{"package":{"name":"actions/download-artifact","ecosystem":"GitHub Actions"},"ranges":[{"type":"ECOSYSTEM","events":[{"introduced":"4.0.0"},{"fixed":"4.1.3"}]}],"database_specific":{"source":"https://github.com/github/advisory-database/blob/main/advisories/github-reviewed/2024/09/GHSA-cxww-7g56-2vh6/GHSA-cxww-7g56-2vh6.json"}}],"schema_version":"1.9.0","severity":[{"type":"CVSS_V3","score":"CVSS:3.1/AV:N/AC:L/PR:L/UI:R/S:U/C:H/I:H/A:N"},{"type":"CVSS_V4","score":"CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:H/VI:H/VA:N/SC:N/SI:N/SA:N"}]}'
