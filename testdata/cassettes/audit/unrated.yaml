        content_length: 1810
        body: '{"id":"GHSA-3wgm-2gw2-vh5m","summary":"Kubernetes GitRepo Volume Inadvertent Local Repository Access","details":"A security vulnerability was discovered in Kubernetes that could allow a user with create pod permission to exploit gitRepo volumes to access local git repositories belonging to other pods on the same node. This CVE only affects Kubernetes clusters that utilize the in-tree gitRepo volume to clone git repositories from other pods within the same node. Since the in-tree gitRepo volume feature has been deprecated and will not receive security updates upstream, any cluster still using this feature remains vulnerable.","aliases":["CVE-2025-1767","GO-2025-3521"],"modified":"2026-09-10T03:50:56.736211169Z","published":"2025-03-13T18:32:22Z","database_specific":{"severity":"MODERATE","github_reviewed":true,"github_reviewed_at":"2025-03-14T17:30:06Z","nvd_published_at":"2025-03-13T17:15:36Z","cwe_ids":["CWE-20"]},"references":[{"type":"ADVISORY","url":"https://nvd.nist.gov/vuln/detail/CVE-2025-1767"},{"type":"WEB","url":"https://github.com/kubernetes/kubernetes/pull/130786"},{"type":"PACKAGE","url":"https://github.com/kubernetes/kubernetes"},{"type":"WEB","url":"https://groups.google.com/g/kubernetes-security-announce/c/19irihsKg7s"},{"type":"WEB","url":"http://www.openwall.com/lists/oss-security/2025/03/13/9"}],"affected":[{"package":{"name":"k8s.io/kubernetes","ecosystem":"Go","purl":"pkg:golang/k8s.io/kubernetes"},"ranges":[{"type":"SEMVER","events":[{"introduced":"0"},{"last_affected":"1.32.3"}]}],"database_specific":{"source":"https://github.com/github/advisory-database/blob/main/advisories/github-reviewed/2025/03/GHSA-3wgm-2gw2-vh5m/GHSA-3wgm-2gw2-vh5m.json"}}],"schema_version":"1.9.0","severity":[{"type":"CVSS_V3","score":"CVSS:3.1/AV:N/AC:L/PR:H/UI:N/S:U/C:H/I:H/A:N"}]}'
