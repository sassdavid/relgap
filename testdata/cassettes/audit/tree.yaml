        body: '{"id":"GHSA-wv6g-x823-wx9m","summary":"Terragrunt catalog predictable temp symlink clobber","details":"### Summary\n\nTerragrunt''s `terragrunt catalog` command clones each repository referenced in your catalog configuration into a temporary working directory. In affected versions, the clone path it derived was deterministic and sat under the shared system temporary directory, in the form `\u003ctmp\u003e/catalog-\u003cbase64 sha1 of the repo URL\u003e`. Because that path was predictable and Terragrunt followed a symlink already present there instead of rejecting it, a local attacker could plant a symlink at that path and cause Terragrunt to delete a directory and re-clone into it outside the intended temporary root.\n\n### Impact\n\nThis affected users who ran `terragrunt catalog` on a host they shared with other local users or processes they did not fully trust, such as a multi-user server or a shared CI runner. The attack required a local attacker: a separate local user or process able to write to the shared system temporary directory. It was not remotely exploitable, and the victim had to run `terragrunt catalog` while the attacker''s symlink was already in place.\n\nBecause the predictable path depended only on the repository URL being cataloged and the location of the system temporary directory, the attacker could compute it in advance and plant a symlink there before the victim ran the command. When the victim ran `terragrunt catalog`, Terragrunt followed the symlink out of the intended temporary root, deleted an existing `\u003crepoName\u003e` directory under the attacker-chosen parent, and repopulated that path with the cloned repository contents. All of this happened in the security context of the user running Terragrunt.\n\nThe attacker controlled the parent directory the symlink pointed to, but not the leaf name: the leaf was fixed to `\u003crepoName\u003e`, derived from the repository URL the victim cataloged. The primitive was deletion of an existing `\u003crepoName\u003e` directory outside the temporary root, followed by a re-clone into that same path. On a single-user machine with no hostile local processes, exposure was minimal.\n\n### Affected Versions\n\n- Terragrunt `\u003c v1.1.1`\n\n### Patches\n\nThis vulnerability has been resolved in Terragrunt version `v1.1.1`.\n\nAll users are strongly advised to upgrade.\n\n### Workarounds\n\nIf you cannot upgrade immediately, ensure that you do not allow untrusted parties to control the values of `TMPDIR`, `TMP`, and `TEMP` in environments where you run `terragrunt catalog`.\n\n### Technical Details\n\nWhen you run `terragrunt catalog`, the catalog service iterates over the repositories in your configuration and prepares a local clone of each one. In affected versions, for a given repository URL it built a clone path by hashing the URL and joining the result under the shared system temporary directory:\n\n```\n\u003ctmp\u003e/catalog-\u003cbase64 sha1 of the repo URL\u003e\n```\n\nThis path was fully determined by the repository URL and the location of the system temporary directory, so anyone else on the machine who knew which repository a victim would catalog could compute it in advance. The catalog service passed this path into its clone preparation step.\n\nAs a result, an attacker who placed a symlink at `\u003ctmp\u003e/catalog-\u003chash\u003e` pointing at a directory of their choosing caused both the removal and the re-clone to operate through that symlink. Both landed at `\u003cattacker-chosen-parent\u003e/\u003crepoName\u003e`, outside the intended temporary root.\n\nTerragrunt `v1.1.1` no longer derives a predictable clone path, so an attacker can no longer position a symlink at a location known in advance.\n\n## Credit\n\nWe would like to thank ([@br0x2](https://github.com/br0x2)) for discovering and responsibly disclosing this vulnerability.","aliases":["CVE-2026-64672","GO-2026-6768"],"modified":"2026-10-19T21:40:47.510713381Z","published":"2026-10-15T18:21:35Z","database_specific":{"github_reviewed":true,"github_reviewed_at":"2026-10-15T18:21:35Z","nvd_published_at":null,"cwe_ids":["CWE-377","CWE-59"],"severity":"MODERATE"},"references":[{"type":"WEB","url":"https://github.com/gruntwork-io/terragrunt/security/advisories/GHSA-wv6g-x823-wx9m"},{"type":"WEB","url":"https://github.com/gruntwork-io/terragrunt/pull/6438"},{"type":"WEB","url":"https://github.com/gruntwork-io/terragrunt/commit/668891c5a2ad2996f134bb8b00098754674ea94a"},{"type":"PACKAGE","url":"https://github.com/gruntwork-io/terragrunt"}],"affected":[{"package":{"name":"github.com/gruntwork-io/terragrunt","ecosystem":"Go","purl":"pkg:golang/github.com/gruntwork-io/terragrunt"},"ranges":[{"type":"SEMVER","events":[{"introduced":"0"},{"fixed":"1.1.1"}]}],"database_specific":{"source":"https://github.com/github/advisory-database/blob/main/advisories/github-reviewed/2026/10/GHSA-wv6g-x823-wx9m/GHSA-wv6g-x823-wx9m.json"}}],"schema_version":"1.9.0","severity":[{"type":"CVSS_V4","score":"CVSS:4.0/AV:L/AC:L/AT:P/PR:L/UI:P/VC:N/VI:H/VA:H/SC:N/SI:N/SA:N"}]}'
