cs.io/en/stable/operator-manual/upgrading/overview/) documentation.\r\n\r\n## Changelog\r\n### Bug fixes\r\n* de488393833672000e646898a107e8e525058991: fix(server): Avoid error when attempting a second delete operation (cherry-pick #27495 for 3.2) (#27500) (@argo-cd-cherry-pick-bot[bot])\r\n* 81e6c69fae5fc20dab694135c31bd01b112b8f51: fix(ui): handle 401 error in stream (cherry-pick #26917 for 3.2) (#27572) (@argo-cd-cherry-pick-bot[bot])\r\n* eadd52e46ab7b6b624a730ef7cad28ef36727a1b: fix(ui): prevent pod logs viewer crash on stale container index (cherry-pick #27553 for 3.2) (#27563) (@argo-cd-cherry-pick-bot[bot])\r\n### Dependency updates\r\n* 37c360ea97a885b7a20e1af22fa191d04b71fac8: chore(deps): bump SonarSource/sonarqube-scan-action from 5.3.1 to 8.0.0 (cherry pick 27602 to release 3.2) (#27609) (@dudinea)\r\n### Other work\r\n* 9625be3f31f9c3817b75eadda0afd476800c4ce8: Merge commit from fork (@alexmt)\r\n\r\n**Full Changelog**: https://github.com/argoproj/argo-cd/compare/v3.2.10...v3.2.11\r\n\r\n<a href=\"https://argoproj.github.io/cd/\"><img src=\"https://raw.githubusercontent.com/argoproj/argo-site/master/content/pages/cd/gitops-cd.png\" width=\"25%\" ></a>\r\n\r\n"},"r6":{"tagName":"v3.2.12","isDraft":false,"isPrerelease":false,"publishedAt":"2026-05-13T14:34:00Z","url":"https://github.com/argoproj/argo-cd/releases/tag/v3.2.12","description":"> [!IMPORTANT]\r\n> **END OF LIFE NOTICE**\r\n> \r\n> This is the final release of the 3.2 release series. As of August, 4th, this version has reached end of life and will no longer receive bug fixes or security updates.\r\n> \r\n> **Action Required**: Please upgrade to a [supported version](https://argo-cd.readthedocs.io/en/stable/operator-manual/upgrading/overview/) (v3.3, v3.4, or v3.5).\r\n\r\n## Quick Start\r\n\r\n### Non-HA:\r\n\r\n```shell\r\nkubectl create namespace argocd\r\nkubectl apply -n argocd -f https://raw.githubusercontent.com/argoproj/argo-cd/v3.2.12/manifests/install.yaml\r\n```\r\n\r\n### HA:\r\n\r\n```shell\r\nkubectl create namespace argocd\r\nkubectl apply -n argocd -f https://raw.githubusercontent.com/argoproj/argo-cd/v3.2.12/manifests/ha/install.yaml\r\n```\r\n\r\n## Release Signatures and Provenance\r\n\r\nAll Argo CD container images are signed by cosign.  A Provenance is generated for container images and CLI binaries which meet the SLSA Level 3 specifications. See the [documentation](https://argo-cd.readthedocs.io/en/stable/operator-manual/signed-release-assets) on how to verify.\r\n\r\n## Release Notes Blog Post\r\nFor a detailed breakdown of the key changes and improvements in this release, check out the [official blog post](https://blog.argoproj.io/argo-cd-v3-0-release-candidate-a0b933f4e58f)\r\n\r\n## Upgrading\r\n\r\nIf upgrading from a different minor version, be sure to read the [upgrading](https://argo-cd.readthedocs.io/en/stable/operator-manual/upgrading/overview/) documentation.\r\n\r\n## Changelog\r\n### Bug fixes\r\n* 2d1a0bb5507e8fc22b23d7608d56bc0586415b95: fix(lint): unnecessary nesting (cherry-pick #27815 for 3.2) (#27819) (@argo-cd-cherry-pick-bot[bot])\r\n* 4caf2709419b4f172d5a7adbe95d20cb1d86e3bd: fix: export url validation function (#27816) (@crenshaw-dev)\r\n* d6e96fcc00b74d9692301fd18a23d22bf0e802a5: fix: wrap lines toggle causes log lines to overflow container - Fixes [Issue #27586] (cherry-pick #27627 for 3.2) (#27668) (@argo-cd-cherry-pick-bot[bot])\r\n### Dependency updates\r\n* cff8c0320985278c1d2a85860eace168a71f1b04: chore(deps): bump github.com/moby/spdystream from 0.5.0 to 0.5.1 (cherry-pick #27401 for 3.2) (#27735) (@argo-cd-cherry-pick-bot[bot])\r\n### Other work\r\n* 3f7237b5baf57a4b77574e2b0c4c793a7010341a: Merge commit from fork (@pjiang-dev)\r\n* c8df5ff7acc403adcee1256da5d87081cd52f0a6: Merge commit from fork (@blakepettersson)\r\n\r\n**Full Changelog**: https://github.com/argoproj/argo-cd/compare/v3.2.11...v3.2.12\r\n\r\n<a href=\"https://argoproj.github.io/cd/\"><img src=\"https://raw.githubusercontent.com/argoproj/argo-site/master/content/pages/cd/gitops-cd.png\" width=\"25%\" ></a>\r\n\r\n"},"r7":{"tagName":"v3.3.0","isDraft":false,"isPrerelease":false,"publishedAt":"2026-02-02T08:13:58Z","url":"https://github.com/argoproj/argo-cd/releases/tag/v3.3.0","description":"> [!IMPORTANT]\r\n> Before upgrading all types of Argo CD installations to this release, please read the upgrade guide first: \r\n> https://argo-cd.readthedocs.io/en/stable/operator-manual/upgrading/3.2-3.3/#breaking-changes\r\n>\r\n> **Upgrading Argo CD which is managing itself**\r\n>\r\n> Users who have an Argo CD Application that manages their Argo CD installation, must enable `ServerSideApply=true` sync option on this Application in order for the upgrade to succeed. \r\n> \r\n> In some cases, there may be a sync error like `Failed to perform client-side apply migration: failed to perform client-side apply migration on manager kubectl-client-side-apply`. \r\n>\r\n> We are currently working on a long-term fix to this issue, the progress can be tracked here: https://github.com/argoproj/argo-cd/issues/26279\r\n> \r\n> A temporary remediation is to additionally set the `ClientSideApplyMigration=false` sync option on this Application. This solution is temporary and not recommended for the long run because it may result in conflicts between Argo CD K8s field manager and other field managers at a later point in time, and if you use it, you will need to remove it after the above issue is fixed.\r\n>\r\n> More details here: \r\n> https://argo-cd.readthedocs.io/en/stable/user-guide/sync-options/#client-side-apply-migration\r\n\r\n\r\n## Quick Start\r\n\r\n### Non-HA:\r\n\r\n```shell\r\nkubectl create namespace argocd\r\nkubectl apply -n argocd --server-side --force-conflicts -f https://raw.githubusercontent.com/argoproj/argo-cd/v3.3.0/manifests/install.yaml\r\n```\r\n\r\n### HA:\r\n\r\n```shell\r\nkubectl create namespace argocd\r\nkubectl apply -n argocd --server-side --force-conflicts -f https://raw.githubusercontent.com/argoproj/argo-cd/v3.3.0/manifests/ha/install.yaml\r\n```\r\n\r\n## Release Signatures and Provenance\r\n\r\nAll Argo CD container images are signed by cosign.  A Provenance is generated for container images and CLI binaries which meet the SLSA Level 3 specifications. See the [documentation](https://argo-cd.readthedocs.io/en/stable/operator-manual/signed-release-assets) on how to verify.\r\n\r\n## Release Notes Blog Post\r\nFor a detailed breakdown of the key changes and improvements in this release, check out the [official blog post](https://blog.argoproj.io/argo-cd-3-3-release-candidate-00e99f7b7daa).\r\n\r\n## Upgrading\r\n\r\nIf upgrading from a different minor version, be sure to read the [upgrading](https://argo-cd.readthedocs.io/en/stable/operator-manual/upgrading/overview/) documentation.\r\n\r\n## Changelog\r\n### Features\r\n* ce2fb703a6a7b5e0b5e8ee3e1f1b34747dcec844: Revert \"feat: Ability to create custom labels for namespaces created … (#455) (@pasha-codefresh)\r\n* e50dd008fd009121bd8429dc348ebba84e41ff64: feat(actions): Add cloudnativepg reload, restart, promote, suspend and resume actions (#24192) (@rouke-broersma)\r\n* 3ee16c08600668a62beb08218b45574b4f982c03: feat(actions): PullRequest merge action (#24823) (@crenshaw-dev)\r\n* 0c77f3ca1ff6e8ff8c0871299f01106723f2f45c: feat(actions): add icons to apps actions (#25343) (#25344) (@rickbrouwer)\r\n* a64933f11ddd7536fbb4c6254e714737d2ce30e7: feat(actions): add pause action for KEDA ScaledObject and ScaledJob (#25301) (#25302) (@rickbrouwer)\r\n* 97d50a14a6be916a8b68f8bce5f39f3b19d81899: feat(appset): add pprof endpoints (#25044) (@rumstead)\r\n* 482440b1315b8b5c617e712ec715fecd0b55d90f: feat(appset): use clone instead of replace on sprig templates to reduce function copies (#25576) (@rumstead)\r\n* 64421a7acc88915faa315691d6aed594da41a1f9: feat(ci): add run failure link to cherry pick comment (#24838) (@crenshaw-dev)\r\n* 46783614d5a10feb671d5c55e9c8e74f22be4560: feat(cli): Add additional examples to `proj list` command (#25169) (@onasser1)\r\n* ac12ab91f3a25f782f0658c0e25880bd8bf9b5ad: feat(cli): Updated CLI to show  Plugins during tab completion (#24758) (@christianh814)\r\n* 53c35423ab701a674d35d76ae4f3b0a3d9f44140: feat(cli): add powershell completion (#25595) (@onasser1)\r\n* f866959fe1eb596fc381f68e688a010a159980cb: feat(cli): added support for filtering by group in app get-resource CLI command (#25495) (@sabre1041)\r\n* ac1a2f8536701cc23684632a2d1bc3b20408b1a8: feat(health): add grafana-org-operator Health (#25662) (@sathieu)\r\n* 0c6fa288c2ad172cda5d0f8a03460c625681a80a: feat(hydrator): add inline parameter support to Source Hydrator (#24228) (#24277) (@sangyeong01)\r\n* dea7ead9a3ca3ea9e7093e927b209b946c3a4dd4: feat(hydrator): avoid unnecessary repo-server calls (#25150) (@pbhatnagar-oss)\r\n* 6cd30d3b997cc4d8776059dc4cd1448652f50275: feat(hydrator): don''t push commits if manifests don''t change (#25056) (@pbhatnagar-oss)\r\n* fe02a8f410b2ad37bd7faacbaec4668018628f64: feat(redis): Secrets credentials via volume mount  (#24597) (@Mangaal)\r\n* bbc3e99aa424d404b78ad862d10e8cd76bb267ce: feat(repo): add support for github app authentication without installationid (#25339) (#25374) (@pbhatnagar-oss)\r\n* 1ae13b2896e9668662324753c6c41239956778ca: feat(ui): conditionally render app view extensions (#25132) (@jwinters01)\r\n* afaf16b80847e9dfde3e61131e279178875ab926: feat(ui): hide sync option ''replace'' if sync with replace is disabled in the server (issue no. #22625) (#22647) (@jan-mrm)\r\n* 528482c87ab011894f503ff5c287bf3769b3dc15: feat(ui): implement abstraction layer for appset ui support (#24916) (@pjiang-dev)\r\n* b74c7aa31f5f3c49508f56a1819ecdac0f8727c2: feat(ui): improve sync warnings (#25524) (@jwinters01)\r\n* 90b3e856a6d6d462baf8d9490496dae50e2b20f9: feat(ui): support custom icons (#20864) (@crenshaw-dev)\r\n* a56a8030319ee3af0f6287865133403f8f9ad380: feat: Ability to create custom labels for namespaces created with syncOptions CreateNamespa