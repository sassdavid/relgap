ub.com/denis256) in [#6590](https://github.com/gruntwork-io/terragrunt/pull/6590)\\r\\n- chore: Continuing clean-up of `go test ./...` on a fresh clone of the repo by [@yhakbar](https://github.com/yhakbar) in [#6553](https://github.com/gruntwork-io/terragrunt/pull/6553)\\r\\n- chore: Fixing usage of deprecated aws sdk by [@yhakbar](https://github.com/yhakbar) in [#6600](https://github.com/gruntwork-io/terragrunt/pull/6600)\\r\\n- chore: Cleaning up profile tests per feedback in #6553 by [@yhakbar](https://github.com/yhakbar) in [#6599](https://github.com/gruntwork-io/terragrunt/pull/6599)\\r\\n- chore: Clean-up by [@yhakbar](https://github.com/yhakbar) in [#6584](https://github.com/gruntwork-io/terragrunt/pull/6584)\\r\\n- chore: Addressing feedback from #6365 and #6355 by [@yhakbar](https://github.com/yhakbar) in [#6603](https://github.com/gruntwork-io/terragrunt/pull/6603)\\r\\n- chore: Register the `block-iteration` experiment by [@yhakbar](https://github.com/yhakbar) in [#6562](https://github.com/gruntwork-io/terragrunt/pull/6562)\\r\\n- chore: address review feedback from #6531 by [@denis256](https://github.com/denis256) in [#6609](https://github.com/gruntwork-io/terragrunt/pull/6609)\\r\\n- chore: Addressing flake in `TestCatalogJSONLFormatCleansUpOnEarlyExit` by [@yhakbar](https://github.com/yhakbar) in [#6613](https://github.com/gruntwork-io/terragrunt/pull/6613)\\r\\n- chore: updated TestDiscovery_GraphConcurrentConfigAccessWithRacing to use VFS by [@denis256](https://github.com/denis256) in [#6622](https://github.com/gruntwork-io/terragrunt/pull/6622)\\r\\n- chore: Adding expansion detection and internal expansion logic by [@yhakbar](https://github.com/yhakbar) in [#6565](https://github.com/gruntwork-io/terragrunt/pull/6565)\\r\\n- chore: Adding expansion blocks to the configs that accept expansion by [@yhakbar](https://github.com/yhakbar) in [#6605](https://github.com/gruntwork-io/terragrunt/pull/6605)\\r\\n- chore: Threading venv through getters and `hcl