        body: "{\"data\":{\"repository\":{\"r0\":{\"tagName\":\"v1.1.0\",\"isDraft\":false,\"isPrerelease\":false,\"publishedAt\":\"2026-07-01T08:49:32Z\",\"url\":\"https://github.com/gruntwork-io/terragrunt/releases/tag/v1.1.0\",\"description\":\"## ✨ New Features\\r\\n\\r\\n## Stack dependencies\\r\\n\\r\\nA [stack](https://docs.terragrunt.com/features/stacks) generates a tree of units from a single `terragrunt.stack.hcl` file. Wiring one of those units to another used to mean defining `dependency` blocks in your catalog and threading dependency paths through `values`. Stack dependencies let you declare those relationships up front instead.\\r\\n\\r\\nAdd an `autoinclude` block inside a `unit` or `stack` block, and Terragrunt generates a partial configuration (a `terragrunt.autoinclude.hcl` file) next to the generated `terragrunt.hcl` or `terragrunt.stack.hcl` that's automatically merged into the unit or stack definition. The new `unit.<name>.path` and `stack.<name>.path` references resolve to generated paths, so you don't have to hardcode them:\\r\\n\\r\\n```hcl\\r\\n# terragrunt.stack.hcl\\r\\nunit \\\"vpc\\\" {\\r\\n  source = \\\"github.com/acme/catalog//units/vpc\\\"\\r\\n  path   = \\\"vpc\\\"\\r\\n}\\r\\n\\r\\nunit \\\"app\\\" {\\r\\n  source = \\\"github.com/acme/catalog//units/app\\\"\\r\\n  path   = \\\"app\\\"\\r\\n\\r\\n  autoinclude {\\r\\n    dependency \\\"vpc\\\" {\\r\\n      config_path = unit.vpc.path\\r\\n    }\\r\\n\\r\\n    inputs = {\\r\\n      vpc_id = dependency.vpc.outputs.vpc_id\\r\\n    }\\r\\n  }\\r\\n}\\r\\n```\\r\\n\\r\\nAnything that's valid in a unit configuration is valid in its `autoinclude` block, so you can also patch catalog units with configuration they don't ship with, like retry rules:\\r\\n\\r\\n```hcl\\r\\n# terragrunt.stack.hcl\\r\\nunit \\\"app\\\" {\\r\\n  source = \\\"github.com/acme/catalog//units/app\\\"\\r\\n  path   = \\\"app\\\"\\r\\n\\r\\n  autoinclude {\\r\\n    errors {\\r\\n      retry \\\"transient_errors\\\" {\\r\\n        retryable_errors   = [\\\".*Error: transient network issue.*\\\"]\\r\\n        max_attempts       = 3\\r\\n        sleep_interval_sec = 5\\r\\n      }\\r\\n    }\\r\\n  }\\r\\n}\\r\\n```\\r\\n\\r\\nThe same works for nested stacks: an `autoinclude` block inside a `stack` block patches the generated `terragrunt.stack.hcl`, so you can, for example, add an extra unit to one environment without forking the stack in your catalog.\\r\\n\\r\\nStack configurations also gained two capabilities along the way:\\r\\n\\r\\n- `include` blocks now work in `terragrunt.stack.hcl` files, so shared stack configuration can live in a parent folder.\\r\\n- `dependency` blocks can target stack directories, and the run queue expands them to the units inside. Note that this relationship only goes one way: units can depend on stacks, but stacks cannot depend on stacks or units.\\r\\n\\r\\nSee the [stacks documentation](https://docs.terragrunt.com/features/stacks/explicit) for the full reference. Previously gated behind the `stack-dependencies` experiment, all of this is now enabled by default.\\r\\n\\r\\n## Content Addressable Store (CAS)\\r\\n\\r\\nThe [Content Addressable Store (CAS)](https://docs.terragrunt.com/features/caching/cas) deduplicates source downloads across configurations. It addresses repositories and modules by their content, stores them locally, and serves later requests from that local store instead of repeating the fetch. This speeds up catalog cloning, OpenTofu/Terraform source fetching, and stack generation, and identical files occupy disk space once regardless of how many configurations use them.\\r\\n\\r\\nThe CAS is no longer limited to Git. It also deduplicates HTTP, Amazon S3, Google Cloud Storage, Mercurial, and SMB sources, along with OpenTofu/Terraform registry sources fetched via `tfr://`. See [supported sources](https://docs.terragrunt.com/features/caching/cas#supported-sources) for how each one resolves and deduplicates content.\\r\\n\\r\\nCAS is enabled by default. Use the `--no-cas` flag (or `TG_NO_CAS=true`) to opt out of it for a run:\\r\\n\\r\\n```bash\\r\\nterragrunt run --all --no-cas -- plan\\r\\n```\\r\\n\\r\\nTwo new attributes give you finer control, and both default to off:\\r\\n\\r\\n- `update_source_with_cas` makes a generated stack self-contained. Set it on a `unit`, `stack`, or `terraform` block with a relative `source`, and `terragrunt stack generate` rewrites that source into a content-addressed `cas::` reference, so the generated tree no longer depends on the surrounding repository layout. Catalog authors can keep relative paths in their sources and still ship a portable, reproducible stack:\\r\\n\\r\\n  ```hcl\\r\\n  # stacks/networking/terragrunt.stack.hcl\\r\\n  unit \\\"vpc\\\" {\\r\\n    source = \\\"../..//units/vpc\\\"\\r\\n    path   = \\\"vpc\\\"\\r\\n\\r\\n    update_source_with_cas = true\\r\\n  }\\r\\n  ```\\r\\n\\r\\n  After `terragrunt stack generate`, the relative path is replaced by a reference to the exact tree the CAS stored:\\r\\n\\r\\n  ```hcl\\r\\n  # Generated output\\r\\n  unit \\\"vpc\\\" {\\r\\n    source = \\\"cas::sha1:f39ea0ebf891c9954c89d07b73b487ff938ef08b\\\"\\r\\n    path   = \\\"vpc\\\"\\r\\n\\r\\n    update_source_with_cas = true\\r\\n  }\\r\\n  ```\\r\\n\\r\\n- `mutable` controls how the CAS places fetched content on disk. By default, the CAS hard links files from its shared store into `.terragrunt-cache` and marks them read-only, which is fast and uses no extra space, but means the files can't be edited in place. Set `mutable = true` on a `terraform` block to copy the content instead, making the working tree safe to edit at the cost of extra I/O and disk space:\\r\\n\\r\\n  ```hcl\\r\\n  # units/vpc/terragrunt.hcl\\r\\n  terraform {\\r\\n    source = \\\"github.com/acme/catalog//modules/vpc\\\"\\r\\n\\r\\n    mutable = true\\r\\n  }\\r\\n  ```\\r\\n\\r\\nPreviously gated behind the `cas` experiment, the CAS no longer requires `--experiment cas`.\\r\\n\\r\\n## Redesigned `terragrunt catalog`\\r\\n\\r\\nThe [`catalog`](https://docs.terragrunt.com/features/catalog) command has been redesigned. It now starts without any configuration, discovers components across your catalog repositories in the background, and streams them into the TUI as they're found.\\r\\n\\r\\nDiscovery is no longer limited to a `modules/` directory; components can live anywhere in a catalog repository. To control what gets discovered, add a `.terragrunt-catalog-ignore` file with `.gitignore`-style globs for the paths you want filtered out.\\r\\n\\r\\nComponents in the TUI now carry metadata to help you navigate a large catalog: each one shows a kind label (`template`, `stack`, `unit`, or `module`) and optional tags defined in the front-matter of its `README.md`. From the component list, press `s` to open a new screen that interactively collects the values used to [scaffold](https://docs.terragrunt.com/features/catalog/scaffold) the component into your repository.\\r\\n\\r\\nPreviously gated behind the `catalog-redesign` experiment, the redesigned catalog is now the default `terragrunt catalog` experience.\\r\\n\\r\\n## Reading detection for local module sources\\r\\n\\r\\nTerragrunt can select units by the files they read, which is the basis of change-based runs in CI. Previously, pointing a unit's `terraform` block at a local directory didn't mark the files inside that directory as read, so a change to the module wouldn't select the unit.\\r\\n\\r\\nWhen a unit's source is a local module, Terragrunt now records the module's `*.tf`, `*.tf.json`, `*.hcl`, `*.tofu`, and `*.tofu.json` files as read by that unit, so `--filter 'reading=<path>'` and `--queue-include-units-reading` select the unit when a module file changes:\\r\\n\\r\\n```bash\\r\\nterragrunt run --all --filter 'reading=./modules/vpc/main.tf' -- plan\\r\\n```\\r\\n\\r\\nFor files that reading detection doesn't track on its own, the new [`mark_glob_as_read()`](https://docs.terragrunt.com/reference/hcl/functions#mark_glob_as_read) HCL function expands a glob and marks every matching file as read in one call:\\r\\n\\r\\n```hcl\\r\\nlocals {\\r\\n  configs = mark_glob_as_read(\\\"${get_terragrunt_dir()}/config/{*.yaml,**/*.yaml}\\\")\\r\\n}\\r\\n```\\r\\n\\r\\nExisting pipelines built on `--queue-include-units-reading` or `reading=` filters may select more units than before, because changes to local module files now count as reads. Previously gated behind the `mark-many-as-read` experiment, these behaviors no longer require `--experiment mark-many-as-read`.\\r\\n\\r\\n## Skip auth during discovery with `--no-discovery-auth-provider-cmd`\\r\\n\\r\\nBy default, Terragrunt runs your [`--auth-provider-cmd`](https://docs.terragrunt.com/features/units/authentication) once for every unit it discovers, so HCL functions that need credentials resolve correctly during parsing. In a large repository, that can mean hundreds of invocations before any unit runs, which can dominate wall-clock time on change-based runs.\\r\\n\\r\\nThe `--no-discovery-auth-provider-cmd` flag (env: `TG_NO_DISCOVERY_AUTH_PROVIDER_CMD`) skips those invocations during the discovery phase, leaving auth to run only for the units that actually execute:\\r\\n\\r\\n```bash\\r\\nterragrunt run --all \\\\\\r\\n  --no-discovery-auth-provider-cmd \\\\\\r\\n  --queue-include-units-reading=./changed-file.txt \\\\\\r\\n  -- plan\\r\\n```\\r\\n\\r\\n> [!WARNING]\\r\\n> Use this only when you know parsing resolves without credentials. Units whose configuration depends on values from `--auth-provider-cmd` during discovery (for example, via `get_aws_account_id()`) will fail to parse when the flag is set.\\r\\n\\r\\nPreviously gated behind the `opt-out-auth` experiment, the flag now works without `--experiment opt-out-auth`.\\r\\n\\r\\n## Run queue displayed as a dependency tree\\r\\n\\r\\nBefore a `run --all`, Terragrunt lists the units it's about to run. That list now renders as a dependency tree by default instead of a flat list, with units nested under their dependencies, so the run order and the relationships between units are visible before anything executes:\\r\\n\\r\\n```text\\r\\nThe following units will be run, starting with dependencies and then their dependents:\\r\\n.\\r\\n├── monitoring\\r\\n╰── vpc\\r\\n    ╰── database\\r\\n        ╰── backend-app\\r\\n```\\r\\n\\r\\nThe header adapts to direction: dependencies come before dependents on apply, and the order reverses on destroy.\\r\\n\\r\\nPreviously gated behind the `dag-queue-display` experiment, the tree display no longer requires `--experiment dag-queue-display`.\\r\\n\\r\\n## \U0001F4A1 Tips Added\\r\\n\\r\\n## Tip when filtering a stack leaves nested stacks ungenerated\\r\\n\\r\\n`terragrunt stack generate --filter './my-stack | type=stack'` generates only the selected\\r\\nstack, not the nested stacks it contains, which can be surprising for a stack of stacks.\\r\\nWhen a non-glob `| type=stack` filter leaves a stack's nested stacks ungenerated, Terragrunt\\r\\nnow prints a tip showing how to generate them too, for example\\r\\n`--filter './my-stack | type=stack' --filter './my-stack/** | type=stack'`.\\r\\n\\r\\n## \U0001F41B Bug Fixes\\r\\n\\r\\n## Fix `permission denied` when generated files overwrite CAS-materialized files\\r\\n\\r\\nWith the CAS enabled, Terragrunt fetches sources as read-only files. Writing a generated file over one of them no longer fails with `permission denied`:\\r\\n\\r\\n- Files from `generate` blocks with `if_exists = \\\"overwrite\\\"`, when the module ships the target file (for example, its own `versions.tf`).\\r\\n- `terragrunt.values.hcl`, when the unit or stack source already contains one.\\r\\n- `terragrunt.autoinclude.hcl`, when the unit or stack source already contains one.\\r\\n- `.terraform.lock.hcl`, when the provider cache server updates a committed lock file during `init -upgrade`.\\r\\n\\r\\nIn each case, the read-only file is replaced with a writable one, and the shared CAS store is never modified.\\r\\n\\r\\n## Fix `permission denied` when CAS fetches a git source across filesystems\\r\\n\\r\\nWith the CAS enabled, fetching a `git::` source could fail with `permission denied` on `.git/HEAD` or `.git/config`, sending Terragrunt back to the standard getter. It happened when the CAS store and the module's working directory sit on different filesystems, so the files are copied rather than hard-linked, and a read-only leftover from an interrupted run was in the way. Terragrunt now recovers from the leftover and completes the fetch.\\r\\n\\r\\n## Reject `update_source_with_cas` on a `terraform` block when CAS is disabled\\r\\n\\r\\n`terragrunt stack generate --no-cas` now fails when a generated unit's `terraform` block sets `update_source_with_cas = true`, instead of silently emitting the unit with its relative `source` unchanged. The relative source has no meaning once CAS is disabled, so the generated unit could not resolve its module. This matches the existing behavior for the same attribute on `unit` and `stack` blocks, and for a `run` invoked with `--no-cas`.\\r\\n\\r\\n## Apply `extra_arguments` env vars when resolving `dependency` outputs\\r\\n\\r\\nResolving a `dependency` block's outputs now applies the `env_vars` from the unit's `terraform` `extra_arguments` blocks whose `commands` include `output`.\\r\\n\\r\\n## Resolve `dependency` outputs for units whose `before_hook` references a dependency\\r\\n\\r\\nResolving a unit's `dependency` outputs no longer evaluates that unit's `terraform` hooks, so a `before_hook` (or `after_hook`) that interpolates `${dependency.<name>.outputs.<key>}` no longer fails downstream units with `There is no variable named \\\"dependency\\\"`. Dependency output resolution still applies the unit's `extra_arguments` `env_vars` and `source`.\\r\\n\\r\\n## Select units reading added or deleted glob files in Git-based filters\\r\\n\\r\\nGit-based filters (for example `terragrunt run --all --filter '[HEAD^1...HEAD]' -- plan`) now select units\\r\\nthat read an added or deleted file through `mark_glob_as_read`, even when that file lives outside the unit's\\r\\nown directory. Previously only modified files outside a unit reached those units; adding or deleting a file\\r\\nthe glob matched left the reading unit out of the run, so its real config change was skipped. Added files are\\r\\nmatched against the newer reference, and deleted files against the older one where the file still exists.\\r\\n\\r\\n## `mark_glob_as_read` constrains its walk to a boundary\\r\\n\\r\\n`mark_glob_as_read` now confines glob expansion to a boundary directory. By default the boundary is the enclosing Git repository root; outside a Git repository it is unset. A pattern whose walk would begin outside the boundary returns an error instead of expanding.\\r\\n\\r\\nThis bounds patterns that resolve higher than intended. For example, `\\\"${local.dir}/{*.yaml}\\\"` becomes `/{*.yaml}` when `local.dir` is empty, which previously walked the entire filesystem. A `? :` conditional does not prevent this, because HCL evaluates both branches of a conditional before selecting one. Wrapping the call in `try` lets the error fall back to a default:\\r\\n\\r\\n```hcl\\r\\nlocals {\\r\\n  files = sort(try(mark_glob_as_read(\\\"${local.dir}/{*.yaml,*.yml,*.json}\\\"), []))\\r\\n}\\r\\n```\\r\\n\\r\\nPass a leading `--terragrunt-boundary` argument to set the boundary explicitly, for example to scope the walk to a subdirectory or to widen it to the filesystem root:\\r\\n\\r\\n```hcl\\r\\nlocals {\\r\\n  scoped = mark_glob_as_read(\\\"--terragrunt-boundary=/etc/terragrunt\\\", \\\"/etc/terragrunt/{*.yaml}\\\")\\r\\n  all    = mark_glob_as_read(\\\"--terragrunt-boundary=/\\\", \\\"/{*.yaml}\\\")\\r\\n}\\r\\n```\\r\\n\\r\\n## Scaffold only detects variables in the module directory\\r\\n\\r\\n`terragrunt scaffold` now reads input variables from the module directory itself, matching what OpenTofu and Terraform load for a root module. Previously it scanned subdirectories too, so `variable` blocks defined in nested modules or examples leaked into the scaffolded inputs even though the module never exposes them.\\r\\n\\r\\n## Resolve interpolated object keys in autoinclude blocks\\r\\n\\r\\n`terragrunt stack generate` now resolves interpolated object keys in `autoinclude` blocks (for example\\r\\n`{ \\\"${local.prefix}_key\\\" = ... }`), even when the value references `dependency.*`. Previously the generated\\r\\nunit kept the key verbatim, leaking a stack-only reference that is not valid in the unit scope.\\r\\n\\r\\n## Fix panic on non-string literal interpolation in `autoinclude` templates\\r\\n\\r\\n`terragrunt stack generate` no longer panics when an `autoinclude` template interpolates a non-string literal (for example `\\\"${0}\\\"` or `\\\"${true}\\\"`) alongside a `dependency.*` reference. The interpolated literal is now rendered to its string form (`${0}` becomes `0`) and the dependency reference is preserved for the unit.\\r\\n\\r\\n## Resolve transitive `autoinclude` dependencies on a stack directory\\r\\n\\r\\n`run --all` no longer fails with \\\"does not contain a terragrunt.hcl file\\\" when an `autoinclude` dependency points at a stack directory (one holding `terragrunt.stack.hcl`) and the unit is reached transitively through another unit. The dependency cycle check now skips a target with no unit config, matching the direct dependency case.\\r\\n\\r\\n## \U0001F9EA Experiments Updated\\r\\n\\r\\n## Six experiments completed\\r\\n\\r\\nThe following experiments graduated to general availability in this release, and the features they gated are now enabled by default:\\r\\n\\r\\n- `stack-dependencies`\\r\\n- `cas`\\r\\n- `catalog-redesign`\\r\\n- `mark-many-as-read`\\r\\n- `opt-out-auth`\\r\\n- `dag-queue-display`\\r\\n\\r\\nEach feature is described in the New Features section above.\\r\\n\\r\\nThe corresponding `--experiment` flags (and `TG_EXPERIMENT` values) are no longer needed. Passing one still works, but emits a warning about the completed experiment, so you can drop it at your convenience.\\r\\n\\r\\nThank you to everyone who ran these experiments early and filed the feedback that got them here.\\r\\n\\r\\n## ⚙️ Process Updates\\r\\n\\r\\n## Immutable releases\\r\\n\\r\\nStarting with this release, Terragrunt releases are published as [immutable releases](https://docs.github.com/en/code-security/concepts/supply-chain-security/immutable-releases) on GitHub. Once a release is published, its tag and assets can no longer be modified or deleted, so the binary you download is guaranteed to be the same binary that was uploaded when the release was published.\\r\\n\\r\\nSee the [releases process documentation](https://docs.terragrunt.com/process/releases#immutable-releases) for details, and [Verifying releases with the GitHub CLI](https://docs.terragrunt.com/getting-started/install#verifying-releases-with-the-github-cli) for how to check a download against the release attestation.\\r\\n\\r\\n## Install script verifies release attestations\\r\\n\\r\\nThe install script now checks downloaded release assets against the release attestation that ships with [immutable releases](https://docs.terragrunt.com/process/releases#immutable-releases). For releases starting with `v1.1.0`, when an authenticated [GitHub CLI](https://cli.github.com/) (v2.81.0 or later) is available, the script verifies the checksums file and the binary against the attestation before installing, and aborts if either does not match the published release. The check is skipped with a warning when `gh` is unavailable, too old, or unauthenticated. Use `--no-verify-attestation` to opt out.\\r\\n\\r\\n## Pull Requests\\r\\n\\r\\n### ✨ Features\\r\\n\\r\\n- feat: Tip how to run a stack's units when a stack filter matches no units by [@denis256](https://github.com/denis256) in [#6387](https://github.com/gruntwork-io/terragrunt/pull/6387)\\r\\n\\r\\n### \U0001F41B Bug Fixes\\r\\n\\r\\n- fix: autoincludes variables interpolation by [@denis256](https://github.com/denis256) in [#6318](https://github.com/gruntwork-io/terragrunt/pull/6318)\\r\\n- fix: generate overwrite of read-only CAS-materialized files by [@denis256](https://github.com/denis256) in [#6329](https://github.com/gruntwork-io/terragrunt/pull/6329)\\r\\n- fix: CAS integration with committed module lockfiles by [@yhakbar](https://github.com/yhakbar) in [#6330](https://github.com/gruntwork-io/terragrunt/pull/6330)\\r\\n- fix: improved resolving of complex objects in keys by [@denis256](https://github.com/denis256) in [#6317](https://github.com/gruntwork-io/terragrunt/pull/6317)\\r\\n- fix: Fixing `update_source_with_cas` integration with `--no-cas` by [@yhakbar](https://github.com/yhakbar) in [#6363](https://github.com/gruntwork-io/terragrunt/pull/6363)\\r\\n- fix: Adding support for adding/deleting files in Git diffs by [@yhakbar](https://github.com/yhakbar) in [#6352](https://github.com/gruntwork-io/terragrunt/pull/6352)\\r\\n- fix: Adding `--terragrunt-boundary` to `mark_glob_as_read` by [@yhakbar](https://github.com/yhakbar) in [#6351](https://github.com/gruntwork-io/terragrunt/pull/6351)\\r\\n- fix: Only detect variables in root directory of module by [@yhakbar](https://github.com/yhakbar) in [#6381](https://github.com/gruntwork-io/terragrunt/pull/6381)\\r\\n- fix: resolve transitive autoinclude dependency on a stack directory by [@denis256](https://github.com/denis256) in [#6389](https://github.com/gruntwork-io/terragrunt/pull/6389)\\r\\n- fix: apply extra_arguments env_vars when resolving dependency outputs by [@denis256](https://github.com/denis256) in [#6396](https://github.com/gruntwork-io/terragrunt/pull/6396)\\r\\n- fix: Fixing indenter style by [@yhakbar](https://github.com/yhakbar) in [#6402](https://github.com/gruntwork-io/terragrunt/pull/6402)\\r\\n- fix: Fixing legacy Windows per-drive key for environment variables by [@yhakbar](https://github.com/yhakbar) in [#6412](https://github.com/gruntwork-io/terragrunt/pull/6412)\\r\\n- fix: Fixing Git materialization race HEAD update by [@yhakbar](https://github.com/yhakbar) in [#6411](https://github.com/gruntwork-io/terragrunt/pull/6411)\\r\\n- fix: fixed reference of dependency outputs in terraform hooks by [@denis256](https://github.com/denis256) in [#6423](https://github.com/gruntwork-io/terragrunt/pull/6423)\\r\\n- fix: Fixing deleted changed files by [@yhakbar](https://github.com/yhakbar) in [#6424](https://github.com/gruntwork-io/terragrunt/pull/6424)\\r\\n\\r\\n### \U0001F4D6 Documentation\\r\\n\\r\\n- docs: Documenting `--parallelism` tweaking considerations better by [@yhakbar](https://github.com/yhakbar) in [#6313](https://github.com/gruntwork-io/terragrunt/pull/6313)\\r\\n- docs: Adding TGS 'Terragrunt at scale' page by [@yhakbar](https://github.com/yhakbar) in [#6307](https://github.com/gruntwork-io/terragrunt/pull/6307)\\r\\n- docs: `v1.1.0` changelog polish by [@yhakbar](https://github.com/yhakbar) in [#6333](https://github.com/gruntwork-io/terragrunt/pull/6333)\\r\\n- docs: Improving performance docs by [@yhakbar](https://github.com/yhakbar) in [#6332](https://github.com/gruntwork-io/terragrunt/pull/6332)\\r\\n- docs: Adding immutable releases docs by [@yhakbar](https://github.com/yhakbar) in [#6337](https://github.com/gruntwork-io/terragrunt/pull/6337)\\r\\n- docs: Cleaning up 1.1.0 docs by [@yhakbar](https://github.com/yhakbar) in [#6339](https://github.com/gruntwork-io/terragrunt/pull/6339)\\r\\n- docs: Updating provider size claims for provider cache server docs by [@yhakbar](https://github.com/yhakbar) in [#6341](https://github.com/gruntwork-io/terragrunt/pull/6341)\\r\\n- docs: Documenting Discovery as a term by [@yhakbar](https://github.com/yhakbar) in [#6359](https://github.com/gruntwork-io/terragrunt/pull/6359)\\r\\n- docs: Cleaning up catalog tabs docs by [@yhakbar](https://github.com/yhakbar) in [#6369](https://github.com/gruntwork-io/terragrunt/pull/6369)\\r\\n\\r\\n### \U0001F9F9 Chores\\r\\n\\r\\n- chore: marking as completed stack dependencies experiment by [@denis256](https://github.com/denis256) in [#6249](https://github.com/gruntwork-io/terragrunt/pull/6249)\\r\\n- chore: Completing `mark-many-as-read` experiment by [@yhakbar](https://github.com/yhakbar) in [#6310](https://github.com/gruntwork-io/terragrunt/pull/6310)\\r\\n- chore: Completing `cas` experiment by [@yhakbar](https://github.com/yhakbar) in [#6254](https://github.com/gruntwork-io/terragrunt/pull/6254)\\r\\n- chore: Addressing feedback from #6254 by [@yhakbar](https://github.com/yhakbar) in [#6324](https://github.com/gruntwork-io/terragrunt/pull/6324)\\r\\n- chore: Completing `dag-queue-display` experiment by [@yhakbar](https://github.com/yhakbar) in [#6320](https://github.com/gruntwork-io/terragrunt/pull/6320)\\r\\n- chore: Completing `opt-out-auth` experiment by [@yhakbar](https://github.com/yhakbar) in [#6321](https://github.com/gruntwork-io/terragrunt/pull/6321)\\r\\n- chore: Dropping `go-git` by [@yhakbar](https://github.com/yhakbar) in [#6325](https://github.com/gruntwork-io/terragrunt/pull/6325)\\r\\n- chore: Addressing PR #6325 feedback by [@yhakbar](https://github.com/yhakbar) in [#6335](https://github.com/gruntwork-io/terragrunt/pull/6335)\\r\\n- chore: bump cicd to use opentofu 1.12.2 by [@denis256](https://github.com/denis256) in [#6343](https://github.com/gruntwork-io/terragrunt/pull/6343)\\r\\n- chore: Signing GHA update by [@denis256](https://github.com/denis256) in [#6340](https://github.com/gruntwork-io/terragrunt/pull/6340)\\r\\n- chore: multiple dependencies update by [@denis256](https://github.com/denis256) in [#6356](https://github.com/gruntwork-io/terragrunt/pull/6356)\\r\\n- chore: Updating CI w/ Terragrunt guide to have more accurate screenshots by [@yhakbar](https://github.com/yhakbar) in [#6357](https://github.com/gruntwork-io/terragrunt/pull/6357)\\r\\n- chore: drop usage of github.com/NYTimes/gziphandler by [@denis256](https://github.com/denis256) in [#6364](https://github.com/gruntwork-io/terragrunt/pull/6364)\\r\\n- chore(deps): bump astro from 6.3.2 to 6.4.6 in /docs by [@dependabot[bot]](https://github.com/dependabot[bot]) in [#6366](https://github.com/gruntwork-io/terragrunt/pull/6366)\\r\\n- chore: Completing `catalog-redesign` experiment by [@yhakbar](https://github.com/yhakbar) in [#6271](https://github.com/gruntwork-io/terragrunt/pull/6271)\\r\\n- chore: Bumping JS dependencies by [@yhakbar](https://github.com/yhakbar) in [#6368](https://github.com/gruntwork-io/terragrunt/pull/6368)\\r\\n- chore: Adding release attestation verification to install script by [@yhakbar](https://github.com/yhakbar) in [#6344](https://github.com/gruntwork-io/terragrunt/pull/6344)\\r\\n- chore: Addressing weekly test stats by [@yhakbar](https://github.com/yhakbar) in [#6354](https://github.com/gruntwork-io/terragrunt/pull/6354)\\r\\n- chore: Addressing #6351 feedback by [@yhakbar](https://github.com/yhakbar) in [#6373](https://github.com/gruntwork-io/terragrunt/pull/6373)\\r\\n- chore: Adding mise.toml lockfile by [@yhakbar](https://github.com/yhakbar) in [#6372](https://github.com/gruntwork-io/terragrunt/pull/6372)\\r\\n- chore: Making progress on `lll` by [@yhakbar](https://github.com/yhakbar) in [#6377](https://github.com/gruntwork-io/terragrunt/pull/6377)\\r\\n- chore: autoinclude fuzzing tests improvements by [@denis256](https://github.com/denis256) in [#6342](https://github.com/gruntwork-io/terragrunt/pull/6342)\\r\\n- chore: Expand pure testing through venv by [@yhakbar](https://github.com/yhakbar) in [#6090](https://github.com/gruntwork-io/terragrunt/pull/6090)\\r\\n- chore: Dropping `TestWindowsTflintIsInvoked` by [@yhakbar](https://github.com/yhakbar) in [#6382](https://github.com/gruntwork-io/terragrunt/pull/6382)\\r\\n- chore: Continuing with progress on `lll` #2 by [@yhakbar](https://github.com/yhakbar) in [#6385](https://github.com/gruntwork-io/terragrunt/pull/6385)\\r\\n- chore:  added CICD guard for detecting not run tests by [@denis256](https://github.com/denis256) in [#6383](https://github.com/gruntwork-io/terragrunt/pull/6383)\\r\\n- chore: Addressing weekly tests stats (2026-06-22) by [@yhakbar](https://github.com/yhakbar) in [#6390](https://github.com/gruntwork-io/terragrunt/pull/6390)\\r\\n- chore: Addressing #6390 feedback by [@yhakbar](https://github.com/yhakbar) in [#6391](https://github.com/gruntwork-io/terragrunt/pull/6391)\\r\\n- chore: go deps update by [@denis256](https://github.com/denis256) in [#6392](https://github.com/gruntwork-io/terragrunt/pull/6392)\\r\\n- chore: Running `go fix ./...` by [@yhakbar](https://github.com/yhakbar) in [#6398](https://github.com/gruntwork-io/terragrunt/pull/6398)\\r\\n- chore(deps): bump actions/checkout from 6.0.2 to 7.0.0 by [@dependabot[bot]](https://github.com/dependabot[bot]) in [#6394](https://github.com/gruntwork-io/terragrunt/pull/6394)\\r\\n- chore: Update cfg locking for units by [@yhakbar](https://github.com/yhakbar) in [#6401](https://github.com/gruntwork-io/terragrunt/pull/6401)\\r\\n- chore: Move log flags off writers by [@yhakbar](https://github.com/yhakbar) in [#6403](https://github.com/gruntwork-io/terragrunt/pull/6403)\\r\\n- chore: Adding env and writers to venv by [@yhakbar](https://github.com/yhakbar) in [#6404](https://github.com/gruntwork-io/terragrunt/pull/6404)\\r\\n- chore: aws-sdk-go-v2/service/s3 upgrade by [@denis256](https://github.com/denis256) in [#6413](https://github.com/gruntwork-io/terragrunt/pull/6413)\\r\\n- chore: Downgrading `render` log to a `debug` by [@yhakbar](https://github.com/yhakbar) in [#6429](https://github.com/gruntwork-io/terragrunt/pull/6429)\\r\\n- chore: Engine per unit shutdown by [@yhakbar](https://github.com/yhakbar) in [#6426](https://github.com/gruntwork-io/terragrunt/pull/6426)\\r\\n\\r\\n### \U0001F4DD Other Changes\\r\\n\\r\\n- Adding Terragrunt Patterns section by [@karlcarstensen](https://github.com/karlcarstensen) in [#6379](https://github.com/gruntwork-io/terragrunt/pull/6379)\\r\\n- Add FAQ section for docs.terragrunt.com by [@karlcarstensen](https://github.com/karlcarstensen) in [#6378](https://github.com/gruntwork-io/terragrunt/pull/6378)\\r\\n- Fixing codespell lint error and adding codespell lint commands by [@karlcarstensen](https://github.com/karlcarstensen) in [#6386](https://github.com/gruntwork-io/terragrunt/pull/6386)\"},\"r1\":{\"tagName\":\"v1.1.3\",\"isDraft\":false,\"isPrerelease\":false,\"publishedAt\":\"2026-08-13T14:48:22Z\",\"url\":\"https://github.com/gruntwork-io/terragrunt/releases/tag/v1.1.3\",\"description\":\"## \U0001F41B Bug Fixes\\r\\n\\r\\n## Fixed `Unsupported attribute` errors for `values.*` inputs that `autoinclude` overrides\\r\\n\\r\\nA unit input referencing a `values.*` key that the unit's values file doesn't define no longer fails with `Unsupported attribute` when an `autoinclude` block supplies that input. The autoinclude value is applied as intended.\\r\\n\\r\\n```hcl\\r\\n# stacks/terragrunt.stack.hcl\\r\\nunit \\\"subnet\\\" {\\r\\n  source = \\\"../units/subnet\\\"\\r\\n  path   = \\\"subnet\\\"\\r\\n\\r\\n  autoinclude {\\r\\n    dependency \\\"vpc\\\" {\\r\\n      config_path  = unit.vpc.path\\r\\n      mock_outputs = { vpc_id = \\\"mock\\\" }\\r\\n    }\\r\\n\\r\\n    inputs = {\\r\\n      vpc_id = dependency.vpc.outputs.vpc_id\\r\\n    }\\r\\n  }\\r\\n\\r\\n  values = {\\r\\n    cidr_block = \\\"10.0.0.0/24\\\"\\r\\n  }\\r\\n}\\r\\n```\\r\\n\\r\\n```hcl\\r\\n# units/subnet/terragrunt.hcl\\r\\ninputs = {\\r\\n  vpc_id     = values.vpc_id      # supplied by autoinclude, not the values file\\r\\n  cidr_block = values.cidr_block  # still resolves from values file\\r\\n}\\r\\n```\\r\\n\\r\\n## Fixed `overwrite_terragrunt` and `remove_terragrunt` on files with no trailing newline\\r\\n\\r\\n`generate` blocks using `if_exists = \\\"overwrite_terragrunt\\\"` or `if_disabled = \\\"remove_terragrunt\\\"` failed to properly handle existing files when the file at the target path had no newline after its first line, empty files included.\\r\\n\\r\\nTerragrunt now properly handles files like this, so a file carrying the Terragrunt signature is overwritten or removed as configured, and a file without it produces the usual error naming the path Terragrunt would not touch.\\r\\n\\r\\n## Dependency `mock_outputs` apply when the state bucket doesn't exist yet\\r\\n\\r\\nWhen reading a dependency's outputs directly from remote state (`--dependency-fetch-output-from-state`), Terragrunt fell back to `mock_outputs` only when the state object was missing, not when the S3 bucket itself didn't exist. A `dependency` on an environment that hadn't been bootstrapped yet would fail instead of using its mocks.\\r\\n\\r\\nA missing bucket is now treated the same as a missing state object, so commands like `plan` and `validate` can resolve mocks before the dependency's backend has been created.\\r\\n\\r\\n## Source permissions preserved on hidden directories copied by `include_in_copy`\\r\\n\\r\\nWith the `fast-copy` strict control enabled, a hidden directory that Terragrunt copied due to `include_in_copy` matching something within it took the permissions of the first file generated within it, instead of the permissions it had in the source.\\r\\n\\r\\nThose directories now keep their source permissions, matching the copy Terragrunt performs with the control disabled.\\r\\n\\r\\n## Applied the positive half of a filter that begins with a negation\\r\\n\\r\\nWhen a `--filter` query began with a negation, Terragrunt treated the whole query as an exclusion. The expressions chained after the negation stopped restricting the selection and only narrowed what got subtracted, so components matching none of them came back in the results. Those expressions are now applied.\\r\\n\\r\\n```bash\\r\\n$ terragrunt list\\r\\nbar  baz  foo\\r\\n```\\r\\n\\r\\n```bash title=\\\"Before\\\"\\r\\n$ terragrunt list --filter '!name=foo | name=bar'\\r\\nbar  baz  foo\\r\\n```\\r\\n\\r\\n```bash title=\\\"After\\\"\\r\\n$ terragrunt list --filter '!name=foo | name=bar'\\r\\nbar\\r\\n```\\r\\n\\r\\nThis follows the left-to-right refinement that `|` has everywhere else: each expression narrows what the one before it selected. A query is only treated as an exclusion when every one of its expressions is negated, such as `'!name=foo'` or `'!name=foo | !name=bar'`.\\r\\n\\r\\nSee [Combining Expressions](https://docs.terragrunt.com/features/filter/combining) for how negation, intersection and union interact.\\r\\n\\r\\n## Fixed a race condition that left cached provider archives in the working directory\\r\\n\\r\\nWith the [provider cache server](https://docs.terragrunt.com/features/caching/provider-cache-server) enabled via `--provider-cache`, a race let the server start responding to requests before it had finished preparing the directories it caches into. A provider requested in that window had its archive and lock file written relative to the working directory instead of into the cache, leaving zip files behind in your project.\\r\\n\\r\\nThat race condition has been fixed. Providers now always download into the cache directory.\\r\\n\\r\\n## Fixed a race condition between concurrent Terragrunt runs downloading providers\\r\\n\\r\\nA race condition in the logic used to synchronize provider downloads meant that two Terragrunt runs on the same machine could interfere with each other while caching the same provider. Each run staged its downloads at the same path, so a run that finished first could delete an archive another run was still unpacking, failing that run with `failed to open zip archive`.\\r\\n\\r\\nThat race condition is now fixed. Two runs can cache the same provider at the same time.\\r\\n\\r\\n## Fixed space-delimited flag values in `providers lock`\\r\\n\\r\\nThe space-delimited form, `providers lock -platform linux_amd64`, now reaches OpenTofu and Terraform intact. Previously it was the attached form, `-platform=linux_amd64`, that worked: given the value as a separate argument, Terragrunt moved it to the end of the command, where it was read as a provider address and the run failed with `Invalid provider type \\\"linux_amd64\\\"`.\\r\\n\\r\\n`-fs-mirror` and `-net-mirror` were moved the same way, and now keep their values too.\\r\\n\\r\\nWith `--provider-cache` enabled, platforms are also split correctly across the per-platform `providers lock` runs used to warm the cache.\\r\\n\\r\\n## Fixed `scaffold` on units and stacks\\r\\n\\r\\n`terragrunt scaffold` read every source as an OpenTofu/Terraform module. Given a unit or a stack, which are Terragrunt configurations rather than OpenTofu/Terraform modules, it exited successfully having written an invalid `terragrunt.hcl` file.\\r\\n\\r\\nUnits and stacks are now scaffolded the way the [Catalog TUI](https://docs.terragrunt.com/features/catalog/tui) scaffolds them: their files are copied into the working directory for you to edit in place, along with a `terragrunt.values.hcl` listing every `values.*` reference the configuration makes.\\r\\n\\r\\n```bash\\r\\nterragrunt scaffold 'github.com/gruntwork-io/terragrunt-scale-catalog//units/aws/oidc/iam-oidc-role'\\r\\n```\\r\\n\\r\\nCopying refuses to overwrite: a file that would land on an existing path stops the command before anything is written. Modules and templates are unaffected and are still scaffolded from their variables.\\r\\n\\r\\nSee [Scaffold](https://docs.terragrunt.com/features/catalog/scaffold) for what gets copied and how the values file is filled in.\\r\\n\\r\\n## Answered every prompt when input is piped in\\r\\n\\r\\nA run that asks for confirmation more than once, such as `terragrunt backend delete` prompting for both the lock table entry and the state object, used to read only the first answer when the answers were piped in rather than typed. The remaining answers were discarded while reading ahead, and the next prompt failed with an end-of-input error. Every prompt in a run now reads from the same input, so piping `yes` for each one works.\\r\\n\\r\\n## Stack dependencies honor `mock_outputs` with `--dependency-fetch-output-from-state`\\r\\n\\r\\nA `dependency` block that reads outputs from a stack (its `config_path` points at a `terragrunt.stack.hcl` directory) used to fail when a unit in that stack had no state yet, even when the dependency declared `mock_outputs`. This blocked commands like `plan` and `validate` against a stack that hadn't been applied.\\r\\n\\r\\nSuch a dependency now falls back to `mock_outputs` for the units that have no state yet. In a partially applied stack, applied units resolve to their real outputs while the rest use their mocks.\\r\\n\\r\\nMocks for a stack dependency are keyed by unit name, so `mock_outputs` has to be a map or object. Declaring it as any other type now reports that directly, instead of leaving the units it can't cover out of the stack outputs.\\r\\n\\r\\n## Fixed `--config=` being ignored by the `tflint` hook\\r\\n\\r\\nThe built-in `tflint` hook reads the configuration file out of the arguments you give it, then uses that path for `tflint init` and for the lint run. It only recognized the space-separated `--config <path>` spelling, so a hook written as:\\r\\n\\r\\n```hcl\\r\\nbefore_hook \\\"tflint\\\" {\\r\\n  commands = [\\\"plan\\\"]\\r\\n  execute  = [\\\"tflint\\\", \\\"--config=custom.tflint.hcl\\\"]\\r\\n}\\r\\n```\\r\\n\\r\\nwas treated as though no configuration file had been named at all. Terragrunt searched the unit directory and its parents for a `.tflint.hcl` file instead, and either failed with a config-not-found error or ran `tflint init` against whatever unrelated configuration the search turned up. Terragrunt now recognizes `--config <path>`, `--config=<path>`, `-c <path>`, and `-c=<path>`.\\r\\n\\r\\nThe hook also builds `--var` arguments from the unit's `inputs` and from `TF_VAR_` entries in `extra_arguments` blocks. Those arguments came out in a different order on every run, which made the logged command line, and anything comparing it between runs, needlessly unstable. They are now ordered by variable name.\\r\\n\\r\\n## \U0001F9EA Experiments Added\\r\\n\\r\\n## `block-iteration` experiment reserves the `expansion` block\\r\\n\\r\\nThe [`block-iteration`](https://docs.terragrunt.com/reference/experiments/active#block-iteration) experiment has been added as the gate for iterating a `dependency`, `unit`, or `stack` block over a `count` or `for_each`, declared through a nested `expansion` block, along with an `enabled` attribute on `unit` and `stack` blocks.\\r\\n\\r\\nIn this release the flag is reserved only, and enabling it has no behavioral effect. Writing an `expansion` block without the experiment now reports an error naming the flag, rather than leaving the block to be silently discarded:\\r\\n\\r\\n```text\\r\\nthe unit \\\"app\\\" block in /path/to/terragrunt.stack.hcl uses an expansion block, which requires the 'block-iteration' experiment; enable it with --experiment block-iteration\\r\\n```\\r\\n\\r\\nTrack progress and share feedback in [#4504](https://github.com/gruntwork-io/terragrunt/issues/4504).\\r\\n\\r\\n## `bounded-discovery` — Added a directory boundary for graph traversal\\r\\n\\r\\nFilter expressions that traverse the dependency graph reach beyond the working directory: dependents (`--filter '...{unit}'`) by walking up to the Git repository root, dependencies (`--filter '{unit}...'`) by following declared paths. Either way, Terragrunt reads and parses every configuration it touches. In monorepos with isolated environments, that traversal can fail or do wasted work reading sibling environments.\\r\\n\\r\\nEnable the new [`bounded-discovery`](https://docs.terragrunt.com/reference/experiments/active#bounded-discovery) experiment to set a boundary for that traversal. The `--discovery-boundary` flag (env: `TG_DISCOVERY_BOUNDARY`) replaces the Git repository root as the enclosure for a whole run:\\r\\n\\r\\n```bash\\r\\ncd environments/staging\\r\\nterragrunt run --all plan --experiment bounded-discovery --filter '...{vpc}' --discovery-boundary .\\r\\n```\\r\\n\\r\\nThe experiment also unlocks an inline `(dir)` boundary operand, which bounds a single expression and overrides the flag. It occupies the same slot as a traversal depth, so it bounds discovery by location the way a number bounds it by graph hops:\\r\\n\\r\\n```bash\\r\\ncd environments/staging\\r\\nterragrunt run --all plan --experiment bounded-discovery --filter '(.)...{vpc}'\\r\\n```\\r\\n\\r\\nAny configuration that resolves outside the boundary, whether a dependent or a dependency, is not read, parsed, or returned: `find` does not list it and `run --all` does not run it. Configurations inside the boundary are discovered as usual.\\r\\n\\r\\nThe boundary must be an existing directory, and relative paths are resolved against the working directory. Dependent traversal searches upward from the working directory, so filters that use it also need the boundary to be the working directory or one of its parents. Dependency traversal follows declared paths from the units a filter matched, so dependency-only filters accept any directory, including one below the working directory:\\r\\n\\r\\n```bash\\r\\n# From the repository root, follow app's dependencies but keep them within prod\\r\\nterragrunt find --experiment bounded-discovery --filter '{./prod/app}...' --discovery-boundary ./prod\\r\\n```\\r\\n\\r\\nReserving `(` and `)` for the boundary operand changes how `--filter` reads those characters everywhere, not only when the experiment is enabled. An expression such as `--filter '1...(foo | bar)'` previously matched a unit literally named `(foo` or `bar)`; it is now rejected as a malformed boundary. Wrap a name or path containing parentheses in braces (e.g. `--filter '{./weird(name)}'`) to keep it literal.\\r\\n\\r\\n## `browse-tui` — Added an interactive browser for your estate\\r\\n\\r\\nThe new `browse-tui` experiment adds the [`terragrunt browse`](https://docs.terragrunt.com/reference/cli/commands/browse) command. With the experiment enabled, `terragrunt browse` opens a three-column Terminal User Interface (TUI) browser of your infrastructure estate: the parent directory on the left, the current directory in the middle, and a detail pane on the right showing metadata for the highlighted unit, stack, or directory. The browser opens immediately and fills in metadata as discovery completes in the background.\\r\\n\\r\\n<img width=\\\"1167\\\" height=\\\"744\\\" alt=\\\"browse-navigation\\\" src=\\\"https://github.com/user-attachments/assets/e0071076-8875-432a-9e2b-1840b7070bc9\\\" />\\r\\n\\r\\nEnable it with `--experiment browse-tui` or `TG_EXPERIMENT=browse-tui`. See the [experiment documentation](https://docs.terragrunt.com/reference/experiments/active#browse-tui) for the keybindings, search, and the criteria for stabilization.\\r\\n\\r\\n## `mutable-generate` — Deduplicated `generate` block output\\r\\n\\r\\nThe `mutable-generate` experiment has been added. With it enabled, the contents a `generate` block produces are stored in the [Content Addressable Store (CAS)](https://docs.terragrunt.com/features/caching/cas), and the file written at `path` is a read-only link to that stored copy rather than a file of its own.\\r\\n\\r\\nSince the stored copy is addressed by the hash of its contents, anything generating identical contents links to the same copy. A `generate` block inherited by several hundred units therefore costs one copy in `.terragrunt-cache` rather than several hundred.\\r\\n\\r\\nThe link is read-only because that copy is shared. Where a generated file does need to be edited in place, a new `mutable` attribute on the `generate` block gives it a writable file of its own:\\r\\n\\r\\n```hcl\\r\\ngenerate \\\"provider\\\" {\\r\\n  path      = \\\"provider.tf\\\"\\r\\n  if_exists = \\\"overwrite\\\"\\r\\n  mutable   = true\\r\\n  contents  = \\\"...\\\"\\r\\n}\\r\\n```\\r\\n\\r\\nSetting `mutable` without the experiment enabled is an error, since earlier Terragrunt versions reject the attribute. The CAS is required, so `--no-cas` writes generated files directly and `mutable` has no effect.\\r\\n\\r\\nFor details, see the [experiment documentation](https://docs.terragrunt.com/reference/experiments/active#mutable-generate).\\r\\n\\r\\n## `optional-dependency-outputs` — Added `--no-dependency-outputs` flag to skip dependency output resolution\\r\\n\\r\\nAdded a `--no-dependency-outputs` flag that skips all dependency output resolution globally, mirroring the existing `skip_outputs = true` attribute on individual `dependency` blocks.\\r\\n\\r\\nThe feature is gated behind the `optional-dependency-outputs` experiment:\\r\\n\\r\\n```bash\\r\\nTG_EXPERIMENT=optional-dependency-outputs terragrunt run --no-dependency-outputs -- init\\r\\n```\\r\\n\\r\\nUsing `--no-dependency-outputs` without enabling the `optional-dependency-outputs` experiment will return an error.\\r\\n\\r\\nThanks to [@pjrm](https://github.com/pjrm) for contributing this feature!\\r\\n\\r\\n## \U0001F9EA Experiments Updated\\r\\n\\r\\n## `catalog-format` — Added reading the catalog as JSON Lines\\r\\n\\r\\nThe `catalog` command draws a terminal user interface, and refuses to start where there is no terminal to draw it on. With the [`catalog-format`](https://docs.terragrunt.com/reference/experiments/active#catalog-format) experiment enabled, `--format=jsonl` writes the same discovery to standard output instead, as one JSON object per line:\\r\\n\\r\\n```bash\\r\\nterragrunt catalog --experiment=catalog-format --format=jsonl | jq -c '{kind, title, component_source}'\\r\\n```\\r\\n\\r\\nEntries are written as they are discovered rather than collected first, so output is readable while the remaining repositories are still loading, and a reader that stops early ends the command quietly:\\r\\n\\r\\n```bash\\r\\nterragrunt catalog --experiment=catalog-format --format=jsonl | head -5\\r\\n```\\r\\n\\r\\n> [!NOTE]\\r\\n> **Closing the pipe**\\r\\n>\\r\\n> In this example, the `head` program exits after reading in five lines, and Terragrunt detects the `SIGPIPE` signal from the OS, and shuts down cleanly.\\r\\n\\r\\nEntries appear in discovery order, which interleaves the repositories being loaded and differs between runs. Every entry carries the complete body of the component's README in the `doc` field. Combine usage of Terragrunt with other tools like `jq` to drop it.\\r\\n\\r\\n```bash\\r\\nterragrunt catalog --experiment=catalog-format --format=jsonl | jq -c 'del(.doc)'\\r\\n```\\r\\n\\r\\nEntries follow a [published JSON schema](https://docs.terragrunt.com/schemas/catalog/v1/schema.json). For the fields and their meanings, see [Non-interactive catalog](https://docs.terragrunt.com/features/catalog/non-interactive).\\r\\n\\r\\n`--format=tui` is the default, and leaves the terminal user interface exactly as it was.\\r\\n\\r\\n## `catalog-format` — Added reading the catalog as Markdown\\r\\n\\r\\nThe [`catalog-format`](https://docs.terragrunt.com/reference/experiments/active#catalog-format) experiment gains a second non-interactive format. Where `--format=jsonl` writes a record per catalog entry for a program to parse, `--format=md` writes one Markdown document for a person or an agent to read:\\r\\n\\r\\n```bash\\r\\nterragrunt catalog --experiment=catalog-format --format=md > catalog.md\\r\\n```\\r\\n\\r\\nEach entry becomes a section holding the metadata the catalog user interface shows for it, the source the component is scaffolded from, and the component's README. Sections are written as entries are discovered, so the document is readable while the remaining repositories are still loading.\\r\\n\\r\\nREADMEs are reproduced inside fenced blocks, so the headings one carries are not read as sections of the catalog document. The document closes with a table naming every component it holds and a count of what was discovered, which is how a reader tells a complete document from one that was cut short by a consumer that stopped reading.\\r\\n\\r\\nFor the fields each section carries, see [Non-interactive catalog](https://docs.terragrunt.com/features/catalog/non-interactive).\\r\\n\\r\\n## `oci` — Added OCI sources for stack units and stacks\\r\\n\\r\\n`terragrunt.stack.hcl` now accepts `oci://` sources in `unit` and `stack` blocks, so a stack can pull its components straight from an OCI registry. Without the `oci` experiment enabled, such a source fails with a clear error instead of an unsupported-scheme failure.\\r\\n\\r\\n## `oci` — Added OpenTofu CLI-config credentials for OCI module sources\\r\\n\\r\\n`oci://` module downloads now read OpenTofu's CLI-config credentials, so one configuration serves both OpenTofu and Terragrunt.\\r\\n\\r\\nTerragrunt honors the `oci_credentials \\\"<registry>[/<repo-prefix>]\\\"` blocks (username and password, OAuth tokens, or a `docker_credentials_helper`, which like `tofu` may only be set on a whole registry) and the `oci_default_credentials` fallback helper. A `TF_CLI_CONFIG_FILE` or `TERRAFORM_CONFIG` value selects the config file outright; otherwise Terragrunt reads the first of `~/.tofurc` and `~/.terraformrc` that exists, and merges the `*.tfrc` and `*.tfrc.json` files in OpenTofu's config directory.\\r\\n\\r\\nTerragrunt picks the most specific matching source across CLI config and ambient Docker config; an explicit CLI-config entry wins when both match equally. Set `discover_ambient_credentials = false` in the `oci_default_credentials` block to use CLI config only.\\r\\n\\r\\n## ⚙️ Process Updates\\r\\n\\r\\n## Go bumped to `v1.26.5`\\r\\n\\r\\nThe version of Golang used to compile the Terragrunt binary has been updated from `v1.26.0` to `v1.26.5`.\\r\\n\\r\\nThanks to [@apoiget](https://github.com/apoiget) for contributing this upgrade!\\r\\n\\r\\n## Pull Requests\\r\\n\\r\\n### ✨ Features\\r\\n\\r\\n- feat: Adding graph boundary via `()` syntax by [@yhakbar](https://github.com/yhakbar) in [#6365](https://github.com/gruntwork-io/terragrunt/pull/6365)\\r\\n- feat: Adding `--discovery-boundary` flag by [@yhakbar](https://github.com/yhakbar) in [#6355](https://github.com/gruntwork-io/terragrunt/pull/6355)\\r\\n- feat(getter): OpenTofu CLI-config credentials for oci:// sources by [@denis256](https://github.com/denis256) in [#6531](https://github.com/gruntwork-io/terragrunt/pull/6531)\\r\\n- feat: Adding `browse` by [@yhakbar](https://github.com/yhakbar) in [#6219](https://github.com/gruntwork-io/terragrunt/pull/6219)\\r\\n- feat: Adding `mutable` attribute to the `generate` block by [@yhakbar](https://github.com/yhakbar) in [#6563](https://github.com/gruntwork-io/terragrunt/pull/6563)\\r\\n- feat: Adding `md` format for `catalog` by [@yhakbar](https://github.com/yhakbar) in [#6608](https://github.com/gruntwork-io/terragrunt/pull/6608)\\r\\n- feat: Add --skip-dependency-outputs flag to skip dependency output resolution by [@pjrm](https://github.com/pjrm) in [#6422](https://github.com/gruntwork-io/terragrunt/pull/6422)\\r\\n\\r\\n### \U0001F41B Bug Fixes\\r\\n\\r\\n- fix(providercache): log -lockfile=readonly skip at debug level by [@bryanhorstmann](https://github.com/bryanhorstmann) in [#6577](https://github.com/gruntwork-io/terragrunt/pull/6577)\\r\\n- fix: Fixing handling of `EOF` in `generate` blocks by [@yhakbar](https://github.com/yhakbar) in [#6592](https://github.com/gruntwork-io/terragrunt/pull/6592)\\r\\n- fix: Fixing the `--config=` form of flags used in the tflint hook by [@yhakbar](https://github.com/yhakbar) in [#6591](https://github.com/gruntwork-io/terragrunt/pull/6591)\\r\\n- fix: Fixing fast-copy ancestor directory permissions by [@yhakbar](https://github.com/yhakbar) in [#6593](https://github.com/gruntwork-io/terragrunt/pull/6593)\\r\\n- fix: Addressing `providers lock` `-platform` usage with space delimited values by [@yhakbar](https://github.com/yhakbar) in [#6597](https://github.com/gruntwork-io/terragrunt/pull/6597)\\r\\n- fix: Fixing bug with `negation | positive` expression in the same query. by [@yhakbar](https://github.com/yhakbar) in [#6598](https://github.com/gruntwork-io/terragrunt/pull/6598)\\r\\n- fix: Fixing provider cache server archive dir race by [@yhakbar](https://github.com/yhakbar) in [#6620](https://github.com/gruntwork-io/terragrunt/pull/6620)\\r\\n- fix: Fixing scaffold on units and stacks by [@yhakbar](https://github.com/yhakbar) in [#6607](https://github.com/gruntwork-io/terragrunt/pull/6607)\\r\\n- fix: Addressing feedback from #6565 and #6605 by [@yhakbar](https://github.com/yhakbar) in [#6628](https://github.com/gruntwork-io/terragrunt/pull/6628)\\r\\n- fix: autoinclude values override for inputs by [@denis256](https://github.com/denis256) in [#6626](https://github.com/gruntwork-io/terragrunt/pull/6626)\\r\\n- fix: Fixing `md` format catalog escaping by [@yhakbar](https://github.com/yhakbar) in [#6638](https://github.com/gruntwork-io/terragrunt/pull/6638)\\r\\n- fix: Plumbing through `evalCtx` for discovery boundary by [@yhakbar](https://github.com/yhakbar) in [#6632](https://github.com/gruntwork-io/terragrunt/pull/6632)\\r\\n- fix: Fixing stack dependency mock outputs by [@yhakbar](https://github.com/yhakbar) in [#6530](https://github.com/gruntwork-io/terragrunt/pull/6530)\\r\\n- fix: Fixing issue where dependency mock outputs aren't used when bootstrapping hasn't run yet. by [@yhakbar](https://github.com/yhakbar) in [#6534](https://github.com/gruntwork-io/terragrunt/pull/6534)\\r\\n\\r\\n### \U0001F3CE️ Performance\\r\\n\\r\\n- perf: Reducing allocations in tree parse by [@yhakbar](https://github.com/yhakbar) in [#6648](https://github.com/gruntwork-io/terragrunt/pull/6648)\\r\\n\\r\\n### \U0001F4D6 Documentation\\r\\n\\r\\n- docs: Add call out for terragrunt scale in quick start by [@yhakbar](https://github.com/yhakbar) in [#6583](https://github.com/gruntwork-io/terragrunt/pull/6583)\\r\\n- docs: