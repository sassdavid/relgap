        body: "[{\"tag_name\":\"v1.3.0\",\"name\":\"v1.3.0\",\"description\":\"## Breaking changes\\n\\n- The `zone_id` output is renamed to `hosted_zone_id`. Update every reference in the calling modules before you upgrade, because Terraform fails the plan on the old name.\\n\\n## Features\\n\\n- Records accept a `set_identifier`, so weighted and latency-based routing policies work without a second module.\\n- The module creates the DNSSEC signing key when `dnssec_enabled` is true.\\n\\n## Bug fixes\\n\\n- Private zones attach to every VPC in `vpc_ids` instead of the first one only.\\n\",\"created_at\":\"2026-11-05T09:00:00.000Z\",\"released_at\":\"2026-11-05T09:00:00.000Z\",\"upcoming_release\":false},{\"tag_name\":\"v1.2.1\",\"name\":\"v1.2.1\",\"description\":\"## Bug fixes\\n\\n- Alias records keep `evaluate_target_health` when the target changes, instead of falling back to false on the next apply.\\n- The `ttl` variable is ignored for alias records, as the Route 53 API requires, and no longer produces a perpetual diff.\\n- Health checks created for failover records carry the module tags.\\n\",\"created_at\":\"2026-09-20T09:00:00.000Z\",\"released_at\":\"2026-09-20T09:00:00.000Z\",\"upcoming_release\":false}]"
