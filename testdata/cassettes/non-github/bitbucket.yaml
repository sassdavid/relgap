        body: "# Changelog\n\nAll notable changes to this module are documented in this file. The format follows Keep a Changelog,\nand the module follows Semantic Versioning.\n\n## [3.0.0] - 2026-11-02\n\n### Removed\n\n- BREAKING: the `enable_classiclink` variable is gone. Remove it from every module call before you upgrade.\n\n### Added\n\n- The `ipv6_cidr_block` output returns the IPv6 block of the VPC.\n\n## [3.0.0-rc.1] - 2026-10-20\n\n### Removed\n\n- BREAKING: the `enable_classiclink` variable is gone.\n\n## [2.2.0] - 2026-09-14\n\n### Added\n\n- Optional VPC flow logs to CloudWatch Logs, switched on with `flow_logs_enabled`.\n\n### Deprecated\n\n- The `single_nat_gateway` variable is deprecated in favour of `nat_gateway_mode`.\n\n### Fixed\n\n- NAT gateways now carry the `Name` tag from `var.name`.\n\n## [2.1.0] - 2026-07-01\n\n### Added\n\n- Private subnets accept a list of extra route tables.\n\n## [2.0.0] - 2026-03-10\n\n### Changed\n\n- The module needs the AWS provider 6.0 or newer.\n\n## [1.0.0] - 2025-11-01\n\n### Added\n\n- First release.\n"
