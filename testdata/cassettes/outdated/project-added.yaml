        body: '{"id":"GO-2026-6617","summary":"HTTP/2 server crash due to HPACK encoder race in net/http","details":"HTTP/2 servers could end up crashing due to inadvertently modifying its HPACK encoder concurrently. This happens because the server modifies the HPACK encoder from two goroutines without synchronization: one uses the encoder to encode a HEADERS frame as part of a response sent to a client and the other modifies the encoder''s table size when handling a SETTINGS frame containing SETTINGS_HEADER_TABLE_SIZE that a client sends. A malicious client can repeatedly send a request while changing the header table size to crash the server.","aliases":["BIT-golang-2026-97032","CVE-2026-97032"],"modified":"2026-10-16T09:55:57.350751224Z","published":"2026-10-08T22:31:09Z","database_specific":{"review_status":"REVIEWED","url":"https://pkg.go.dev/vuln/GO-2026-6617"},"references":[{"type":"FIX","url":"https://go.dev/cl/847188"},{"type":"FIX","url":"https://go.dev/cl/847313"},{"type":"REPORT","url":"https://go.dev/issue/81867"},{"type":"WEB","url":"https://groups.google.com/g/golang-announce/c/U2fTuyDJznI"},{"type":"WEB","url":"https://groups.google.com/g/golang-announce/c/ZPwCyRUuGBs"}],"affected":[{"package":{"name":"stdlib","ecosystem":"Go","purl":"pkg:golang/stdlib"},"ranges":[{"type":"SEMVER","events":[{"introduced":"0"},{"fixed":"1.26.9"}]}],"ecosystem_specific":{"imports":[{"path":"net/http","symbols":["CanonicalHeaderKey","Client.CloseIdleConnections","Client.Do","Client.Get","Client.Head","Client.Post","Client.PostForm","ClientConn.Close","ClientConn.RoundTrip","Cookie.String","Cookie.Valid","CrossOriginProtection.AddInsecureBypassPattern","CrossOriginProtection.AddTrustedOrigin","CrossOriginProtection.Check","Dir.Open","Error","Get","Handle","HandleFunc","HandlerFunc.ServeHTTP","Head","Header.Add","Header.Del","Header.Get","Header.Set","Header.Values","Header.Write","Header.WriteSubset","ListenAndServe","ListenAndServeTLS","NewRequest","NewRequestWithContex