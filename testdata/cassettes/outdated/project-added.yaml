        body: '{"id":"GO-2026-6603","summary":"HTTP/2 server memory exhaustion due to Trailer headers in net/http","details":"When \"Trailer\" headers are sent by a client, the HTTP server internally uses the header values to populate the Request.Trailer map passed to the server handler. Because Request.Trailer is a map, each entry incurs memory overhead. For HTTP/2 servers, a malicious client can exploit this by sending a \"Trailer\" header that declares a large number of fields, causing the server to allocate a disproportionate amount of memory while bypassing Server.MaxHeaderValueCount and Server.MaxHeaderBytes limits. This exploit is not applicable for HTTP/1 servers, which do not support multiplexing a large number of requests over one TCP connection, and whose Server.MaxHeaderBytes are calculated differently.","aliases":["BIT-golang-2026-78659","CVE-2026-78659"],"modified":"2026-10-16T09:55:47.068117441Z","published":"2026-10-08T22:31:09Z","database_specific":{"url":"https://pkg.go.dev/vuln/GO-2026-6603","review_status":"REVIEWED"},"references":[{"type":"FIX","url":"https://go.dev/cl/847185"},{"type":"FIX","url":"https://go.dev/cl/847314"},{"type":"REPORT","url":"https://go.dev/issue/81857"},{"type":"WEB","url":"https://groups.google.com/g/golang-announce/c/U2fTuyDJznI"},{"type":"WEB","url":"https://groups.google.com/g/golang-announce/c/ZPwCyRUuGBs"}],"affected":[{"package":{"name":"stdlib","ecosystem":"Go","purl":"pkg:golang/stdlib"},"ranges":[{"type":"SEMVER","events":[{"introduced":"0"},{"fixed":"1.26.9"}]}],"ecosystem_specific":{"imports":[{"path":"net/http","symbols":["CanonicalHeaderKey","Client.CloseIdleConnections","Client.Do","Client.Get","Client.Head","Client.Post","Client.PostForm","ClientConn.Close","ClientConn.RoundTrip","Cookie.String","Cookie.Valid","CrossOriginProtection.AddInsecureBypassPattern","CrossOriginProtection.AddTrustedOrigin","CrossOriginProtection.Check","Dir.Open","Error","Get","Handle","HandleFunc","HandlerFunc.ServeHTTP","Head","