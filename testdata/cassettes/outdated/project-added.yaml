        body: '{"id":"GO-2026-6604","summary":"Root.Mkdir(All) can follow junctions out of the root on Windows in os","details":"On Windows, when the target of Root.Mkdir or Root.MkdirAll is a junction pointing to an empty location, the operation can create a directory at the junction target even when that target is located outside the root. This only applies to operations where the last path component is a junction (path/to/junction, but not path/junction/target).","aliases":["BIT-golang-2026-56857","CVE-2026-56857"],"modified":"2026-10-16T09:55:42.275912220Z","published":"2026-10-08T22:31:09Z","database_specific":{"url":"https://pkg.go.dev/vuln/GO-2026-6604","review_status":"REVIEWED"},"references":[{"type":"FIX","url":"https://go.dev/cl/847305"},{"type":"REPORT","url":"https://go.dev/issue/81739"},{"type":"WEB","url":"https://groups.google.com/g/golang-announce/c/U2fTuyDJznI"}],"affected":[{"package":{"name":"stdlib","ecosystem":"Go","purl":"pkg:golang/stdlib"},"ranges":[{"type":"SEMVER","events":[{"introduced":"0"},{"fixed":"1.26.9"},{"introduced":"1.27.0-0"},{"fixed":"1.27.2"}]}],"ecosystem_specific":{"imports":[{"goos":["windows"],"symbols":["Root.Chmod","Root.Chown","Root.Chtimes","Root.Lchown","Root.Link","Root.Mkdir","Root.MkdirAll","Root.Remove","Root.RemoveAll","Root.Rename","Root.Symlink","doInRoot","rootMkdirAll"],"path":"os"},{"goos":["windows"],"symbols":["Mkdirat"],"path":"internal/syscall/windows"}]},"database_specific":{"source":"https://vuln.go.dev/ID/GO-2026-6604.json"}}],"schema_version":"1.9.0","credits":[{"name":"Daniele Ballarini"}]}'
