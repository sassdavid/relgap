        content_length: 2140
        body: '{"id":"GO-2026-6605","summary":"HTTP/1 client connection desynchronization after CONNECT rejection in net/http","details":"When http.Transport sends an HTTP/1 CONNECT request with a non-empty Request.Body, it writes the body directly to the connection without framing after the request headers. If the server rejects the CONNECT request with a non-2xx keep-alive response, Transport returns the connection to the idle pool. Because CONNECT requests do not have a request body, the server may interpret the trailing body bytes as a subsequent pipelined HTTP/1.1 request on the connection, leaving the pooled connection desynchronized and causing the next caller that reuses it to read the response to the injected request. In reverse proxies (including httputil.ReverseProxy) that forward CONNECT requests through a shared Transport, this can lead to cross-user response poisoning.","aliases":["BIT-golang-2026-56866","CVE-2026-56866"],"modified":"2026-10-16T09:55:59.367370212Z","published":"2026-10-08T22:31:09Z","database_specific":{"url":"https://pkg.go.dev/vuln/GO-2026-6605","review_status":"REVIEWED"},"references":[{"type":"FIX","url":"https://go.dev/cl/847306"},{"type":"REPORT","url":"https://go.dev/issue/81740"},{"type":"WEB","url":"https://groups.google.com/g/golang-announce/c/U2fTuyDJznI"}],"affected":[{"package":{"name":"stdlib","ecosystem":"Go","purl":"pkg:golang/stdlib"},"ranges":[{"type":"SEMVER","events":[{"introduced":"0"},{"fixed":"1.26.9"},{"introduced":"1.27.0-0"},{"fixed":"1.27.2"}]}],"ecosystem_specific":{"imports":[{"path":"net/http","symbols":["Client.CloseIdleConnections","Client.Do","Client.Get","Client.Head","Client.Post","Client.PostForm","ClientConn.Close","ClientConn.RoundTrip","Get","Head","Post","PostForm","Transport.CloseIdleConnections","Transport.NewClientConn","Transport.RoundTrip","http1ClientConn.Close","http1ClientConn.RoundTrip","persistConn.readLoop"]},{"path":"net/http/httputil","symbols":["DumpRequestOut","ReverseProxy.ServeHT