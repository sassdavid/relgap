        body: '{"id":"GO-2026-6612","summary":"Double flow control refund on HTTP/2 server streams in net/http","details":"The HTTP/2 server can refund connection-level flow control twice for the same data: Once when a client resets a stream (refunding data for any sent-but-unread portion of the stream), and again when a request handler reads the buffered data. A malicious client can exploit this to bypass the configured connection-level flow control limit (MaxReceiveBufferPerConnection). Total buffered data is still limited by the concurrent stream limit and stream-level flow control.","aliases":["BIT-golang-2026-78663","CVE-2026-78663"],"modified":"2026-10-16T09:55:54.129082194Z","published":"2026-10-08T22:31:09Z","database_specific":{"review_status":"REVIEWED","url":"https://pkg.go.dev/vuln/GO-2026-6612"},"references":[{"type":"FIX","url":"https://go.dev/cl/847187"},{"type":"FIX","url":"https://go.dev/cl/847310"},{"type":"REPORT","url":"https://go.dev/issue/81743"},{"type":"WEB","url":"https://groups.google.com/g/golang-announce/c/U2fTuyDJznI"},{"type":"WEB","url":"https://groups.google.com/g/golang-announce/c/ZPwCyRUuGBs"}],"affected":[{"package":{"name":"stdlib","ecosystem":"Go","purl":"pkg:golang/stdlib"},"ranges":[{"type":"SEMVER","events":[{"introduced":"0"},{"fixed":"1.26.9"}]}],"ecosystem_specific":{"imports":[{"path":"net/http","symbols":["CanonicalHeaderKey","Client.CloseIdleConnections","Client.Do","Client.Get","Client.Head","Client.Post","Client.PostForm","ClientConn.Close","ClientConn.RoundTrip","Cookie.String","Cookie.Valid","CrossOriginProtection.AddInsecureBypassPattern","CrossOriginProtection.AddTrustedOrigin","CrossOriginProtection.Check","Dir.Open","Error","Get","Handle","HandleFunc","HandlerFunc.ServeHTTP","Head","Header.Add","Header.Del","Header.Get","Header.Set","Header.Values","Header.Write","Header.WriteSubset","ListenAndServe","ListenAndServeTLS","NewRequest","NewRequestWithContext","NotFound","ParseCookie","ParseSetCookie","ParseTime","Po