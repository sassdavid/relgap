        body: '{"id":"GO-2026-6809","summary":"Distrust compromised intermediate certificates in crypto/x509","details":"On most platforms, Go uses the given system root certificates. However, in some narrower cases, the system trust stores may not be updated without further action.\n\nTo defend against the narrower set of cases that may remain affected, a denylist was added in crypto/x509 to return an error when calling Verify with any of the known intermediate certificates that are no longer considered to be trustworthy.","aliases":["BIT-golang-2026-111943","CVE-2026-111943","RUSTSEC-2026-0381","RUSTSEC-2026-0382","RUSTSEC-2026-0383"],"modified":"2026-10-29T10:55:54.096394276Z","published":"2026-10-21T00:27:29Z","database_specific":{"url":"https://pkg.go.dev/vuln/GO-2026-6809","review_status":"REVIEWED"},"references":[{"type":"FIX","url":"https://go.dev/cl/851047"},{"type":"REPORT","url":"https://go.dev/issue/82345"},{"type":"WEB","url":"https://groups.google.com/g/golang-announce/c/66pojueaQek"}],"affected":[{"package":{"name":"stdlib","ecosystem":"Go","purl":"pkg:golang/stdlib"},"ranges":[{"type":"SEMVER","events":[{"introduced":"0"},{"fixed":"1.26.10"},{"introduced":"1.27.0-0"},{"fixed":"1.27.3"}]}],"ecosystem_specific":{"imports":[{"symbols":["Certificate.Verify"],"path":"crypto/x509"}]},"database_specific":{"source":"https://vuln.go.dev/ID/GO-2026-6809.json"}}],"schema_version":"1.9.0"}'
