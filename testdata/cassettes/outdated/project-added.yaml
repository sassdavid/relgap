            <article class="Doc Article">





            <h1>Release History</h1>






            <div id="nav" class="TOC"></div>








            <p>This page summarizes the changes between official stable releases of Go.
            The <a href="/change">change log</a> has the full details.</p>

            <p>To update to a specific release, use:</p>

            <pre>
            git fetch --tags
            git checkout <i>goX.Y.Z</i>
            </pre>

            <h2 id="policy">Release Policy</h2>

            <p>
            Each major Go release is supported until there are two newer major releases.
            For example, Go 1.5 was supported until the Go 1.7 release, and Go 1.6 was
            supported until the Go 1.8 release.
            We fix critical problems, including <a href="/security">critical security problems</a>,
            in supported releases as needed by issuing minor revisions
            (for example, Go 1.6.1, Go 1.6.2, and so on).
            </p>



            	<h2 id="go1.27.0">go1.27.0 (released 2026-08-19)</h2>

            	<p>
            	Go 1.27.0 is a major release of Go.
            	Read the <a href="/doc/go1.27">Go 1.27 Release Notes</a> for more information.
            	</p>

            	<h3 id="go1.27.minor">Minor revisions</h3>

            	
            		<p id="go1.27.1">
            		go1.27.1
            		(released 2026-09-01)
            		
            			includes
            			
            				
            				 
            				fixes to cgo, the compiler, the runtime, the <code>go fix</code> command, and the <code>database/sql</code>, <code>debug/elf</code>, <code>encoding/json</code>, <code>net/http</code>, <code>os</code>, <code>simd</code>, and <code>simd/archsimd</code> packages.
            			

            			
            			See the
            			<a href="https://github.com/golang/go/issues?q=milestone%3AGo1.27.1+label%3ACherryPickApproved">Go 1.27.1 milestone</a>
            			on our issue tracker for details.
            			
            		
            		</p>
            	
            		<p id="go1.27.2">
            		go1.27.2
            		(released 2026-10-08)
            		
            			includes
            			
            				
            				security
            				fixes to the <code>go</code> command, and the <code>crypto/tls</code>, <code>html/template</code>, <code>net/http</code>, <code>net/textproto</code>, and <code>os</code> packages, as well as
            				
            				bug 
            				fixes to the compiler, the linker, the runtime, the <code>cover</code> tool, the <code>go fix</code> command, vet, and the <code>compress/flate</code>, <code>crypto/mlkem</code>, <code>encoding/json</code>, <code>encoding/json/v2</code>, <code>net/http</code>, and <code>os</code> packages.
            			

            			
            			See the
            			<a href="https://github.com/golang/go/issues?q=milestone%3AGo1.27.2+label%3ACherryPickApproved">Go 1.27.2 milestone</a>
            			on our issue tracker for details.
            			
            		
            		</p>
            	
            		<p id="go1.27.3">
            		go1.27.3
            		(released 2026-10-19)
            		
            			includes
            			
            				
            				security
            				fixes to the <code>crypto/x509</code> package.
            			

            			
            			See the
            			<a href="https://github.com/golang/go/issues?q=milestone%3AGo1.27.3+label%3ACherryPickApproved">Go 1.27.3 milestone</a>
            			on our issue tracker for details.
            			
            		
            		</p>
            	
            		<p id="go1.27.4">
            		go1.27.4
            		(released 2026-11-10)
            		
            			includes
            			
            				
            				security
            				fixes to cgo, the <code>go</code> command, the compiler, the linker, and the <code>net/http</code> package, as well as
            				
            				bug 
            				fixes to the assembler, the compiler, the runtime, toolchain bootstrapping, and the <code>crypto/fips140</code>, <code>crypto/hkdf</code>, <code>crypto/rsa</code>, <code>crypto/tls</code>, and <code>net</code> packages.
            			

            			
            			See the
            			<a href="https://github.com/golang/go/issues?q=milestone%3AGo1.27.4+label%3ACherryPickApproved">Go 1.27.4 milestone</a>
            			on our issue tracker for details.
            			
            		
            		</p>
            	



            	<h2 id="go1.26.0">go1.26.0 (released 2026-02-10)</h2>

            	<p>
            	Go 1.26.0 is a major release of Go.
            	Read the <a href="/doc/go1.26">Go 1.26 Release Notes</a> for more information.
            	</p>

            	<h3 id="go1.26.minor">Minor revisions</h3>

            	
            		<p id="go1.26.1">
            		go1.26.1
            		(released 2026-03-05)
            		
            			includes
            			
            				
            				security
            				fixes to the <code>crypto/x509</code>, <code>html/template</code>, <code>net/url</code>, and <code>os</code> packages, as well as
            				
            				bug 
            				fixes to the <code>go</code> command, the <code>go fix</code> command, the compiler, and the <code>os</code> and <code>reflect</code> packages.
            			

            			
            			See the
            			<a href="https://github.com/golang/go/issues?q=milestone%3AGo1.26.1+label%3ACherryPickApproved">Go 1.26.1 milestone</a>
            			on our issue tracker for details.
            			
            		
            		</p>
            	
            		<p id="go1.26.2">
            		go1.26.2
            		(released 2026-04-07)
            		
            			includes
            			
            				
            				security
            				fixes to the <code>go</code> command, the compiler, and the <code>archive/tar</code>, <code>crypto/tls</code>, <code>crypto/x509</code>, <code>html/template</code>, and <code>os</code> packages, as well as
            				
            				bug 
            				fixes to the <code>go</code> command, the <code>go fix</code> command, the compiler, the linker, the runtime, and the <code>net</code>, <code>net/http</code>, and <code>net/url</code> packages.
            			

            			
            			See the
            			<a href="https://github.com/golang/go/issues?q=milestone%3AGo1.26.2+label%3ACherryPickApproved">Go 1.26.2 milestone</a>
            			on our issue tracker for details.
            			
            		
            		</p>
            	
            		<p id="go1.26.3">
            		go1.26.3
            		(released 2026-05-07)
            		
            			includes
            			
            				
            				security
            				fixes to the <code>go</code> command, the <code>pack</code> tool, and the <code>html/template</code>, <code>net</code>, <code>net/http</code>, <code>net/http/httputil</code>, <code>net/mail</code>, and <code>syscall</code> packages, as well as
            				
            				bug 
            				fixes to the <code>go</code> command, the <code>go fix</code> command, the compiler, the linker, the runtime, and the <code>crypto/fips140</code>, <code>crypto/tls</code>, <code>go/types</code>, and <code>os</code> packages.
            			

            			
            			See the
            			<a href="https://github.com/golang/go/issues?q=milestone%3AGo1.26.3+label%3ACherryPickApproved">Go 1.26.3 milestone</a>
            			on our issue tracker for details.
            			
            		
            		</p>
            	
            		<p id="go1.26.4">
            		go1.26.4
            		(released 2026-06-02)
            		
            			includes
            			
            				
            				security
            				fixes to the <code>crypto/x509</code>, <code>mime</code>, and <code>net/textproto</code> packages, as well as
            				
            				bug 
            				fixes to the compiler, the runtime, the <code>go fix</code> command, and the <code>crypto/fips140</code> package.
            			

            			
            			See the
            			<a href="https://github.com/golang/go/issues?q=milestone%3AGo1.26.4+label%3ACherryPickApproved">Go 1.26.4 milestone</a>
            			on our issue tracker for details.
            			
            		
            		</p>
            	
            		<p id="go1.26.5">
            		go1.26.5
            		(released 2026-07-07)
            		
            			includes
            			
            				
