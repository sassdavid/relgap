            <article class="Doc Article">





            <h1>Go 1.26 Release Notes</h1>






            <div id="nav" class="TOC"></div>



            <div class='markdown'>
            <style>
              main ul li { margin: 0.5em 0; }
            </style>
            <h2 id="introduction">Introduction to Go 1.26</h2>
            <p>The latest Go release, version 1.26, arrives in <a href="/doc/devel/release#go1.26.0">February 2026</a>, six months after <a href="/doc/go1.25">Go 1.25</a>.
            Most of its changes are in the implementation of the toolchain, runtime, and libraries.
            As always, the release maintains the Go 1 promise of compatibility.
            We expect almost all Go programs to continue to compile and run as before.</p>
            <h2 id="language">Changes to the language</h2>
            <!-- https://go.dev/issue/45624 --->
            <p>The built-in <code>new</code> function, which creates a new variable, now allows
            its operand to be an expression, specifying the initial value of the
            variable.</p>
            <p>This feature is particularly useful when working with serialization
            packages such as <code>encoding/json</code> or protocol buffers that use a
            pointer to represent an optional value, as it enables an optional
            field to be populated in a simple expression, for example:</p>
            <pre><code class="language-go">import &quot;encoding/json&quot;

            type Person struct {
                Name string   `json:&quot;name&quot;`
                Age  *int     `json:&quot;age&quot;` // age if known; nil otherwise
            }

            func personJSON(name string, born time.Time) ([]byte, error) {
                return json.Marshal(Person{
                    Name: name,
                    Age:  new(yearsSince(born)),
                })
            }

            func yearsSince(t time.Time) int {
                return int(time.Since(t).Hours() / (365.25 * 24)) // approximately
            }
            </code></pre>
            <!-- https://go.dev/issue/75883 --->
            <p>The restriction that a generic type may not refer to itself in its type parameter list
            has been lifted.
            It is now possible to specify type constraints that refer to the generic type being
            constrained.
            For instance, a generic type <code>Adder</code> may require that it be instantiated with a
            type that is like itself:</p>
            <pre><code class="language-go">type Adder[A Adder[A]] interface {
                Add(A) A
            }

            func algo[A Adder[A]](x, y A) A {
                return x.Add(y)
            }
            </code></pre>
            <p>Previously, the self-reference to <code>Adder</code> on the first line was not allowed.
            Besides making type constraints more powerful, this change also simplifies the spec
            rules for type parameters ever so slightly.</p>
            <h2 id="tools">Tools</h2>
            <h3 id="go-command">Go command</h3>
            <!-- go.dev/issue/75432 -->
            <p>The venerable <code>go fix</code> command has been completely revamped and is now the home
            of Go&rsquo;s <em>modernizers</em>. It provides a dependable, push-button way to update Go
            code bases to the latest idioms and core library APIs. The initial suite of
            modernizers includes dozens of fixers to make use of modern features of the Go
            language and library, as well a source-level inliner that allows users to
            automate their own API migrations using
            <a href="https://pkg.go.dev/golang.org/x/tools/go/analysis/passes/inline#hdr-Analyzer_inline" rel="noreferrer" target="_blank"><code>//go:fix inline</code> directives</a>.
            These fixers should not change the behavior of your program, so if you encounter
            any issues with a fix performed by <code>go fix</code>, please <a href="/issue/new">report it</a>.</p>
            <p>The rewritten <code>go fix</code> command builds atop the exact same <a href="https://pkg.go.dev/golang.org/x/tools/go/analysis" rel="noreferrer" target="_blank">Go analysis
            framework</a> as <code>go vet</code>.
            This means the same analyzers that provide diagnostics in <code>go vet</code>
            can be used to suggest and apply fixes in <code>go fix</code>.
            The <code>go fix</code> command&rsquo;s historical fixers, all of which were obsolete,
            have been removed.</p>
            <p>Two upcoming Go blog posts will go into more detail on modernizers, the inliner,
            and how to get the most out of <code>go fix</code>.</p>
            <!-- TODO(adonovan): link to blog posts once live. -->
            <!-- go.dev/issue/74748 -->
            <p><code>go mod init</code> now defaults to a lower <code>go</code> version in new <code>go.mod</code> files.
            Running <code>go mod init</code>
            using a toolchain of version <code>1.N.X</code> will create a <code>go.mod</code> file
            specifying the Go version <code>go 1.(N-1).0</code>. Pre-release versions of <code>1.N</code> will
            create <code>go.mod</code> files specifying <code>go 1.(N-2).0</code>. For example, the Go 1.26
            release candidates will create <code>go.mod</code> files with <code>go 1.24.0</code>, and Go 1.26
            and its minor releases will create <code>go.mod</code> files with <code>go 1.25.0</code>. This is intended
            to encourage the creation of modules that are compatible with currently supported
            versions of Go. For additional control over the <code>go</code> version in new modules,
            <code>go mod init</code> can be followed up with <code>go get go@version</code>.</p>
            <!-- go.dev/issue/74667 -->
            <p><code>cmd/doc</code>, and <code>go tool doc</code> have been deleted. <code>go doc</code> can be used as
            a replacement for <code>go tool doc</code>: it takes the same flags and arguments and
            has the same behavior.</p>
            <h3 id="pprof">Pprof</h3>
            <!-- go.dev/issue/74774 -->
            <p>The <code>pprof</code> tool web UI, enabled with the <code>-http</code> flag, now defaults to the flame graph view.
            The previous graph view is available in the &ldquo;View -&gt; Graph&rdquo; menu, or via <code>/ui/graph</code>.</p>
            <h2 id="runtime">Runtime</h2>
            <h3 id="new-garbage-collector">New garbage collector</h3>
            <p>The Green Tea garbage collector, previously available as an experiment in
            Go 1.25, is now enabled by default after incorporating feedback.</p>
            <p>This garbage collector&rsquo;s design improves the performance of marking and
            scanning small objects through better locality and CPU scalability.
            Benchmark results vary, but we expect somewhere between a 10–40% reduction
            in garbage collection overhead in real-world programs that heavily use the
            garbage collector.
            Further improvements, on the order of 10% in garbage collection overhead,
            are expected when running on newer amd64-based CPU platforms (Intel Ice
            Lake or AMD Zen 4 and newer), as the garbage collector now leverages
            vector instructions for scanning small objects when possible.</p>
            <p>The new garbage collector may be disabled by setting
            <code>GOEXPERIMENT=nogreenteagc</code> at build time.
            This opt-out setting is expected to be removed in Go 1.27.
            If you disable the new garbage collector for any reason related to its
            performance or behavior, please <a href="/issue/new">file an issue</a>.</p>
            <h3 id="faster-cgo-calls">Faster cgo calls</h3>
            <!-- CL 646198 -->
            <p>The baseline runtime overhead of cgo calls has been reduced by ~30%.</p>
            <h3 id="heap-base-address-randomization">Heap base address randomization</h3>
            <!-- CL 674835 -->
            <p>On 64-bit platforms, the runtime now randomizes the heap base address
            at startup.
            This is a security enhancement that makes it harder for attackers to
            predict memory addresses and exploit vulnerabilities when using cgo.
            This feature may be disabled by setting
            <code>GOEXPERIMENT=norandomizedheapbase64</code> at build time.
            This opt-out setting is expected to be removed in a future Go release.</p>
            <h3 id="goroutineleak-profiles">Experimental goroutine leak profile</h3>
            <!-- CL 688335 -->
            <p>A new profile type that reports leaked goroutines is now available as an
            experiment.
            The new profile type, named <code>goroutineleak</code> in the
            <a href="/pkg/runtime/pprof"><code>runtime/pprof</code></a> package, may be enabled by setting
            <code>GOEXPERIMENT=goroutineleakprofile</code> at build time.
            Enabling the experiment also makes the profile available as a
            <a href="/pkg/net/http/pprof"><code>net/http/pprof</code></a> endpoint,
            <code>/debug/pprof/goroutineleak</code>.</p>
            <p>A <em>leaked</em> goroutine is a goroutine blocked on some concurrency primitive
            (channels, <a href="/pkg/sync#Mutex"><code>sync.Mutex</code></a>, <a href="/pkg/sync#Cond"><code>sync.Cond</code></a>, etc) that
            cannot possibly become unblocked.
            The runtime detects leaked goroutines using the garbage collector: if a
            goroutine G is blocked on concurrency primitive P, and P is unreachable from
            any runnable goroutine or any goroutine that <em>those</em> could unblock, then P
            cannot be unblocked, so goroutine G can never wake up.
            While it is impossible to detect permanently blocked goroutines in all cases,
            this approach detects a large class of such leaks.</p>
            <p>The following example showcases a real-world goroutine leak that
            can be revealed by the new profile:</p>
            <pre><code class="language-go">type result struct {
                res workResult
                err error
            }

            func processWorkItems(ws []workItem) ([]workResult, error) {
                // Process work items in parallel, aggregating results in ch.
                ch := make(chan result)
                for _, w := range ws {
                    go func() {
                        res, err := processWorkItem(w)
                        ch &lt;- result{res, err}
                    }()
                }

                // Collect the results from ch, or return an error if one is found.
                var results []workResult
                for range len(ws) {
                    r := &lt;-ch
                    if r.err != nil {
                        // This early return may cause goroutine leaks.
                        return nil, r.err
                    }
                    results = append(results, r.res)
                }
                return results, nil
            }
            </code></pre>
            <p>Because <code>ch</code> is unbuffered, if <code>processWorkItems</code> returns early due to
            an error, all remaining <code>processWorkItem</code> goroutines will leak.
            Soon after this happens, <code>ch</code> will become unreachable to all other
            goroutines not involved in the leak, allowing the runtime to detect
            and report the leaked goroutines.</p>
            <p>Because this technique builds on reachability, the runtime may fail to identify
            leaks caused by blocking on concurrency primitives reachable through global
            variables or the local variables of runnable goroutines.</p>
            <p>Special thanks to Vlad Saioc at Uber for contributing this work.
            The underlying theory is presented in detail in <a href="https://dl.acm.org/doi/pdf/10.1145/3676641.3715990" rel="noreferrer" target="_blank">a publication by
            Saioc et al</a>.</p>
            <p>The implementation is production-ready, and is only considered an
            experiment for the purposes of collecting feedback on the API,
            specifically the choice to make it a new profile.
            The feature is also designed to not incur any additional run-time
            overhead unless it is actively in-use.</p>
            <p>We encourage users to try out the new feature in <a href="/play/p/3C71z4Dpav-?v=gotip">the Go
            playground</a>,
            in tests, in continuous integration, and in production.
            We welcome additional feedback on the <a href="/issue/74609">proposal
            issue</a>.</p>
            <p>We aim to enable goroutine leak profiles by default in Go 1.27.</p>
            <h2 id="compiler">Compiler</h2>
            <!-- CLs 707755, 722440 -->
            <p>The compiler can now allocate the backing store for slices on the stack in more
            situations, which improves performance. If this change is causing trouble, the
            <a href="https://pkg.go.dev/golang.org/x/tools/cmd/bisect" rel="noreferrer" target="_blank">bisect tool</a> can be used to
            find the allocation causing trouble using the <code>-compile=variablemake</code> flag. All
            such new stack allocations can also be turned off using
            <code>-gcflags=all=-d=variablemakehash=n</code>.
            If you encounter issues with this optimization, please <a href="/issue/new">file an issue</a>.</p>
            <h2 id="linker">Linker</h2>
            <p>On 64-bit ARM-based Windows (the <code>windows/arm64</code> port), the linker now supports internal
            linking mode of cgo programs, which can be requested with the
            <code>-ldflags=-linkmode=internal</code> flag.</p>
            <p>There are several minor changes to executable files. These changes do
            not affect running Go programs. They may affect programs that analyze
            Go executables, and they may affect people who use external linking
            mode with custom linker scripts.</p>
            <ul>
            <li>The <code>moduledata</code> structure is now in its own section, named
            <code>.go.module</code>.</li>
            <li>The <code>moduledata</code> <code>cutab</code> field, which is a slice, now has the
            correct length; previously the length was four times too large.</li>
            <li>The <code>pcHeader</code> found at the start of the <code>.gopclntab</code> section no
            longer records the start of the text section. That field is now
            always zero.</li>
            <li>That <code>pcHeader</code> change was made so that the <code>.gopclntab</code> section
            no longer contains any relocations. On platforms that support
            relro, the section has moved from the relro segment to the rodata
            segment.</li>
            <li>The funcdata symbols and the findfunctab have moved from the
            <code>.rodata</code> section to the <code>.gopclntab</code> section.</li>
            <li>The <code>.gosymtab</code> section has been removed. It was previously always
            present but empty.</li>
            <li>When using internal linking, ELF sections now appear in the
            section header list sorted by address. The previous order was
            somewhat unpredictable.</li>
            </ul>
            <p>The references to section names here use the ELF names as seen on
            Linux and other systems. The Mach-O names as seen on Darwin start with
            a double underscore and do not contain any dots.</p>
            <h2 id="bootstrap">Bootstrap</h2>
            <!-- go.dev/issue/69315 -->
            <p>As mentioned in the <a href="/doc/go1.24#bootstrap">Go 1.24 release notes</a>, Go 1.26 now requires
            Go 1.24.6 or later for bootstrap.
            We expect that Go 1.28 will require a minor release of Go 1.26 or later for bootstrap.</p>
            <h2 id="library">Standard library</h2>
            <h3 id="new-cryptohpke-package">New crypto/hpke package</h3>
            <p>The new <a href="/pkg/crypto/hpke"><code>crypto/hpke</code></a> package implements Hybrid Public Key Encryption
            (HPKE) as specified in <a href="https://rfc-editor.org/rfc/rfc9180.html" rel="noreferrer" target="_blank">RFC 9180</a>, including support for post-quantum
            hybrid KEMs.</p>
            <h3 id="simd">New experimental simd/archsimd package</h3>
            <p>Go 1.26 introduces a new experimental <a href="/pkg/simd/archsimd/"><code>simd/archsimd</code></a>
            package, which can be enabled by setting the environment variable
            <code>GOEXPERIMENT=simd</code> at build time.
            This package provides access to architecture-specific SIMD operations.
            It is currently available on the amd64 architecture and supports
            128-bit, 256-bit, and 512-bit vector types, such as
            <a href="/pkg/simd/archsimd#Int8x16"><code>Int8x16</code></a> and
            <a href="/pkg/simd/archsimd#Float64x8"><code>Float64x8</code></a>, with operations such as
            <a href="/pkg/simd/archsimd#Int8x16.Add"><code>Int8x16.Add</code></a>.
            The API is not yet considered stable.</p>
            <p>We intend to provide support for other architectures in future versions, but the
            API intentionally architecture-specific and thus non-portable.
            In addition, we plan to develop a high-level portable SIMD
            package in the future.</p>
            <p>See the <a href="/pkg/simd/archsimd">package documentation</a> and the <a href="/issue/73787">proposal issue</a> for more details.</p>
            <h3 id="new-experimental-runtimesecret-package">New experimental runtime/secret package</h3>
            <!-- https://go.dev/issue/21865 --->
            <p>The new <a href="/pkg/runtime/secret"><code>runtime/secret</code></a> package is available as an experiment,
            which can be enabled by setting the environment variable
            <code>GOEXPERIMENT=runtimesecret</code> at build time.
            It provides a facility for securely erasing temporaries used in
            code that manipulates secret information—typically cryptographic in nature—such
            as registers, stack, new heap allocations.
            This package is intended to make it easier to ensure <a href="https://en.wikipedia.org/wiki/Forward_secrecy" rel="noreferrer" target="_blank">forward
            secrecy</a>.
            It currently supports the amd64 and arm64 architectures on Linux.</p>
            <h3 id="minor_library_changes">Minor changes to the library</h3>
            <h4 id="bytespkgbytes"><a href="/pkg/bytes/"><code>bytes</code></a></h4>
            <p>The new <a href="/pkg/bytes#Buffer.Peek"><code>Buffer.Peek</code></a> method returns the next n bytes from the buffer without
            advancing it.</p>
            <h4 id="cryptopkgcrypto"><a href="/pkg/crypto/"><code>crypto</code></a></h4>
            <p>The new <a href="/pkg/crypto#Encapsulator"><code>Encapsulator</code></a> and <a href="/pkg/crypto#Decapsulator"><code>Decapsulator</code></a> interfaces allow accepting abstract
            KEM encapsulation or decapsulation keys.</p>
            <h4 id="cryptodsapkgcryptodsa"><a href="/pkg/crypto/dsa/"><code>crypto/dsa</code></a></h4>
            <p>The random parameter to <a href="/pkg/crypto/dsa#GenerateKey"><code>GenerateKey</code></a> is now ignored.
            Instead, it now always uses a secure source of cryptographically random bytes.
            For deterministic testing, use the new <a href="/pkg/testing/cryptotest#SetGlobalRandom"><code>testing/cryptotest.SetGlobalRandom</code></a> function.
            The new GODEBUG setting <code>cryptocustomrand=1</code> temporarily restores the old behavior.</p>
            <h4 id="cryptoecdhpkgcryptoecdh"><a href="/pkg/crypto/ecdh/"><code>crypto/ecdh</code></a></h4>
            <p>The random parameter to <a href="/pkg/crypto/ecdh#Curve.GenerateKey"><code>Curve.GenerateKey</code></a> is now ignored.
            Instead, it now always uses a secure source of cryptographically random bytes.
            For deterministic testing, use the new <a href="/pkg/testing/cryptotest#SetGlobalRandom"><code>testing/cryptotest.SetGlobalRandom</code></a> function.
            The new GODEBUG setting <code>cryptocustomrand=1</code> temporarily restores the old behavior.</p>
            <p>The new <a href="/pkg/crypto/ecdh#KeyExchanger"><code>KeyExchanger</code></a> interface, implemented by <a href="/pkg/crypto/ecdh#PrivateKey"><code>PrivateKey</code></a>, makes it possible
            to accept abstract ECDH private keys, e.g. those implemented in hardware.</p>
            <h4 id="cryptoecdsapkgcryptoecdsa"><a href="/pkg/crypto/ecdsa/"><code>crypto/ecdsa</code></a></h4>
            <p>The <code>big.Int</code> fields of <a href="/pkg/crypto/ecdsa#PublicKey"><code>PublicKey</code></a> and <a href="/pkg/crypto/ecdsa#PrivateKey"><code>PrivateKey</code></a> are now deprecated.</p>
            <p>The random parameter to <a href="/pkg/crypto/ecdsa#GenerateKey"><code>GenerateKey</code></a>, <a href="/pkg/crypto/ecdsa#SignASN1"><code>SignASN1</code></a>, <a href="/pkg/crypto/ecdsa#Sign"><code>Sign</code></a>, and <a href="/pkg/crypto/ecdsa#PrivateKey.Sign"><code>PrivateKey.Sign</code></a> is now ignored.
            Instead, they now always use a secure source of cryptographically random bytes.
            For deterministic testing, use the new <a href="/pkg/testing/cryptotest#SetGlobalRandom"><code>testing/cryptotest.SetGlobalRandom</code></a> function.
            The new GODEBUG setting <code>cryptocustomrand=1</code> temporarily restores the old behavior.</p>
            <h4 id="cryptoed25519pkgcryptoed25519"><a href="/pkg/crypto/ed25519/"><code>crypto/ed25519</code></a></h4>
            <p>If the random parameter to <a href="/pkg/crypto/ed25519#GenerateKey"><code>GenerateKey</code></a> is nil, GenerateKey now always uses a
            secure source of cryptographically random bytes, instead of <a href="/pkg/crypto/rand#Reader"><code>crypto/rand.Reader</code></a>
            (which could have been overridden). The new GODEBUG setting <code>cryptocustomrand=1</code>
            temporarily restores the old behavior.</p>
            <h4 id="cryptofips140pkgcryptofips140"><a href="/pkg/crypto/fips140/"><code>crypto/fips140</code></a></h4>
            <p><a href="/doc/security/fips140">FIPS 140-3 Go Cryptographic Module</a> v1.26.0 includes changes made to the <code>crypto/internal/fips140/...</code> packages up to this release, and can now be selected with GOFIPS140.</p>
            <p>The new <a href="/pkg/crypto/fips140#WithoutEnforcement"><code>WithoutEnforcement</code></a> and <a href="/pkg/crypto/fips140#Enforced"><code>Enforced</code></a> functions now allow running
            in <code>GODEBUG=fips140=only</code> mode while selectively disabling the strict FIPS 140-3 checks.</p>
            <p><a href="/pkg/crypto/fips140#Version"><code>Version</code></a> returns the resolved FIPS 140-3 Go Cryptographic Module version when building against a frozen module with GOFIPS140.</p>
            <h4 id="cryptomlkempkgcryptomlkem"><a href="/pkg/crypto/mlkem/"><code>crypto/mlkem</code></a></h4>
            <p>The new <a href="/pkg/crypto/mlkem#DecapsulationKey768.Encapsulator"><code>DecapsulationKey768.Encapsulator</code></a> and
            <a href="/pkg/crypto/mlkem#DecapsulationKey1024.Encapsulator"><code>DecapsulationKey1024.Encapsulator</code></a> methods implement the new
            <a href="/pkg/crypto#Decapsulator"><code>crypto.Decapsulator</code></a> interface.</p>
            <p>Encapsulation and decapsultion operations are now approximately 18% faster.</p>
            <h4 id="cryptomlkemmlkemtestpkgcryptomlkemmlkemtest"><a href="/pkg/crypto/mlkem/mlkemtest/"><code>crypto/mlkem/mlkemtest</code></a></h4>
            <p>The new <a href="/pkg/crypto/mlkem/mlkemtest"><code>crypto/mlkem/mlkemtest</code></a> package exposes the <a href="/pkg/crypto/mlkem/mlkemtest#Encapsulate768"><code>Encapsulate768</code></a> and
            <a href="/pkg/crypto/mlkem/mlkemtest#Encapsulate1024"><code>Encapsulate1024</code></a> functions which implement derandomized ML-KEM encapsulation,
            for use with known-answer tests.</p>
            <h4 id="cryptorandpkgcryptorand"><a href="/pkg/crypto/rand/"><code>crypto/rand</code></a></h4>
            <p>The random parameter to <a href="/pkg/crypto/rand#Prime"><code>Prime</code></a> is now ignored.
            Instead, it now always uses a secure source of cryptographically random bytes.
            For deterministic testing, use the new <a href="/pkg/testing/cryptotest#SetGlobalRandom"><code>testing/cryptotest.SetGlobalRandom</code></a> function.
            The new GODEBUG setting <code>cryptocustomrand=1</code> temporarily restores the old behavior.</p>
            <h4 id="cryptorsapkgcryptorsa"><a href="/pkg/crypto/rsa/"><code>crypto/rsa</code></a></h4>
            <p>The new <a href="/pkg/crypto/rsa#EncryptOAEPWithOptions"><code>EncryptOAEPWithOptions</code></a> function allows specifying different hash
            functions for OAEP padding and MGF1 mask generation.</p>
            <p>The random parameter to <a href="/pkg/crypto/rsa#GenerateKey"><code>GenerateKey</code></a>, <a href="/pkg/crypto/rsa#GenerateMultiPrimeKey"><code>GenerateMultiPrimeKey</code></a>, and <a href="/pkg/crypto/rsa#EncryptPKCS1v15"><code>EncryptPKCS1v15</code></a> is now ignored.
            Instead, they now always use a secure source of cryptographically random bytes.
            For deterministic testing, use the new <a href="/pkg/testing/cryptotest#SetGlobalRandom"><code>testing/cryptotest.SetGlobalRandom</code></a> function.
            The new GODEBUG setting <code>cryptocustomrand=1</code> temporarily restores the old behavior.</p>
            <p>If <a href="/pkg/crypto/rsa#PrivateKey"><code>PrivateKey</code></a> fields are modified after calling <a href="/pkg/crypto/rsa#PrivateKey.Precompute"><code>PrivateKey.Precompute</code></a>,
            <a href="/pkg/crypto/rsa#PrivateKey.Validate"><code>PrivateKey.Validate</code></a> now fails.</p>
            <p><a href="/pkg/crypto/rsa#PrivateKey.D"><code>PrivateKey.D</code></a> is now checked for consistency with precomputed values, even if
            it is not used.</p>
            <p>Unsafe PKCS #1 v1.5 encryption padding (implemented by <a href="/pkg/crypto/rsa#EncryptPKCS1v15"><code>EncryptPKCS1v15</code></a>,
            <a href="/pkg/crypto/rsa#DecryptPKCS1v15"><code>DecryptPKCS1v15</code></a>, and <a href="/pkg/crypto/rsa#DecryptPKCS1v15SessionKey"><code>DecryptPKCS1v15SessionKey</code></a>) is now deprecated.</p>
            <h4 id="cryptosha3pkgcryptosha3"><a href="/pkg/crypto/sha3/"><code>crypto/sha3</code></a></h4>
            <p>The zero value of <a href="/pkg/crypto/sha3#SHA3"><code>SHA3</code></a> is now a usable SHA3-256 instance, and the zero value of <a href="/pkg/crypto/sha3#SHAKE"><code>SHAKE</code></a> is now a usable SHAKE256 instance.</p>
            <h4 id="cryptosubtlepkgcryptosubtle"><a href="/pkg/crypto/subtle"><code>crypto/subtle</code></a></h4>
            <p>The <a href="/pkg/crypto/subtle#WithDataIndependentTiming"><code>WithDataIndependentTiming</code></a>
            function no longer locks the calling goroutine to the OS thread while executing
            the passed function. Additionally, any goroutines which are spawned during the
            execution of the passed function and their descendants now inherit the properties of
            <code>WithDataIndependentTiming</code> for their lifetime. This change also affects cgo in
            the following ways:</p>
            <ul>
            <li>Any C code called via cgo from within the function passed to
            <code>WithDataIndependentTiming</code>, or from a goroutine spawned by the function passed
            to <code>WithDataIndependentTiming</code> and its descendants, will also have data
            independent timing enabled for the duration of the call. If the C code
            disables data independent timing, it will be re-enabled on return to Go.</li>
            <li>If C code called via cgo, from the function passed to
            <code>WithDataIndependentTiming</code> or elsewhere, enables or disables data independent
            timing then calling into Go will preserve that state for the duration of the
            call.</li>
            </ul>
            <h4 id="cryptotlspkgcryptotls"><a href="/pkg/crypto/tls/"><code>crypto/tls</code></a></h4>
            <p>The hybrid <a href="/pkg/crypto/tls#SecP256r1MLKEM768"><code>SecP256r1MLKEM768</code></a> and <a href="/pkg/crypto/tls#SecP384r1MLKEM1024"><code>SecP384r1MLKEM1024</code></a> post-quantum key
            exchanges are now enabled by default. They can be disabled by setting
            <a href="/pkg/crypto/tls#Config.CurvePreferences"><code>Config.CurvePreferences</code></a> or with the <code>tlssecpmlkem=0</code> GODEBUG setting.</p>
            <p>The new <a href="/pkg/crypto/tls#ClientHelloInfo.HelloRetryRequest"><code>ClientHelloInfo.HelloRetryRequest</code></a> field indicates if the ClientHello
            was sent in response to a HelloRetryRequest message. The new
            <a href="/pkg/crypto/tls#ConnectionState.HelloRetryRequest"><code>ConnectionState.HelloRetryRequest</code></a> field indicates if the server
            sent a HelloRetryRequest, or if the client received a HelloRetryRequest,
            depending on connection role.</p>
            <p>The <a href="/pkg/crypto/tls#QUICConn"><code>QUICConn</code></a> type used by QUIC implementations includes a new event
            for reporting TLS handshake errors.</p>
            <p>If <a href="/pkg/crypto/tls#Certificate.PrivateKey"><code>Certificate.PrivateKey</code></a> implements <a href="/pkg/crypto#MessageSigner"><code>crypto.MessageSigner</code></a>, its SignMessage
            method is used instead of Sign in TLS 1.2 and later.</p>
            <p>The following GODEBUG settings introduced in <a href="/doc/godebug#go-122">Go 1.22</a>
            and <a href="/doc/godebug#go-123">Go 1.23</a> will be removed in the next major Go release.
            Starting in Go 1.27, the new behavior will apply regardless of GODEBUG setting or go.mod language version.</p>
            <ul>
            <li><code>tlsunsafeekm</code>: <a href="/pkg/crypto/tls#ConnectionState.ExportKeyingMaterial"><code>ConnectionState.ExportKeyingMaterial</code></a> will require TLS 1.3 or Extended Master Secret.</li>
            <li><code>tlsrsakex</code>: legacy RSA-only key exchanges without ECDH won&rsquo;t be enabled by default.</li>
            <li><code>tls10server</code>: the default minimum TLS version for both clients and servers will be TLS 1.2.</li>
            <li><code>tls3des</code>: the default cipher suites will not include 3DES.</li>
            <li><code>x509keypairleaf</code>: <a href="/pkg/crypto/tls#X509KeyPair"><code>X509KeyPair</code></a> and <a href="/pkg/crypto/tls#LoadX509KeyPair"><code>LoadX509KeyPair</code></a> will always populate the <a href="/pkg/crypto/tls#Certificate.Leaf"><code>Certificate.Leaf</code></a> field.</li>
            </ul>
            <h4 id="cryptox509pkgcryptox509"><a href="/pkg/crypto/x509/"><code>crypto/x509</code></a></h4>
            <p>The <a href="/pkg/crypto/x509#ExtKeyUsage"><code>ExtKeyUsage</code></a> and <a href="/pkg/crypto/x509#KeyUsage"><code>KeyUsage</code></a> types now have <code>String</code> methods that return the
            corresponding OID names as defined in RFC 5280 and other registries.</p>
            <p>The <a href="/pkg/crypto/x509#ExtKeyUsage"><code>ExtKeyUsage</code></a> type now has an <code>OID</code> method that returns the corresponding OID for the EKU.</p>
            <p>The new <a href="/pkg/crypto/x509#OIDFromASN1OID"><code>OIDFromASN1OID</code></a> function allows converting an <a href="/pkg/encoding/asn1#ObjectIdentifier"><code>encoding/asn1.ObjectIdentifier</code></a> into
            an <a href="/pkg/crypto/x509#OID"><code>OID</code></a>.</p>
            <h4 id="debugelfpkgdebugelf"><a href="/pkg/debug/elf/"><code>debug/elf</code></a></h4>
            <p>Additional <code>R_LARCH_*</code> constants from <a href="https://github.com/loongson/la-abi-specs/blob/v2.40/laelf.adoc" rel="noreferrer" target="_blank">LoongArch ELF psABI v20250521</a>
            (global version v2.40) are defined for use with LoongArch systems.</p>
            <h4 id="errorspkgerrors"><a href="/pkg/errors/"><code>errors</code></a></h4>
            <p>The new <a href="/pkg/errors#AsType"><code>AsType</code></a> function is a generic version of <a href="/pkg/errors#As"><code>As</code></a>. It is type-safe, faster,
            and, in most cases, easier to use.</p>
            <h4 id="fmtpkgfmt"><a href="/pkg/fmt/"><code>fmt</code></a></h4>
            <!-- go.dev/cl/708836 -->
            <p>For unformatted strings, <code>fmt.Errorf(&quot;x&quot;)</code> now allocates less and generally matches
            the allocations for <code>errors.New(&quot;x&quot;)</code>.</p>
            <h4 id="goastpkggoast"><a href="/pkg/go/ast/"><code>go/ast</code></a></h4>
            <p>The new <a href="/pkg/go/ast#ParseDirective"><code>ParseDirective</code></a> function parses <a href="/doc/comment#Syntax">directive
            comments</a>, which are comments such as <code>//go:generate</code>.
            Source code tools can support their own directive comments and this new API
            should help them implement the conventional syntax.</p>
            <!-- go.dev/issue/76395 -->
            <p>The new <a href="/pkg/go/ast#BasicLit.ValueEnd"><code>BasicLit.ValueEnd</code></a> field records the precise end position of
            a literal so that the <a href="/pkg/go/ast#BasicLit.End"><code>BasicLit.End</code></a> method can now always return the
            correct answer. (Previously it was computed using a heuristic that was
            incorrect for multi-line raw string literals in Windows source files,
            due to removal of carriage returns.)</p>
            <p>Programs that update the <code>ValuePos</code> field of <code>BasicLit</code>s produced by
            the parser may need to also update or clear the <code>ValueEnd</code> field to
            avoid minor differences in formatted output.</p>
            <h4 id="gotokenpkggotoken"><a href="/pkg/go/token/"><code>go/token</code></a></h4>
            <p>The new <a href="/pkg/go/token#File.End"><code>File.End</code></a> convenience method returns the file&rsquo;s end position.</p>
            <h4 id="gotypespkggotypes"><a href="/pkg/go/types/"><code>go/types</code></a></h4>
            <p>The <code>gotypesalias</code> GODEBUG setting introduced in <a href="/doc/godebug#go-122">Go 1.22</a>
            will be removed in the next major Go release.
            Starting in Go 1.27, the <a href="/pkg/go/types"><code>go/types</code></a> package will always produce an
            <a href="/pkg/go/types#Alias">Alias type</a> for the representation of <a href="/ref/spec#Type_declarations">type aliases</a>
            regardless of GODEBUG setting or go.mod language version.</p>
            <h4 id="imagejpegpkgimagejpeg"><a href="/pkg/image/jpeg/"><code>image/jpeg</code></a></h4>
            <p>The JPEG encoder and decoder have been replaced with new, faster, more accurate implementations.
            Code that expects specific bit-for-bit outputs from the encoder or decoder may need to be updated.</p>
            <h4 id="iopkgio"><a href="/pkg/io/"><code>io</code></a></h4>
            <!-- go.dev/cl/722500 -->
            <p><a href="/pkg/io#ReadAll"><code>ReadAll</code></a> now allocates less intermediate memory and returns a minimally sized
            final slice. It is often about two times faster while typically allocating around half
            as much total memory, with more benefit for larger inputs.</p>
            <h4 id="logslogpkglogslog"><a href="/pkg/log/slog/"><code>log/slog</code></a></h4>
            <p>The <a href="/pkg/log/slog#NewMultiHandler"><code>NewMultiHandler</code></a> function creates a
            <a href="/pkg/log/slog#MultiHandler"><code>MultiHandler</code></a> that invokes all the given Handlers.
            Its <code>Enabled</code> method reports whether any of the handlers&rsquo; <code>Enabled</code> methods
            return true.
            Its <code>Handle</code>, <code>WithAttrs</code> and <code>WithGroup</code> methods call the corresponding method
            on each of the enabled handlers.</p>
            <h4 id="netpkgnet"><a href="/pkg/net/"><code>net</code></a></h4>
            <p>The new <a href="/pkg/net/#Dialer"><code>Dialer</code></a> methods
            <a href="/pkg/net/#Dialer.DialIP"><code>DialIP</code></a>,
            <a href="/pkg/net/#Dialer.DialTCP"><code>DialTCP</code></a>,
            <a href="/pkg/net/#Dialer.DialUDP"><code>DialUDP</code></a>, and
            <a href="/pkg/net/#Dialer.DialUnix"><code>DialUnix</code></a>
            permit dialing specific network types with context values.</p>
            <h4 id="nethttppkgnethttp"><a href="/pkg/net/http/"><code>net/http</code></a></h4>
            <p>The new
            <a href="/pkg/net/http#HTTP2Config.StrictMaxConcurrentRequests"><code>HTTP2Config.StrictMaxConcurrentRequests</code></a>
            field controls whether a new connection should be opened
            if an existing HTTP/2 connection has exceeded its stream limit.</p>
            <p>The new <a href="/pkg/net/http#Transport.NewClientConn"><code>Transport.NewClientConn</code></a> method returns a client connection
            to an HTTP server.
            Most users should continue to use <a href="/pkg/net/http#Transport.RoundTrip"><code>Transport.RoundTrip</code></a> to make requests,
            which manages a pool of connections.
            <code>NewClientConn</code> is useful for users who need to implement their own connection management.</p>
            <p><a href="/pkg/net/http#Client"><code>Client</code></a> now uses and sets cookies scoped to URLs with the host portion matching
            <a href="/pkg/net/http#Request.Host"><code>Request.Host</code></a> when available.
            Previously, the connection address host was always used.
            <a href="/pkg/net/http#ServeMux"><code>ServeMux</code></a> trailing slash redirects now use HTTP status 307
            (Temporary Redirect) instead of 301 (Moved Permanently).</p>
            <h4 id="nethttphttptestpkgnethttphttptest"><a href="/pkg/net/http/httptest/"><code>net/http/httptest</code></a></h4>
            <p>The HTTP client returned by <a href="/pkg/net/http/httptest#Server.Client"><code>Server.Client</code></a> will now redirect requests for
            <code>example.com</code> and any subdomains to the server being tested.</p>
            <h4 id="nethttphttputilpkgnethttphttputil"><a href="/pkg/net/http/httputil/"><code>net/http/httputil</code></a></h4>
            <p>The <a href="/pkg/net/http/httputil#ReverseProxy.Director"><code>ReverseProxy.Director</code></a> configuration field is deprecated
            in favor of <a href="/pkg/net/http/httputil#ReverseProxy.Rewrite"><code>ReverseProxy.Rewrite</code></a>.</p>
            <p>A malicious client can remove headers added by a <code>Director</code> function
            by designating those headers as hop-by-hop. Since there is no way to address
            this problem within the scope of the <code>Director</code> API, we added a new
            <code>Rewrite</code> hook in Go 1.20. <code>Rewrite</code> hooks are provided with both the
            unmodified inbound request received by the proxy and the outbound request
            which will be sent by the proxy.</p>
            <p>Since the <code>Director</code> hook is fundamentally unsafe, we are now deprecating it.</p>
            <h4 id="netnetippkgnetnetip"><a href="/pkg/net/netip/"><code>net/netip</code></a></h4>
            <p>The new <a href="/pkg/net/netip#Prefix.Compare"><code>Prefix.Compare</code></a> method compares two prefixes.</p>
            <h4 id="neturlpkgneturl"><a href="/pkg/net/url/"><code>net/url</code></a></h4>
            <p><a href="/pkg/net/url#Parse"><code>Parse</code></a> now rejects malformed URLs containing colons in the host subcomponent,
            such as <code>http://::1/</code> or <code>http://localhost:80:80/</code>.
            URLs containing bracketed IPv6 addresses, such as <code>http://[::1]/</code> are still accepted.
            The new GODEBUG setting <code>urlstrictcolons=0</code> restores the old behavior.</p>
            <h4 id="ospkgos"><a href="/pkg/os/"><code>os</code></a></h4>
            <p>The new <a href="/pkg/os#Process.WithHandle"><code>Process.WithHandle</code></a> method provides
            access to an internal process handle on supported platforms (pidfd on Linux 5.4
            or later, Handle on Windows).</p>
            <p>On Windows, the <a href="/pkg/os#OpenFile"><code>OpenFile</code></a> <code>flag</code> parameter can now contain any combination of
            Windows-specific file flags, such as <code>FILE_FLAG_OVERLAPPED</code> and
            <code>FILE_FLAG_SEQUENTIAL_SCAN</code>, for control of file or device caching behavior,
            access modes, and other special-purpose flags.</p>
            <h4 id="ossignalpkgossignal"><a href="/pkg/os/signal/"><code>os/signal</code></a></h4>
            <p><a href="/pkg/os/signal#NotifyContext"><code>NotifyContext</code></a> now cancels the returned context with <a href="/pkg/context#CancelCauseFunc"><code>context.CancelCauseFunc</code></a>
            and an error indicating which signal was received.</p>
            <h4 id="reflectpkgreflect"><a href="/pkg/reflect/"><code>reflect</code></a></h4>
            <p>The new methods <a href="/pkg/reflect#Type.Fields"><code>Type.Fields</code></a>,
            <a href="/pkg/reflect#Type.Methods"><code>Type.Methods</code></a>,
            <a href="/pkg/reflect#Type.Ins"><code>Type.Ins</code></a>
            and <a href="/pkg/reflect#Type.Outs"><code>Type.Outs</code></a>
            return iterators for a type&rsquo;s fields (for a struct type), methods,
            inputs and outputs parameters (for a function type), respectively.</p>
            <p>Similarly, the new methods <a href="/pkg/reflect#Value.Fields"><code>Value.Fields</code></a>
            and <a href="/pkg/reflect#Value.Methods"><code>Value.Methods</code></a> return iterators over
            a value&rsquo;s fields or methods, respectively.
            Each iteration yields the type information (<a href="/pkg/reflect#StructField"><code>StructField</code></a> or
            <a href="/pkg/reflect#Method"><code>Method</code></a>) of a field or method,
            along with the field or method <a href="/pkg/reflect#Value"><code>Value</code></a>.</p>
            <h4 id="runtimemetricspkgruntimemetrics"><a href="/pkg/runtime/metrics/"><code>runtime/metrics</code></a></h4>
            <p>Several new scheduler metrics have been added, including counts of
            goroutines in various states (waiting, runnable, etc.) under the
            <code>/sched/goroutines</code> prefix, the number of OS threads the runtime is
            aware of with <code>/sched/threads:threads</code>, and the total number of
            goroutines created by the program with
            <code>/sched/goroutines-created:goroutines</code>.</p>
            <h4 id="testingpkgtesting"><a href="/pkg/testing/"><code>testing</code></a></h4>
            <p>The new methods <a href="/pkg/testing#T.ArtifactDir"><code>T.ArtifactDir</code></a>, <a href="/pkg/testing#B.ArtifactDir"><code>B.ArtifactDir</code></a>, and <a href="/pkg/testing#F.ArtifactDir"><code>F.ArtifactDir</code></a>
            return a directory in which to write test output files (artifacts).</p>
            <p>When the <code>-artifacts</code> flag is provided to <code>go test</code>,
            this directory will be located under the output directory
            (specified with <code>-outputdir</code>, or the current directory by default).
            Otherwise, artifacts are stored in a temporary directory
            which is removed after the test completes.</p>
            <p>The first call to <code>ArtifactDir</code> when <code>-artifacts</code> is provided
            writes the location of the directory to the test log.</p>
            <p>For example, in a test named <code>TestArtifacts</code>,
            <code>t.ArtifactDir()</code> emits:</p>
            <pre><code>=== ARTIFACTS TestArtifacts /path/to/artifact/dir
            </code></pre>
            <!-- go.dev/issue/73137 -->
            <p>The <a href="/pkg/testing#B.Loop"><code>B.Loop</code></a> method no longer prevents inlining in
            the loop body, which could lead to unanticipated allocation and slower benchmarks.
            With this fix, we expect that all benchmarks can be converted from the old
            <a href="/pkg/testing#B"><code>B.N</code></a> style to the new <code>B.Loop</code> style with no ill effects.
            Within the body of a <code>for b.Loop() { ... }</code> loop, function call parameters, results,
            and assigned variables are still kept alive, preventing the compiler from
            optimizing away entire parts of the benchmark.</p>
            <h4 id="testingcryptotestpkgtestingcryptotest"><a href="/pkg/testing/cryptotest/"><code>testing/cryptotest</code></a></h4>
            <p>The new <a href="/pkg/testing/cryptotest#SetGlobalRandom"><code>SetGlobalRandom</code></a> function configures a global, deterministic
            cryptographic randomness source for the duration of the test. It affects
            <code>crypto/rand</code>, and all implicit sources of cryptographic randomness in the
            <code>crypto/...</code> packages.</p>
            <h4 id="timepkgtime"><a href="/pkg/time/"><code>time</code></a></h4>
            <p>The <code>asynctimerchan</code> GODEBUG setting introduced in <a href="/doc/godebug#go-123">Go 1.23</a>
            will be removed in the next major Go release.
            Starting in Go 1.27, the <a href="/pkg/time"><code>time</code></a> package will always use unbuffered
            (synchronous) channels for timers regardless of GODEBUG setting or go.mod language version.</p>
            <h2 id="ports">Ports</h2>
            <h3 id="darwin">Darwin</h3>
            <!-- go.dev/issue/75836 -->
            <p>Go 1.26 is the last release that will run on macOS 12 Monterey. Go 1.27 will require macOS 13 Ventura or later.</p>
            <h3 id="freebsd">FreeBSD</h3>
            <!-- go.dev/issue/76475 -->
            <p>The freebsd/riscv64 port (<code>GOOS=freebsd GOARCH=riscv64</code>) has been marked <a href="/wiki/PortingPolicy#broken-ports">broken</a>.
            See <a href="/issue/76475">issue 76475</a> for details.</p>
            <h3 id="windows">Windows</h3>
            <!-- go.dev/issue/71671 -->
            <p>As <a href="/doc/go1.25#windows">announced</a> in the Go 1.25 release notes, the
            <a href="/doc/go1.24#windows">broken</a> 32-bit windows/arm port (<code>GOOS=windows</code>
            <code>GOARCH=arm</code>) has been removed.</p>
            <h3 id="powerpc">PowerPC</h3>
            <!-- go.dev/issue/76244 -->
            <p>Go 1.26 is the last release that supports the ELFv1 ABI on the big-endian
            64-bit PowerPC port on Linux (<code>GOOS=linux</code> <code>GOARCH=ppc64</code>).
            It will switch to the ELFv2 ABI in Go 1.27.
            As the port does not currently support linking against other ELF objects,
            we expect this change to be transparent to users.</p>
            <h3 id="risc-v">RISC-V</h3>
            <!-- CL 690497 -->
            <p>The <code>linux/riscv64</code> port now supports the race detector.</p>
            <h3 id="s390x">S390X</h3>
            <!-- CL 719482 -->
            <p>The <code>s390x</code> port now supports passing function arguments and results using registers.</p>
            <h3 id="wasm">WebAssembly</h3>
            <!-- CL 707855 -->
            <p>The compiler now unconditionally makes use of the sign extension
            and non-trapping floating-point to integer conversion instructions.
            These features have been standardized since at least Wasm 2.0.
            The corresponding <code>GOWASM</code> settings, <code>signext</code> and <code>satconv</code>, are now ignored.</p>
            <!-- CL 683296 -->
            <p>For WebAssembly applications, the runtime now manages chunks of
            heap memory in much smaller increments, leading to significantly
            reduced memory usage for applications with heaps less than around
            16 MiB in size.</p>
            </div>







