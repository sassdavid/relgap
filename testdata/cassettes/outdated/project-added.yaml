            See the <a href="https://github.com/golang/go/issues?q=milestone%3AGo1.10.7+label%3ACherryPickApproved">
            Go 1.10.7 milestone</a> on our issue tracker for details.
            		
            		</p>
            	
            		<p id="go1.10.8">
            		go1.10.8
            		(released 2019-01-23)
            		
            			includes
            			
