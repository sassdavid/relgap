            {"query":"query($name:String!$owner:String!$t0:String!$t1:String!$t2:String!$t3:String!$t4:String!$t5:String!$t6:String!$t7:String!$t8:String!$t9:String!){repository(owner: $owner, name: $name){r0: release(tagName: $t0){tagName,isDraft,isPrerelease,publishedAt,url,description},r1: release(tagName: $t1){tagName,isDraft,isPrerelease,publishedAt,url,description},r2: release(tagName: $t2){tagName,isDraft,isPrerelease,publishedAt,url,description},r3: release(tagName: $t3){tagName,isDraft,isPrerelease,publishedAt,url,description},r4: release(tagName: $t4){tagName,isDraft,isPrerelease,publishedAt,url,description},r5: release(tagName: $t5){tagName,isDraft,isPrerelease,publishedAt,url,description},r6: release(tagName: $t6){tagName,isDraft,isPrerelease,publishedAt,url,description},r7: release(tagName: $t7){tagName,isDraft,isPrerelease,publishedAt,url,description},r8: release(tagName: $t8){tagName,isDraft,isPrerelease,publishedAt,url,description},r9: release(tagName: $t9){tagName,isDraft,isPrerelease,publishedAt,url,description}}}","variables":{"name":"terraform","owner":"hashicorp","t0":"v1.15.9","t1":"v1.16.0","t2":"v1.16.1","t3":"v1.16.2","t4":"v1.16.3","t5":"v1.16.4","t6":"v1.16.5","t7":"v1.16.6","t8":"v1.16.7","t9":"v1.17.0"}}
