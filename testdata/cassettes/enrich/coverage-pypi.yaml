        content_length: 2754
        body: '{"id":"GHSA-q2x7-8rv6-6q7h","summary":"Jinja has a sandbox breakout through indirect reference to format method","details":"An oversight in how the Jinja sandboxed environment detects calls to `str.format` allows an attacker that controls the content of a template to execute arbitrary Python code.\n\nTo exploit the vulnerability, an attacker needs to control the content of a template. Whether that is the case depends on the type of application using Jinja. This vulnerability impacts users of applications which execute untrusted templates.\n\nJinja''s sandbox does catch calls to `str.format` and ensures they don''t escape the sandbox. However, it''s possible to store a reference to a malicious string''s `format` method, then pass that to a filter that calls it. No such filters are built-in to Jinja, but could be present through custom filters in an application. After the fix, such indirect calls are also handled by the sandbox.","aliases":["CVE-2024-56326","PYSEC-2026-1475"],"modified":"2026-09-10T03:50:21.662855250Z","published":"2024-12-23T17:56:08Z","database_specific":{"cwe_ids":["CWE-693"],"severity":"MODERATE","github_reviewed":true,"github_reviewed_at":"2024-12-23T17:56:08Z","nvd_published_at":"2024-12-23T16:15:07Z"},"references":[{"type":"WEB","url":"https://github.com/pallets/jinja/security/advisories/GHSA-q2x7-8rv6-6q7h"},{"type":"ADVISORY","url":"https://nvd.nist.gov/vuln/detail/CVE-2024-56326"},{"type":"WEB","url":"https://github.com/pallets/jinja/commit/48b0687e05a5466a91cd5812d604fa37ad0943b4"},{"type":"PACKAGE","url":"https://github.com/pallets/jinja"},{"type":"WEB","url":"https://github.com/pallets/jinja/releases/tag/3.1.5"},{"type":"WEB","url":"https://lists.debian.org/debian-lts-announce/2025/04/msg00022.html"}],"affected":[{"package":{"name":"jinja2","ecosystem":"PyPI","purl":"pkg:pypi/jinja2"},"ranges":[{"type":"ECOSYSTEM","events":[{"introduced":"0"},{"fixed":"3.1.5"}]}],"versions":["2.0","2.0rc1","2.1","2.1.1","2.10","2.10.1","2.1