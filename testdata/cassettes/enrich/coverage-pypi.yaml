        content_length: 2874
        body: '{"id":"GHSA-cpwx-vrp4-4pq7","summary":"Jinja2 vulnerable to sandbox breakout through attr filter selecting format method","details":"An oversight in how the Jinja sandboxed environment interacts with the `|attr` filter allows an attacker that controls the content of a template to execute arbitrary Python code.\n\nTo exploit the vulnerability, an attacker needs to control the content of a template. Whether that is the case depends on the type of application using Jinja. This vulnerability impacts users of applications which execute untrusted templates.\n\nJinja''s sandbox does catch calls to `str.format` and ensures they don''t escape the sandbox. However, it''s possible to use the `|attr` filter to get a reference to a string''s plain format method, bypassing the sandbox. After the fix, the `|attr` filter no longer bypasses the environment''s attribute lookup.","aliases":["CVE-2025-27516","PYSEC-2026-1471"],"modified":"2026-11-18T00:45:13.756181700Z","published":"2025-03-05T20:40:14Z","database_specific":{"github_reviewed_at":"2025-03-05T20:40:14Z","nvd_published_at":"2025-03-05T21:15:20Z","cwe_ids":["CWE-1336"],"severity":"MODERATE","github_reviewed":true},"references":[{"type":"WEB","url":"https://github.com/pallets/jinja/security/advisories/GHSA-cpwx-vrp4-4pq7"},{"type":"ADVISORY","url":"https://nvd.nist.gov/vuln/detail/CVE-2025-27516"},{"type":"WEB","url":"https://github.com/pallets/jinja/commit/90457bbf33b8662926ae65cdde4c4c32e756e403"},{"type":"PACKAGE","url":"https://github.com/pallets/jinja"},{"type":"WEB","url":"https://github.com/pallets/jinja/releases/tag/3.1.6"},{"type":"WEB","url":"https://github.com/pypa/advisory-database/tree/main/vulns/jinja2/PYSEC-2026-1471.yaml"},{"type":"WEB","url":"https://lists.debian.org/debian-lts-announce/2025/04/msg00022.html"},{"type":"WEB","url":"https://lists.debian.org/debian-lts-announce/2025/04/msg00045.html"},{"type":"WEB","url":"https://pypi.org/project/jinja2"}],"affected":[{"package":{"name":"jinja2"