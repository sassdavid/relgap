        content_length: 2184
        body: '{"id":"GHSA-5xjx-9qx6-jcrv","summary":"Claude Code: TOCTOU Race in Edit Tool Allows File Writes Outside the Workspace","details":"Claude Code validated Edit tool targets using point-in-time pathname and symlink resolution that was not bound to the underlying directory inodes or file descriptors. On macOS, a process running inside Claude Code''s Bash sandbox could exploit the resulting time-of-check to time-of-use window by atomically swapping an in-workspace parent directory with a symlink after validation completed, causing the unsandboxed Edit implementation to overwrite an attacker-selected user-writable file outside the workspace. Exploiting this required the ability to run attacker-controlled code inside the sandbox, such as through a malicious repository or dependency script.\n\nUsers on standard Claude Code auto-update have received this fix automatically. Users performing manual updates are advised to update to the latest version.\n\nClaude Code thanks hackerone.com/mahoraga007 (Sunder Singh) for reporting this issue.","aliases":["CVE-2026-88968"],"modified":"2026-11-09T23:00:03.851745985Z","published":"2026-11-09T22:42:03Z","database_specific":{"nvd_published_at":"2026-11-03T20:18:19Z","cwe_ids":["CWE-367","CWE-59"],"severity":"HIGH","github_reviewed":true,"github_reviewed_at":"2026-11-09T22:42:03Z"},"references":[{"type":"WEB","url":"https://github.com/anthropics/claude-code/security/advisories/GHSA-5xjx-9qx6-jcrv"},{"type":"ADVISORY","url":"https://nvd.nist.gov/vuln/detail/CVE-2026-88968"},{"type":"PACKAGE","url":"https://github.com/anthropics/claude-code"},{"type":"WEB","url":"https://github.com/anthropics/claude-code/releases/tag/v2.1.251"}],"affected":[{"package":{"name":"@anthropic-ai/claude-code","ecosystem":"npm","purl":"pkg:npm/%40anthropic-ai/claude-code"},"ranges":[{"type":"SEMVER","events":[{"introduced":"0"},{"fixed":"2.1.251"}]}],"database_specific":{"source":"https://github.com/github/advisory-database/blob/main/advisories/gith