        body: '{"id":"GHSA-qxfv-fcpc-w36x","summary":"Claude Code rg vulnerability does not protect against approval prompt bypass","details":"Due to an error in command parsing, it was possible to bypass the Claude Code confirmation prompt to trigger execution of an untrusted command. Reliably exploiting this requires the ability to add untrusted content into a Claude Code context window.\n\nUsers on standard Claude Code auto-update will have received this fix automatically. Users performing manual updates are advised to update to the latest version.\n\nThank you to the NVIDIA AI Red Team for reporting this issue!","aliases":["CVE-2025-58764"],"modified":"2025-09-10T21:14:12Z","published":"2025-09-10T17:10:42Z","database_specific":{"nvd_published_at":"2025-09-10T16:15:40Z","cwe_ids":["CWE-94"],"severity":"HIGH","github_reviewed":true,"github_reviewed_at":"2025-09-10T17:10:42Z"},"references":[{"type":"WEB","url":"https://github.com/anthropics/claude-code/security/advisories/GHSA-qxfv-fcpc-w36x"},{"type":"ADVISORY","url":"https://nvd.nist.gov/vuln/detail/CVE-2025-58764"},{"type":"PACKAGE","url":"https://github.com/anthropics/claude-code"}],"affected":[{"package":{"name":"@anthropic-ai/claude-code","ecosystem":"npm","purl":"pkg:npm/%40anthropic-ai/claude-code"},"ranges":[{"type":"SEMVER","events":[{"introduced":"0"},{"fixed":"1.0.105"}]}],"database_specific":{"source":"https://github.com/github/advisory-database/blob/main/advisories/github-reviewed/2025/09/GHSA-qxfv-fcpc-w36x/GHSA-qxfv-fcpc-w36x.json"}}],"schema_version":"1.9.0","severity":[{"type":"CVSS_V4","score":"CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:P/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N"}]}'
