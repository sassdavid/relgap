        content_length: 1755
        body: '{"id":"GHSA-q728-gf8j-w49r","summary":"Claude Code has a Path Restriction Bypass via ZSH Clobber which Allows Arbitrary File Writes","details":"Due to a Bash command validation flaw in parsing ZSH clobber syntax, it was possible to bypass directory restrictions and write files outside the current working directory without user permission prompts. Exploiting this required the user to use ZSH and the ability to add untrusted content into a Claude Code context window. \n\nUsers on standard Claude Code auto-update have received this fix already. Users performing manual updates are advised to update to the latest version.\n\nClaude Code thanks https://hackerone.com/alexbernier for reporting this issue!","aliases":["CVE-2026-24053"],"modified":"2026-02-04T22:42:25.762Z","published":"2026-02-03T19:32:01Z","database_specific":{"nvd_published_at":"2026-02-03T21:16:13Z","cwe_ids":["CWE-22","CWE-78"],"severity":"HIGH","github_reviewed":true,"github_reviewed_at":"2026-02-03T19:32:01Z"},"references":[{"type":"WEB","url":"https://github.com/anthropics/claude-code/security/advisories/GHSA-q728-gf8j-w49r"},{"type":"ADVISORY","url":"https://nvd.nist.gov/vuln/detail/CVE-2026-24053"},{"type":"PACKAGE","url":"https://github.com/anthropics/claude-code"}],"affected":[{"package":{"name":"@anthropic-ai/claude-code","ecosystem":"npm","purl":"pkg:npm/%40anthropic-ai/claude-code"},"ranges":[{"type":"SEMVER","events":[{"introduced":"0"},{"fixed":"2.0.74"}]}],"database_specific":{"source":"https://github.com/github/advisory-database/blob/main/advisories/github-reviewed/2026/02/GHSA-q728-gf8j-w49r/GHSA-q728-gf8j-w49r.json"}}],"schema_version":"1.9.0","severity":[{"type":"CVSS_V4","score":"CVSS:4.0/AV:N/AC:L/AT:P/PR:N/UI:P/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N"}]}'
