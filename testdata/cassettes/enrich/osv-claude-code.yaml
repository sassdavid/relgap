        content_length: 1736
        body: '{"id":"GHSA-xq4m-mc3c-vvg3","summary":"Claude Code Command Validation Bypass Allows Arbitrary Code Execution","details":"Due to errors in parsing shell commands related to $IFS and short CLI flags, it was possible to bypass the Claude Code read-only validation and trigger arbitrary code execution. Reliably exploiting this requires the ability to add untrusted content into a Claude Code context window.\n\nUsers on standard Claude Code auto-update have received this fix already. Users performing manual updates are advised to update to the latest version.\n\nThank you to [RyotaK](hxxps://ryotak.net) from [GMO Flatt Security Inc.](hxxps://flatt.tech/en/) for reporting this issue!","aliases":["CVE-2025-66032"],"modified":"2025-12-05T12:27:53.035426Z","published":"2025-12-03T16:27:19Z","database_specific":{"cwe_ids":["CWE-20","CWE-77"],"severity":"HIGH","github_reviewed":true,"github_reviewed_at":"2025-12-03T16:27:19Z","nvd_published_at":"2025-12-03T19:15:57Z"},"references":[{"type":"WEB","url":"https://github.com/anthropics/claude-code/security/advisories/GHSA-xq4m-mc3c-vvg3"},{"type":"ADVISORY","url":"https://nvd.nist.gov/vuln/detail/CVE-2025-66032"},{"type":"PACKAGE","url":"https://github.com/anthropics/claude-code"}],"affected":[{"package":{"name":"@anthropic-ai/claude-code","ecosystem":"npm","purl":"pkg:npm/%40anthropic-ai/claude-code"},"ranges":[{"type":"SEMVER","events":[{"introduced":"0"},{"fixed":"1.0.93"}]}],"database_specific":{"source":"https://github.com/github/advisory-database/blob/main/advisories/github-reviewed/2025/12/GHSA-xq4m-mc3c-vvg3/GHSA-xq4m-mc3c-vvg3.json"}}],"schema_version":"1.9.0","severity":[{"type":"CVSS_V4","score":"CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:P/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N"}]}'
