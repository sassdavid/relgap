        body: '{"id":"GHSA-4fgq-fpq9-mr3g","summary":"Claude Code can execute commands prior to the startup trust dialog ","details":"Due to a bug in the startup trust dialog implementation, Claude Code could be tricked to execute code contained in a project before the user accepted the startup trust dialog. Exploiting this requires a user to start Claude Code in an untrusted directory. \n\nUsers on standard Claude Code auto-update will have received this fix automatically. Users performing manual updates are advised to update to the latest version.\n\nThank you to https://hackerone.com/avivdon for reporting this issue!","aliases":["CVE-2025-59536"],"modified":"2025-10-03T14:57:25.457969Z","published":"2025-10-03T14:16:34Z","database_specific":{"github_reviewed":true,"github_reviewed_at":"2025-10-03T14:16:34Z","nvd_published_at":"2025-10-03T07:15:44Z","cwe_ids":["CWE-94"],"severity":"HIGH"},"references":[{"type":"WEB","url":"https://github.com/anthropics/claude-code/security/advisories/GHSA-4fgq-fpq9-mr3g"},{"type":"ADVISORY","url":"https://nvd.nist.gov/vuln/detail/CVE-2025-59536"},{"type":"PACKAGE","url":"https://github.com/anthropics/claude-code"}],"affected":[{"package":{"name":"@anthropic-ai/claude-code","ecosystem":"npm","purl":"pkg:npm/%40anthropic-ai/claude-code"},"ranges":[{"type":"SEMVER","events":[{"introduced":"0"},{"fixed":"1.0.111"}]}],"database_specific":{"source":"https://github.com/github/advisory-database/blob/main/advisories/github-reviewed/2025/10/GHSA-4fgq-fpq9-mr3g/GHSA-4fgq-fpq9-mr3g.json"}}],"schema_version":"1.9.0","severity":[{"type":"CVSS_V4","score":"CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:P/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N"}]}'
