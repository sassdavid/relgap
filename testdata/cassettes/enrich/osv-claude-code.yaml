        proto_major: 2
        proto_minor: 0
        content_length: 1918
        body: '{"id":"GHSA-4q92-rfm6-2cqx","summary":"Claude Code has Permission Deny Bypass Through Symbolic Links","details":"Claude Code failed to strictly enforce deny rules configured in settings.json when accessing files through symbolic links. If a user explicitly denied Claude Code access to a file (such as /etc/passwd) and Claude Code had access to a symbolic link pointing to that file, it was possible for Claude Code to read the restricted file through the symlink without triggering deny rule enforcement. \n\nUsers on standard Claude Code auto-update received this fix automatically. Users performing manual updates are advised to update to the latest version.\n\nClaude Code thanks https://hackerone.com/ofirh for reporting this issue.","aliases":["CVE-2026-25724"],"modified":"2026-04-12T05:17:45.956376Z","published":"2026-02-06T19:08:04Z","database_specific":{"severity":"LOW","github_reviewed":true,"github_reviewed_at":"2026-02-06T19:08:04Z","nvd_published_at":"2026-02-06T18:16:00Z","cwe_ids":["CWE-285","CWE-61"]},"references":[{"type":"WEB","url":"https://github.com/anthropics/claude-code/security/advisories/GHSA-4q92-rfm6-2cqx"},{"type":"ADVISORY","url":"https://nvd.nist.gov/vuln/detail/CVE-2026-25724"},{"type":"PACKAGE","url":"https://github.com/anthropics/claude-code"},{"type":"WEB","url":"https://www.terra.security/blog/when-ai-becomes-the-attack-surface-lessons-from-discovering-cve-2026-25724"}],"affected":[{"package":{"name":"@anthropic-ai/claude-code","ecosystem":"npm","purl":"pkg:npm/%40anthropic-ai/claude-code"},"ranges":[{"type":"SEMVER","events":[{"introduced":"0"},{"fixed":"2.1.7"}]}],"database_specific":{"source":"https://github.com/github/advisory-database/blob/main/advisories/github-reviewed/2026/02/GHSA-4q92-rfm6-2cqx/GHSA-4q92-rfm6-2cqx.json"}}],"schema_version":"1.9.0","severity":[{"type":"CVSS_V4","score":"CVSS:4.0/AV:N/AC:L/AT:P/PR:N/UI:P/VC:L/VI:L/VA:L/SC:N/SI:N/SA:N"}]}'
