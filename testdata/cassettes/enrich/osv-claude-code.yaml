        proto_major: 2
        proto_minor: 0
        content_length: 1825
        body: '{"id":"GHSA-66q4-vfjg-2qhh","summary":"Claude Code Vulnerable to Command Injection via Directory Change Bypasses Write Protection","details":"Claude Code failed to properly validate directory changes when combined with write operations to protected folders. By using the `cd` command to navigate into sensitive directories like `.claude`, it was possible to bypass write protection and create or modify files without user confirmation. Reliably exploiting this required the ability to add untrusted content into a Claude Code context window. \n\nUsers on standard Claude Code auto-update received this fix automatically. Users performing manual updates are advised to update to the latest version.\n\nAbout\nClaude Code thanks hackerone.com/nil221 for reporting this issue!","aliases":["CVE-2026-25722"],"modified":"2026-02-06T19:56:44.198671Z","published":"2026-02-06T19:02:41Z","database_specific":{"github_reviewed":true,"github_reviewed_at":"2026-02-06T19:02:41Z","nvd_published_at":"2026-02-06T18:15:59Z","cwe_ids":["CWE-20","CWE-78"],"severity":"HIGH"},"references":[{"type":"WEB","url":"https://github.com/anthropics/claude-code/security/advisories/GHSA-66q4-vfjg-2qhh"},{"type":"ADVISORY","url":"https://nvd.nist.gov/vuln/detail/CVE-2026-25722"},{"type":"PACKAGE","url":"https://github.com/anthropics/claude-code"}],"affected":[{"package":{"name":"@anthropic-ai/claude-code","ecosystem":"npm","purl":"pkg:npm/%40anthropic-ai/claude-code"},"ranges":[{"type":"SEMVER","events":[{"introduced":"0"},{"fixed":"2.0.57"}]}],"database_specific":{"source":"https://github.com/github/advisory-database/blob/main/advisories/github-reviewed/2026/02/GHSA-66q4-vfjg-2qhh/GHSA-66q4-vfjg-2qhh.json"}}],"schema_version":"1.9.0","severity":[{"type":"CVSS_V4","score":"CVSS:4.0/AV:N/AC:L/AT:P/PR:N/UI:P/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N"}]}'
