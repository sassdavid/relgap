        content_length: 1982
        body: '{"id":"GHSA-2jjv-qf24-vfm4","summary":"Claude Code Vulnerable to Arbitrary Code Execution via Plugin Autoloading with Specific Yarn Versions","details":"When using Claude Code with Yarn installed, Yarn config files can trigger code execution when running `yarn --version`. This could lead to a bypass of the directory trust dialog in Claude Code, as plugins and `yarnPath` could be executed prior to the user accepting the risks of working in an untrusted directory. Users on standard Claude Code auto-update will have received this fix automatically. Users performing manual updates are advised to update to the latest version.\n\nThank you to Benjamin Faller, Redguard AG and Michael Hess for reporting this issue!","aliases":["CVE-2025-59828"],"modified":"2025-12-22T16:44:46.745927Z","published":"2025-09-24T18:57:44Z","database_specific":{"cwe_ids":["CWE-829","CWE-862"],"severity":"HIGH","github_reviewed":true,"github_reviewed_at":"2025-09-24T18:57:44Z","nvd_published_at":"2025-09-24T20:15:33Z"},"references":[{"type":"WEB","url":"https://github.com/anthropics/claude-code/security/advisories/GHSA-2jjv-qf24-vfm4"},{"type":"ADVISORY","url":"https://nvd.nist.gov/vuln/detail/CVE-2025-59828"},{"type":"PACKAGE","url":"https://github.com/anthropics/claude-code"},{"type":"WEB","url":"https://osv.dev/vulnerability/GHSA-2jjv-qf24-vfm4"},{"type":"WEB","url":"https://www.cve.org/CVERecord?id=CVE-2025-59828"},{"type":"WEB","url":"https://yarnpkg.com/advanced/plugin-tutorial"}],"affected":[{"package":{"name":"@anthropic-ai/claude-code","ecosystem":"npm","purl":"pkg:npm/%40anthropic-ai/claude-code"},"ranges":[{"type":"SEMVER","events":[{"introduced":"0"},{"fixed":"1.0.39"}]}],"database_specific":{"source":"https://github.com/github/advisory-database/blob/main/advisories/github-reviewed/2025/09/GHSA-2jjv-qf24-vfm4/GHSA-2jjv-qf24-vfm4.json"}}],"schema_version":"1.9.0","severity":[{"type":"CVSS_V4","score":"CVSS:4.0/AV:N/AC:L/AT:P/PR:N/UI:P/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N"}]}'
