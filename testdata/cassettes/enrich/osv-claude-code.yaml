        proto_major: 2
        proto_minor: 0
        content_length: 2166
        body: '{"id":"GHSA-pq7j-f95f-qfcv","summary":"Claude Code: Plugin Hash Pin Bypass Allows Bypass of Hash Pinning","details":"The plugin install flow in Claude Code and Claude Desktop checked out a marketplace''s pinned commit SHA using `git checkout` without verifying that the resulting HEAD matched the pinned SHA. An attacker controlling a plugin''s upstream repository could create a branch named identically to the pinned 40-character SHA, causing the checkout to silently resolve to the attacker''s branch tip instead of the reviewed commit, resulting in attacker-controlled code being installed bypassing the pinned hash. Exploitation required a user to install a malicious plugin, pin to a safe hash, and for the plugin source to be hosted on a git host that permitted SHA-shaped branch names.\n\nUsers on standard Claude Code auto-update have received this fix already. Users performing manual updates are advised to update to the latest version.\n\nThank you to Or Nevo Michrowski of Air Security for reporting this issue.","aliases":["CVE-2026-86063"],"modified":"2026-10-15T20:30:08.558907946Z","published":"2026-10-15T20:22:07Z","database_specific":{"nvd_published_at":"2026-10-13T19:21:21Z","cwe_ids":["CWE-494","CWE-829"],"severity":"HIGH","github_reviewed":true,"github_reviewed_at":"2026-10-15T20:22:07Z"},"references":[{"type":"WEB","url":"https://github.com/anthropics/claude-code/security/advisories/GHSA-pq7j-f95f-qfcv"},{"type":"ADVISORY","url":"https://nvd.nist.gov/vuln/detail/CVE-2026-86063"},{"type":"PACKAGE","url":"https://github.com/anthropics/claude-code"},{"type":"WEB","url":"https://github.com/anthropics/claude-code/releases/tag/v2.1.179"}],"affected":[{"package":{"name":"@anthropic-ai/claude-code","ecosystem":"npm","purl":"pkg:npm/%40anthropic-ai/claude-code"},"ranges":[{"type":"SEMVER","events":[{"introduced":"0"},{"fixed":"2.1.179"}]}],"database_specific":{"source":"https://github.com/github/advisory-database/blob/main/advisories/github-reviewed/2026