        body: '{"id":"GHSA-7mv8-j34q-vp7q","summary":"@anthropic-ai/claude-code has Sed Command Validation Bypass that Allows Arbitrary File Writes","details":"Due to an error in sed command parsing, it was possible to bypass the Claude Code read-only validation and write to arbitrary files on the host system. \n\nUsers on standard Claude Code auto-update will have received this fix automatically. Users performing manual updates are advised to update to the latest version.\n\nThank you to Adam Chester - SpecterOps for reporting this issue!","aliases":["CVE-2025-64755"],"modified":"2025-11-21T15:32:13Z","published":"2025-11-20T21:28:08Z","database_specific":{"severity":"HIGH","github_reviewed":true,"github_reviewed_at":"2025-11-20T21:28:08Z","nvd_published_at":"2025-11-21T02:15:43Z","cwe_ids":["CWE-78"]},"references":[{"type":"WEB","url":"https://github.com/anthropics/claude-code/security/advisories/GHSA-7mv8-j34q-vp7q"},{"type":"ADVISORY","url":"https://nvd.nist.gov/vuln/detail/CVE-2025-64755"},{"type":"PACKAGE","url":"https://github.com/anthropics/claude-code"}],"affected":[{"package":{"name":"@anthropic-ai/claude-code","ecosystem":"npm","purl":"pkg:npm/%40anthropic-ai/claude-code"},"ranges":[{"type":"SEMVER","events":[{"introduced":"0"},{"fixed":"2.0.31"}]}],"database_specific":{"source":"https://github.com/github/advisory-database/blob/main/advisories/github-reviewed/2025/11/GHSA-7mv8-j34q-vp7q/GHSA-7mv8-j34q-vp7q.json"}}],"schema_version":"1.9.0","severity":[{"type":"CVSS_V4","score":"CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:P/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N"}]}'
