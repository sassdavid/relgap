        content_length: 1820
        body: '{"id":"GHSA-mhg7-666j-cqg4","summary":"Claude Code Vulnerable to Command Injection via Piped sed Command Bypasses File Write Restrictions","details":"Claude Code failed to properly validate commands using piped sed operations with the echo command, allowing attackers to bypass file write restrictions. This vulnerability enabled writing to sensitive directories like the .claude folder and paths outside the project scope. Exploiting this required the ability to execute commands through Claude Code with the \"accept edits\" feature enabled. \n\nUsers on standard Claude Code auto-update received this fix automatically. Users performing manual updates are advised to update to the latest version.\n\nClaude Code thanks hackerone.com/nil221 for reporting this issue!","aliases":["CVE-2026-25723"],"modified":"2026-02-06T20:11:41.330395Z","published":"2026-02-06T19:04:51Z","database_specific":{"github_reviewed_at":"2026-02-06T19:04:51Z","nvd_published_at":"2026-02-06T18:15:59Z","cwe_ids":["CWE-20","CWE-78"],"severity":"HIGH","github_reviewed":true},"references":[{"type":"WEB","url":"https://github.com/anthropics/claude-code/security/advisories/GHSA-mhg7-666j-cqg4"},{"type":"ADVISORY","url":"https://nvd.nist.gov/vuln/detail/CVE-2026-25723"},{"type":"PACKAGE","url":"https://github.com/anthropics/claude-code"}],"affected":[{"package":{"name":"@anthropic-ai/claude-code","ecosystem":"npm","purl":"pkg:npm/%40anthropic-ai/claude-code"},"ranges":[{"type":"SEMVER","events":[{"introduced":"0"},{"fixed":"2.0.55"}]}],"database_specific":{"source":"https://github.com/github/advisory-database/blob/main/advisories/github-reviewed/2026/02/GHSA-mhg7-666j-cqg4/GHSA-mhg7-666j-cqg4.json"}}],"schema_version":"1.9.0","severity":[{"type":"CVSS_V4","score":"CVSS:4.0/AV:N/AC:L/AT:P/PR:N/UI:P/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N"}]}'
