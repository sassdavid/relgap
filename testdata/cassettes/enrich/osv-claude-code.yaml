        content_length: 1699
        body: '{"id":"GHSA-x56v-x2h6-7j34","summary":"Claude Code echo command allowed bypass of user approval prompt for command execution","details":"Due to an error in command parsing, it was possible to bypass the Claude Code confirmation prompt to trigger execution of an untrusted command. Reliably exploiting this requires the ability to add untrusted content into a Claude Code context window. \n\nUsers on standard Claude Code auto-update received this fix automatically after release. Current users of Claude Code are unaffected, as versions prior to 1.0.24 are deprecated and have been forced to update.\n\nThank you to Elad Beber (Cymulate) for reporting this issue!","aliases":["CVE-2025-54795"],"modified":"2025-08-05T17:10:38Z","published":"2025-08-04T15:18:03Z","database_specific":{"cwe_ids":["CWE-78"],"severity":"HIGH","github_reviewed":true,"github_reviewed_at":"2025-08-04T15:18:03Z","nvd_published_at":"2025-08-05T01:15:42Z"},"references":[{"type":"WEB","url":"https://github.com/anthropics/claude-code/security/advisories/GHSA-x56v-x2h6-7j34"},{"type":"ADVISORY","url":"https://nvd.nist.gov/vuln/detail/CVE-2025-54795"},{"type":"PACKAGE","url":"https://github.com/anthropics/claude-code"}],"affected":[{"package":{"name":"@anthropic-ai/claude-code","ecosystem":"npm","purl":"pkg:npm/%40anthropic-ai/claude-code"},"ranges":[{"type":"SEMVER","events":[{"introduced":"0"},{"fixed":"1.0.20"}]}],"database_specific":{"source":"https://github.com/github/advisory-database/blob/main/advisories/github-reviewed/2025/08/GHSA-x56v-x2h6-7j34/GHSA-x56v-x2h6-7j34.json"}}],"schema_version":"1.9.0","severity":[{"type":"CVSS_V4","score":"CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:P/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N"}]}'
