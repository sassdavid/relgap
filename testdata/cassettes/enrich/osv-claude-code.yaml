        content_length: 1625
        body: '{"id":"GHSA-66m2-gx93-v996","summary":"Claude Code permission deny bypass through symlink","details":"Claude Code failed to account for symlinks when checking permission deny rules. If a user explicitly denied Claude Code access to a file and Claude Code had access to a symlink pointing to that file, it was possible for Claude Code to access the file. \n\nUsers on standard Claude Code auto-update will have received this fix automatically. Users performing manual updates are advised to update to the latest version.\n\nThank you to https://hackerone.com/vinai for reporting this issue!","aliases":["CVE-2025-59829"],"modified":"2025-10-13T15:10:14Z","published":"2025-10-03T14:17:58Z","database_specific":{"nvd_published_at":"2025-10-03T20:15:33Z","cwe_ids":["CWE-61"],"severity":"LOW","github_reviewed":true,"github_reviewed_at":"2025-10-03T14:17:58Z"},"references":[{"type":"WEB","url":"https://github.com/anthropics/claude-code/security/advisories/GHSA-66m2-gx93-v996"},{"type":"ADVISORY","url":"https://nvd.nist.gov/vuln/detail/CVE-2025-59829"},{"type":"PACKAGE","url":"https://github.com/anthropics/claude-code"}],"affected":[{"package":{"name":"@anthropic-ai/claude-code","ecosystem":"npm","purl":"pkg:npm/%40anthropic-ai/claude-code"},"ranges":[{"type":"SEMVER","events":[{"introduced":"0"},{"fixed":"1.0.120"}]}],"database_specific":{"source":"https://github.com/github/advisory-database/blob/main/advisories/github-reviewed/2025/10/GHSA-66m2-gx93-v996/GHSA-66m2-gx93-v996.json"}}],"schema_version":"1.9.0","severity":[{"type":"CVSS_V4","score":"CVSS:4.0/AV:N/AC:L/AT:P/PR:N/UI:P/VC:L/VI:L/VA:N/SC:N/SI:N/SA:N"}]}'
