        proto_major: 2
        proto_minor: 0
        content_length: 2260
        body: '{"id":"GHSA-vp62-r36r-9xqp","summary":"Claude Code: Sandbox Escape via Symlink Following Allows Arbitrary File Write Outside Workspace","details":"Claude Code''s sandbox did not prevent sandboxed processes from creating symlinks pointing to locations outside the workspace. When Claude Code subsequently wrote to a path within such a symlink, its unsandboxed process followed the symlink and wrote to the target location outside the workspace without prompting the user for confirmation. This allowed a sandbox escape where neither the sandboxed command nor the unsandboxed app could independently write outside the workspace, but their combination could write to arbitrary locations, potentially leading to code execution outside the sandbox. Reliably exploiting this required the ability to add untrusted content into a Claude Code context window to trigger sandboxed code execution via prompt injection.\n\nUsers on standard Claude Code auto-update have received this fix automatically. Users performing manual updates are advised to update to the latest version.\n\nClaude Code thanks hackerone.com/philts for reporting this issue.","aliases":["CVE-2026-39861"],"modified":"2026-05-05T16:11:17.173956Z","published":"2026-04-21T18:51:21Z","database_specific":{"github_reviewed_at":"2026-04-21T18:51:21Z","nvd_published_at":"2026-04-21T01:16:06Z","cwe_ids":["CWE-22","CWE-61"],"severity":"HIGH","github_reviewed":true},"references":[{"type":"WEB","url":"https://github.com/anthropics/claude-code/security/advisories/GHSA-vp62-r36r-9xqp"},{"type":"ADVISORY","url":"https://nvd.nist.gov/vuln/detail/CVE-2026-39861"},{"type":"PACKAGE","url":"https://github.com/anthropics/claude-code"}],"affected":[{"package":{"name":"@anthropic-ai/claude-code","ecosystem":"npm","purl":"pkg:npm/%40anthropic-ai/claude-code"},"ranges":[{"type":"SEMVER","events":[{"introduced":"0"},{"fixed":"2.1.64"}]}],"database_specific":{"source":"https://github.com/github/advisory-database/blob/main/advisories/gi