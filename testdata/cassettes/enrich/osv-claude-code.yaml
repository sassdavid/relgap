        proto_major: 2
        proto_minor: 0
        content_length: 1694
        body: '{"id":"GHSA-qgqw-h4xq-7w8w","summary":"Claude Code has a Command Injection in find Command Bypasses User Approval Prompt","details":"Due to an error in command parsing, it was possible to bypass the Claude Code confirmation prompt to trigger execution of untrusted commands through the find command. Reliably exploiting this required the ability to add untrusted content into a Claude Code context window. \n\nUsers on standard Claude Code auto-update have received this fix already. Users performing manual updates are advised to update to the latest version.\n\nClaude Code thanks https://hackerone.com/alexbernier for reporting this issue!","aliases":["CVE-2026-24887"],"modified":"2026-02-03T22:34:25.261494Z","published":"2026-02-03T19:33:32Z","database_specific":{"severity":"HIGH","github_reviewed":true,"github_reviewed_at":"2026-02-03T19:33:32Z","nvd_published_at":"2026-02-03T21:16:13Z","cwe_ids":["CWE-78","CWE-94"]},"references":[{"type":"WEB","url":"https://github.com/anthropics/claude-code/security/advisories/GHSA-qgqw-h4xq-7w8w"},{"type":"ADVISORY","url":"https://nvd.nist.gov/vuln/detail/CVE-2026-24887"},{"type":"PACKAGE","url":"https://github.com/anthropics/claude-code"}],"affected":[{"package":{"name":"@anthropic-ai/claude-code","ecosystem":"npm","purl":"pkg:npm/%40anthropic-ai/claude-code"},"ranges":[{"type":"SEMVER","events":[{"introduced":"0"},{"fixed":"2.0.72"}]}],"database_specific":{"source":"https://github.com/github/advisory-database/blob/main/advisories/github-reviewed/2026/02/GHSA-qgqw-h4xq-7w8w/GHSA-qgqw-h4xq-7w8w.json"}}],"schema_version":"1.9.0","severity":[{"type":"CVSS_V4","score":"CVSS:4.0/AV:N/AC:L/AT:P/PR:N/UI:P/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N"}]}'
