        body: '{"id":"GHSA-hj2p-8wj8-pfq4","summary":"kubernetes allows nodes to bypass dynamic resource allocation authorization checks","details":"A vulnerability exists in the NodeRestriction admission controller where nodes can bypass dynamic resource allocation authorization checks. When the DynamicResourceAllocation feature gate is enabled, the controller properly validates resource claim statuses during pod status updates but fails to perform equivalent validation during pod creation. This allows a compromised node to create mirror pods that access unauthorized dynamic resources, potentially leading to privilege escalation.","aliases":["CVE-2025-4563","GO-2025-3774"],"modified":"2026-09-10T03:50:25.286875551Z","published":"2025-06-23T18:30:26Z","database_specific":{"github_reviewed_at":"2025-06-23T22:41:38Z","nvd_published_at":"2025-06-23T16:15:27Z","cwe_ids":["CWE-863"],"severity":"LOW","github_reviewed":true},"references":[{"type":"ADVISORY","url":"https://nvd.nist.gov/vuln/detail/CVE-2025-4563"},{"type":"WEB","url":"https://github.com/kubernetes/kubernetes/issues/132151"},{"type":"WEB","url":"https://github.com/kubernetes/kubernetes/pull/131844"},{"type":"WEB","url":"https://github.com/kubernetes/kubernetes/pull/131875"},{"type":"WEB","url":"https://github.com/kubernetes/kubernetes/pull/131876"},{"type":"PACKAGE","url":"https://github.com/kubernetes/kubernetes"},{"type":"WEB","url":"https://groups.google.com/g/kubernetes-security-announce/c/Zv84LMRuvMQ"},{"type":"WEB","url":"https://pkg.go.dev/vuln/GO-2025-3774"}],"affected":[{"package":{"name":"k8s.io/kubernetes","ecosystem":"Go","purl":"pkg:golang/k8s.io/kubernetes"},"ranges":[{"type":"SEMVER","events":[{"introduced":"1.32.0"},{"fixed":"1.32.6"}]}],"database_specific":{"last_known_affected_version_range":"\u003c= 1.32.5","source":"https://github.com/github/advisory-database/blob/main/advisories/github-reviewed/2025/06/GHSA-hj2p-8wj8-pfq4/GHSA-hj2p-8wj8-pfq4.json"}},{"package":{"name":"k8s.io/kubernetes",