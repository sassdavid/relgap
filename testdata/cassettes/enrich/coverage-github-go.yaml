        body: '{"id":"CVE-2026-45803","summary":"gh: GitHub Actions log output in `gh run view` allows terminal escape sequence injection","details":"`gh` is GitHub’s official command line tool. From 1.6.0 to before 2.92.0, a security vulnerability has been identified in GitHub CLI that could allow terminal escape sequence injection when users view GitHub Actions workflow logs using gh run view --log or gh run view --log-failed. The vulnerability stems from the way GitHub CLI handles raw Actions log output. The gh run view --log and gh run view --log-failed commands stream workflow log lines to stdout or the configured pager without sanitizing terminal control sequences. An attacker who can influence GitHub Actions log content, for example via a PR triggered workflow, can embed escape sequences that are replayed in the user''s terminal when they inspect the run. Depending on the victim''s terminal emulator, injected sequences could change the window title, manipulate on screen content, or in some terminal emulators (such as screen) potentially execute arbitrary commands. This vulnerability is fixed in 2.92.0.","aliases":["GHSA-crc3-h8v6-qh57","GO-2026-5335"],"modified":"2026-11-13T02:30:28.903783754Z","published":"2026-05-15T15:26:56.675Z","related":["openSUSE-SU-2026:21483-1"],"database_specific":{"cna_assigner":"GitHub_M","cwe_ids":["CWE-150"],"osv_generated_from":"https://github.com/CVEProject/cvelistV5/tree/main/cves/2026/45xxx/CVE-2026-45803.json"},"references":[{"type":"ADVISORY","url":"https://github.com/CVEProject/cvelistV5/tree/main/cves/2026/45xxx/CVE-2026-45803.json"},{"type":"ADVISORY","url":"https://github.com/cli/cli/security/advisories/GHSA-crc3-h8v6-qh57"},{"type":"ADVISORY","url":"https://nvd.nist.gov/vuln/detail/CVE-2026-45803"}],"affected":[{"ranges":[{"type":"GIT","repo":"https://github.com/cli/cli","events":[{"introduced":"2f563babbf07dda4f9dc80114753f86753487873"},{"fixed":"6c470f60803784e1558b626022677c53dccb6016"}],"database_specific":{"extra