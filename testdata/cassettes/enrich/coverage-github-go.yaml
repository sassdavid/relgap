        content_length: 3718
        body: '{"id":"CVE-2024-54132","summary":"GitHub CLI allows downloading malicious GitHub Actions workflow artifact to result in path traversal vulnerability","details":"The GitHub CLI is GitHub’s official command line tool. A security vulnerability has been identified in GitHub CLI that could create or overwrite files in unintended directories when users download a malicious GitHub Actions workflow artifact through gh run download. This vulnerability stems from a GitHub Actions workflow artifact named .. when downloaded using gh run download. The artifact name and --dir flag are used to determine the artifact’s download path. When the artifact is named .., the resulting files within the artifact are extracted exactly 1 directory higher than the specified --dir flag value. This vulnerability is fixed in 2.63.1.","aliases":["GHSA-2m9h-r57g-45pj","GO-2024-3310"],"modified":"2026-10-28T02:31:10.242883583Z","published":"2024-12-04T15:29:07.426Z","related":["openSUSE-SU-2024:14567-1"],"database_specific":{"osv_generated_from":"https://github.com/CVEProject/cvelistV5/tree/main/cves/2024/54xxx/CVE-2024-54132.json","cna_assigner":"GitHub_M","cwe_ids":["CWE-22"]},"references":[{"type":"ADVISORY","url":"https://github.com/CVEProject/cvelistV5/tree/main/cves/2024/54xxx/CVE-2024-54132.json"},{"type":"ADVISORY","url":"https://github.com/cli/cli/security/advisories/GHSA-2m9h-r57g-45pj"},{"type":"ADVISORY","url":"https://nvd.nist.gov/vuln/detail/CVE-2024-54132"},{"type":"FIX","url":"https://github.com/cli/cli/commit/1136764c369aaf0cae4ec2ee09dc35d871076932"}],"affected":[{"ranges":[{"type":"GIT","repo":"https://github.com/cli/cli","events":[{"introduced":"0"},{"fixed":"1136764c369aaf0cae4ec2ee09dc35d871076932"}],"database_specific":{"extracted_events":[{"source":"AFFECTED_FIELD","strategy":"StringRangeExpression","range":[{"introduced":"0"},{"fixed":"2.63.1"}]},{"range":[{"fixed":"1136764c369aaf0cae4ec2ee09dc35d871076932"}],"source":"REFERENCES_COMMIT"},{"range":[{"introduce