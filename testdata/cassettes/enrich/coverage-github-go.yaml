        body: '{"id":"CVE-2026-64653","summary":"GitHub CLI: Unescaped variable components in request URLs could allow path traversal","details":"GitHub CLI (gh) is GitHub’s official command line tool. Prior to 2.97.0, some HTTP request URLs interpolate variable path components without percent encoding, allowing URL path metacharacters in attacker-controlled repository or resource values to make gh address a different API endpoint or resource than the user intended. This issue is fixed in version 2.97.0.","aliases":["GHSA-4fjg-2h4q-fwg3","GO-2026-6765"],"modified":"2026-11-18T17:27:26.327083043Z","published":"2026-08-06T17:51:54.344Z","related":["SUSE-SU-2026:24730-1","openSUSE-SU-2026:11530-1","openSUSE-SU-2026:21663-1","openSUSE-SU-2026:22336-1"],"database_specific":{"cwe_ids":["CWE-22"],"osv_generated_from":"https://github.com/CVEProject/cvelistV5/tree/main/cves/2026/64xxx/CVE-2026-64653.json","cna_assigner":"GitHub_M"},"references":[{"type":"WEB","url":"https://github.com/cli/cli/releases/tag/v2.97.0"},{"type":"ADVISORY","url":"https://github.com/CVEProject/cvelistV5/tree/main/cves/2026/64xxx/CVE-2026-64653.json"},{"type":"ADVISORY","url":"https://github.com/cli/cli/security/advisories/GHSA-4fjg-2h4q-fwg3"},{"type":"ADVISORY","url":"https://nvd.nist.gov/vuln/detail/CVE-2026-64653"},{"type":"FIX","url":"https://github.com/cli/cli/commit/0c2eea6338a2323cfff000160b9b5a56a38d2a06"}],"affected":[{"ranges":[{"type":"GIT","repo":"https://github.com/cli/cli","events":[{"introduced":"0"},{"fixed":"55dbb4dc6b7edb10b48e3d7fc5bccd32318d1b55"},{"fixed":"0c2eea6338a2323cfff000160b9b5a56a38d2a06"}],"database_specific":{"extracted_events":[{"range":[{"introduced":"0"},{"fixed":"2.97.0"}],"source":"AFFECTED_FIELD","strategy":"StringRangeExpression"},{"range":[{"fixed":"0c2eea6338a2323cfff000160b9b5a56a38d2a06"}],"source":"REFERENCES_COMMIT"},{"original_tag":"v2.97.0","range":[{"fixed":"55dbb4dc6b7edb10b48e3d7fc5bccd32318d1b55"}],"source":"REFERENCES_TAG"}]}}],"versions":["v2.96.