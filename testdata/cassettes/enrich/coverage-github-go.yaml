        content_length: 3589
        body: '{"id":"CVE-2026-59831","summary":"GitHub CLI `gh codespace jupyter` could allow remote code execution when connecting to a malicious Codespace","details":"GitHub CLI (gh) is GitHub’s official command line tool. From 2.10.0 through 2.95.0, connecting to a malicious Codespace with gh codespace jupyter can allow command execution because the command opens a JupyterLab URL supplied by a process inside the Codespace without validating that it is a loopback HTTP or HTTPS address, allowing a crafted vscode:// or vscode-insiders:// URL to be handed to VS Code. This issue is fixed in version 2.96.0.","aliases":["GHSA-8cg3-r6g9-fpg2"],"modified":"2026-10-28T02:30:46.442664953Z","published":"2026-07-09T22:11:05.418Z","related":["openSUSE-SU-2026:12163-1","openSUSE-SU-2026:22134-1"],"database_specific":{"osv_generated_from":"https://github.com/CVEProject/cvelistV5/tree/main/cves/2026/59xxx/CVE-2026-59831.json","cna_assigner":"GitHub_M","cwe_ids":["CWE-829"]},"references":[{"type":"WEB","url":"https://github.com/cli/cli/releases/tag/v2.96.0"},{"type":"ADVISORY","url":"https://github.com/CVEProject/cvelistV5/tree/main/cves/2026/59xxx/CVE-2026-59831.json"},{"type":"ADVISORY","url":"https://github.com/cli/cli/security/advisories/GHSA-8cg3-r6g9-fpg2"},{"type":"ADVISORY","url":"https://nvd.nist.gov/vuln/detail/CVE-2026-59831"},{"type":"FIX","url":"https://github.com/cli/cli/commit/b300f2ec7ec9dc9addc39b2ad88c54097ded7ca0"}],"affected":[{"ranges":[{"type":"GIT","repo":"https://github.com/cli/cli","events":[{"introduced":"06153770a921a2df2b9dba6735f6ae7f7f6a1160"},{"fixed":"b300f2ec7ec9dc9addc39b2ad88c54097ded7ca0"}],"database_specific":{"extracted_events":[{"strategy":"StringRangeExpression","range":[{"introduced":"2.10.0"},{"fixed":"2.96.0"}],"source":"AFFECTED_FIELD"},{"source":"REFERENCES_COMMIT","range":[{"fixed":"b300f2ec7ec9dc9addc39b2ad88c54097ded7ca0"}]},{"original_tag":"v2.96.0","range":[{"fixed":"b300f2ec7ec9dc9addc39b2ad88c54097ded7ca0"}],"source":"REFERENCES