        content_length: 4351
        body: '{"id":"CVE-2024-53858","summary":"Recursive repository cloning can leak authentication tokens to non-GitHub submodule hosts in the gh cli","details":"The gh cli is GitHub’s official command line tool. A security vulnerability has been identified in the GitHub CLI that could leak authentication tokens when cloning repositories containing `git` submodules hosted outside of GitHub.com and ghe.com. This vulnerability stems from several `gh` commands used to clone a repository with submodules from a non-GitHub host including `gh repo clone`, `gh repo fork`, and `gh pr checkout`. These GitHub CLI commands invoke git with instructions to retrieve authentication tokens using the `credential.helper` configuration variable for any host encountered. Prior to version `2.63.0`, hosts other than GitHub.com and ghe.com are treated as GitHub Enterprise Server hosts and have tokens sourced from the following environment variables before falling back to host-specific tokens stored within system-specific secured storage: 1. `GITHUB_ENTERPRISE_TOKEN`, 2. `GH_ENTERPRISE_TOKEN` and 3. `GITHUB_TOKEN` when the `CODESPACES` environment variable is set. The result being `git` sending authentication tokens when cloning submodules. In version `2.63.0`, these GitHub CLI commands will limit the hosts for which `gh` acts as a credential helper to source authentication tokens. Additionally, `GITHUB_TOKEN` will only be used for GitHub.com and ghe.com. Users are advised to upgrade. Additionally users are advised to revoke authentication tokens used with the GitHub CLI and to review their personal security log and any relevant audit logs for actions associated with their account or enterprise","aliases":["GHSA-jwcm-9g39-pmcw","GO-2024-3296"],"modified":"2026-10-28T02:31:07.469557200Z","published":"2024-11-27T21:25:14.071Z","related":["openSUSE-SU-2024:14567-1"],"database_specific":{"cwe_ids":["CWE-200"],"osv_generated_from":"https://github.com/CVEProject/cvelistV5/tree/main/cves/2024/53xxx/CVE-2024-53858.json","cna_assigner":"GitHub_M"},"references":[{"type":"WEB","url":"https://git-scm.com/docs/gitcredentials"},{"type":"ADVISORY","url":"https://github.com/CVEProject/cvelistV5/tree/main/cves/2024/53xxx/CVE-2024-53858.json"},{"type":"ADVISORY","url":"https://github.com/cli/cli/security/advisories/GHSA-jwcm-9g39-pmcw"},{"type":"ADVISORY","url":"https://nvd.nist.gov/vuln/detail/CVE-2024-53858"}],"affected":[{"ranges":[{"type":"GIT","repo":"https://github.com/cli/cli","events":[{"introduced":"0"},{"fixed":"1fe14c956d057e6abda50a76d8820a6e668ba70a"}],"database_specific":{"extracted_events":[{"range":[{"introduced":"0"},{"fixed":"2.63.0"}],"source":"AFFECTED_FIELD","strategy":"StringRangeExpression"}]}}],"versions":["v2.62.0","v2.61.0","v2.60.1","v2.60.0","v2.59.0","v2.58.0","v2.57.0","v2.56.0","v2.55.0","v2.54.0","v2.53.0","v2.52.0","v2.51.0","v2.50.0","v2.49.2","v2.49.1","v2.49.0","v2.48.0","v2.47.0","v2.46.0","v2.45.0","v2.44.1","v2.44.0","v2.43.1","v2.43.0","v2.42.1","v2.42.0","v2.41.0","v2.40.1","v2.40.0","v2.39.2","v2.39.1","v2.39.0","v2.38.0","v2.37.0","v2.36.0","v2.35.0","v2.34.0","v2.33.0","v2.32.1","v2.32.0","v2.31.0","v2.30.0","v2.27.0","v2.26.1","v2.26.0","v2.25.1","v2.25.0","v2.24.3","v2.24.2","v2.24.1","v2.24.0","v2.23.0","v2.22.1","v2.22.0","v2.21.2","v2.21.1","v2.21.0","v2.20.2","v2.20.1","v2.20.0","v2.19.0","v2.18.1","v2.18.0","v2.17.0","v2.16.1","v2.16.0","v2.15.0","v2.14.7","v2.14.6","v2.14.5","v2.14.4","v2.14.3","v2.14.2","v2.14.1","v2.14.0","v2.13.0","v2.12.1","v2.12.0","v2.11.3","v2.11.2","v2.11.1","v2.11.0","v2.10.1","v2.10.0","v2.9.0","v2.8.0","v2.7.0","v2.6.0","v2.5.2","v2.4.0","v2.5.1","v2.5.0","v2.3.0","v2.2.0","v2.1.0","v2.0.0","v1.14.0","v1.12.1","v1.13.0","v1.12.0","v1.11.0","v1.10.3","v1.10.2","v1.10.1","v1.10.0","v1.9.2","v1.9.1","v1.9.0","v1.8.1","v1.8.0","v1.7.0","v1.6.1","v1.6.2","v1.6.0","v1.5.0","v1.4.0","v1.3.0","v1.2.1","v1.2.0","v1.1.0","v1.0.0","v0.12.0","v0.11.1","v0.11.0","v0.10.1","v0.10.0","v0.9.0","v0.8.0",