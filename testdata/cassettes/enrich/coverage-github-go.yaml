        body: '{"id":"CVE-2026-64652","summary":"GitHub CLI: Partial token disclosure in `gh auth status` output","details":"GitHub CLI (gh) is GitHub''s official command line tool. Prior to version 2.97.0, gh auth status masked only the characters after the last underscore in certain fine-grained personal access tokens and GitHub App tokens. As a result, part of an affected token could appear in terminal or CI output that is captured or shared. Authenticated users are affected if they ran gh auth status (without the --show-token flag) with a token type whose format contains an underscore after the prefix. This includes fine-grained personal access tokens (github_pat_*) and GitHub App installation and user access tokens (ghs_*, ghu_*; for example, ghs_\u003cAPPID\u003e_\u003cJWT\u003e), as well as the Actions GITHUB_TOKEN. Classic tokens such as gho_* and ghp_* have an underscore-free body and are not affected. This issue is fixed in version 2.97.0.","aliases":["GHSA-cg6r-mpgc-h9mm","GO-2026-6766"],"modified":"2026-11-18T17:27:27.595191491Z","published":"2026-08-06T17:45:35.729Z","related":["SUSE-SU-2026:24730-1","openSUSE-SU-2026:11530-1","openSUSE-SU-2026:21663-1","openSUSE-SU-2026:22336-1"],"database_specific":{"cna_assigner":"GitHub_M","cwe_ids":["CWE-201"],"osv_generated_from":"https://github.com/CVEProject/cvelistV5/tree/main/cves/2026/64xxx/CVE-2026-64652.json"},"references":[{"type":"WEB","url":"https://github.com/cli/cli/releases/tag/v2.97.0"},{"type":"ADVISORY","url":"https://github.com/CVEProject/cvelistV5/tree/main/cves/2026/64xxx/CVE-2026-64652.json"},{"type":"ADVISORY","url":"https://github.com/cli/cli/security/advisories/GHSA-cg6r-mpgc-h9mm"},{"type":"ADVISORY","url":"https://nvd.nist.gov/vuln/detail/CVE-2026-64652"},{"type":"FIX","url":"https://github.com/cli/cli/commit/3f6a16a9f8c7fe9676aa8d8f47b399310dd231c3"}],"affected":[{"ranges":[{"type":"GIT","repo":"https://github.com/cli/cli","events":[{"introduced":"0"},{"fixed":"55dbb4dc6b7edb10b48e3d7fc5b