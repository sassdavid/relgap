        content_length: 4848
        body: '{"id":"CVE-2026-64655","summary":"GitHub CLI: Attestation Verification Bypass via Unescaped Regex Metacharacters in SAN Matching","details":"GitHub CLI (gh) is GitHub’s official command line tool. Prior to 2.97.0, gh attestation verify  builds the certificate Subject Alternative Name matcher from the --signer-repo and --signer-workflow  flag values without escaping regex metacharacters, so a user-supplied repository or workflow name is treated as a regular expression rather than a literal string. Because GitHub permits characters such as  `.`  in organization, repository, and workflow path names and  `.`  is a regex wildcard, an attacker can register a lookalike name (for example github/artifact.attestations-workflows) that satisfies a matcher intended for a different trusted signer (github/artifact-attestations-workflows), bypassing the intended Sigstore attestation verification. Exploitation requires the attacker to create a plausible lookalike repository and produce valid attestations from it, which could undermine supply chain verification for CI/CD pipelines or policy gates that pin trust to a specific signing workflow. This issue is fixed in version 2.97.0.","aliases":["GHSA-mm27-mwq9-fr5g","GO-2026-6767"],"modified":"2026-11-18T17:27:27.563183011Z","published":"2026-08-06T18:41:54.628Z","related":["SUSE-SU-2026:24730-1","openSUSE-SU-2026:11530-1","openSUSE-SU-2026:21663-1","openSUSE-SU-2026:22336-1"],"database_specific":{"cna_assigner":"GitHub_M","cwe_ids":["CWE-185"],"osv_generated_from":"https://github.com/CVEProject/cvelistV5/tree/main/cves/2026/64xxx/CVE-2026-64655.json"},"references":[{"type":"WEB","url":"https://github.com/cli/cli/releases/tag/v2.97.0"},{"type":"ADVISORY","url":"https://github.com/CVEProject/cvelistV5/tree/main/cves/2026/64xxx/CVE-2026-64655.json"},{"type":"ADVISORY","url":"https://github.com/cli/cli/security/advisories/GHSA-mm27-mwq9-fr5g"},{"type":"ADVISORY","url":"https://nvd.nist.gov/vuln/detail/CVE-2026-64655"},{"typ