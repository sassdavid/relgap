        body: '{"id":"CVE-2026-64654","summary":"GitHub CLI: Terminal escape sequence injection in multiple `gh` commands","details":"GitHub CLI (gh) is GitHub''s official command line tool. Prior to version 2.97.0, multiple GitHub CLI commands printed externally controlled gist, API, pull request, release, codespace, skill, or agent-task content without neutralizing terminal escape sequences. An attacker who can influence that content can embed escape sequences that are interpreted by the terminal of a user who runs an affected command, with impact ranging from cosmetic manipulation of the title or on-screen content to, on some terminal emulators, command execution. This extends the same class of issue as CVE-2026-45803—which addressed only gh run view --log—to the other affected command paths. This issue is fixed in version 2.97.0.","aliases":["GHSA-3m3g-3wcr-px46"],"modified":"2026-10-28T02:30:29.347415310Z","published":"2026-08-06T18:27:38.491Z","related":["openSUSE-SU-2026:11530-1","openSUSE-SU-2026:21663-1"],"database_specific":{"cna_assigner":"GitHub_M","cwe_ids":["CWE-150"],"osv_generated_from":"https://github.com/CVEProject/cvelistV5/tree/main/cves/2026/64xxx/CVE-2026-64654.json"},"references":[{"type":"WEB","url":"https://github.com/cli/cli/releases/tag/v2.97.0"},{"type":"ADVISORY","url":"https://github.com/CVEProject/cvelistV5/tree/main/cves/2026/64xxx/CVE-2026-64654.json"},{"type":"ADVISORY","url":"https://github.com/cli/cli/security/advisories/GHSA-3m3g-3wcr-px46"},{"type":"ADVISORY","url":"https://nvd.nist.gov/vuln/detail/CVE-2026-64654"},{"type":"FIX","url":"https://github.com/cli/cli/commit/2a1409fe88d416cc85fc96fb5bc473f83ed5a054"}],"affected":[{"ranges":[{"type":"GIT","repo":"https://github.com/cli/cli","events":[{"introduced":"0"},{"fixed":"55dbb4dc6b7edb10b48e3d7fc5bccd32318d1b55"},{"fixed":"2a1409fe88d416cc85fc96fb5bc473f83ed5a054"}],"database_specific":{"extracted_events":[{"source":"AFFECTED_FIELD","strategy":"StringRangeExpression","range":[{