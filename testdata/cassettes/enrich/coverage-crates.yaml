        content_length: 2106
        body: '{"id":"GHSA-rr8g-9fpq-6wmg","summary":"Tokio broadcast channel calls clone in parallel, but does not require `Sync`","details":"The broadcast channel internally calls `clone` on the stored value when receiving it, and only requires `T:Send`. This means that using the broadcast channel with values that are `Send` but not `Sync` can trigger unsoundness if the `clone` implementation makes use of the value being `!Sync`.\n\nThank you to Austin Bonander for finding and reporting this issue.","aliases":["RUSTSEC-2025-0023"],"modified":"2026-09-10T03:50:24.081979053Z","published":"2025-04-07T21:12:50Z","database_specific":{"cwe_ids":["CWE-664"],"severity":"LOW","github_reviewed":true,"github_reviewed_at":"2025-04-07T21:12:50Z","nvd_published_at":null},"references":[{"type":"WEB","url":"https://github.com/tokio-rs/tokio/pull/7232"},{"type":"PACKAGE","url":"https://github.com/tokio-rs/tokio"},{"type":"WEB","url":"https://rustsec.org/advisories/RUSTSEC-2025-0023.html"}],"affected":[{"package":{"name":"tokio","ecosystem":"crates.io","purl":"pkg:cargo/tokio"},"ranges":[{"type":"SEMVER","events":[{"introduced":"1.44.0"},{"fixed":"1.44.2"}]}],"database_specific":{"source":"https://github.com/github/advisory-database/blob/main/advisories/github-reviewed/2025/04/GHSA-rr8g-9fpq-6wmg/GHSA-rr8g-9fpq-6wmg.json"}},{"package":{"name":"tokio","ecosystem":"crates.io","purl":"pkg:cargo/tokio"},"ranges":[{"type":"SEMVER","events":[{"introduced":"0.2.5"},{"fixed":"1.38.2"}]}],"database_specific":{"source":"https://github.com/github/advisory-database/blob/main/advisories/github-reviewed/2025/04/GHSA-rr8g-9fpq-6wmg/GHSA-rr8g-9fpq-6wmg.json"}},{"package":{"name":"tokio","ecosystem":"crates.io","purl":"pkg:cargo/tokio"},"ranges":[{"type":"SEMVER","events":[{"introduced":"1.39.0"},{"fixed":"1.43.1"}]}],"database_specific":{"source":"https://github.com/github/advisory-database/blob/main/advisories/github-reviewed/2025/04/GHSA-rr8g-9fpq-6wmg/GHSA-rr8g-9fpq-6wmg.json"}}],"schema_versio