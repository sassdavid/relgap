        content_length: 3350
        body: '{"id":"GHSA-7rrj-xr53-82p7","summary":"Tokio reject_remote_clients configuration may get dropped when creating a Windows named pipe","details":"### Impact\n\nWhen configuring a Windows named pipe server, setting `pipe_mode` will reset `reject_remote_clients` to `false`. If the application has previously configured `reject_remote_clients` to `true`, this effectively undoes the configuration. This also applies if `reject_remote_clients` is not explicitly set as this is the default configuration and is cleared by calling `pipe_mode`.\n\nRemote clients may only access the named pipe if the named pipe''s associated path is accessible via a publically shared folder (SMB).\n\n### Patches\n\nThe following versions have been patched:\n* 1.23.1\n* 1.20.3\n* 1.18.4\n\nThe fix will also be present in all releases starting from version 1.24.0.\n\nNamed pipes were introduced to Tokio in version 1.7.0, so releases older than 1.7.0 are not affected.\n\n### Workarounds\n\nEnsure that `pipe_mode` is set **first** after initializing a `ServerOptions`. For example:\n\n```rust\nlet mut opts = ServerOptions::new();\nopts.pipe_mode(PipeMode::Message);\nopts.reject_remote_clients(true);\n```\n\n### References\n\nhttps://learn.microsoft.com/en-us/windows/win32/api/winbase/nf-winbase-createnamedpipea#pipe_reject_remote_clients\n","aliases":["CVE-2023-22466","RUSTSEC-2023-0001"],"modified":"2026-09-10T03:49:51.032327041Z","published":"2023-01-06T21:40:58Z","database_specific":{"github_reviewed_at":"2023-01-06T21:40:58Z","nvd_published_at":"2023-01-04T22:15:00Z","cwe_ids":["CWE-665"],"severity":"MODERATE","github_reviewed":true},"references":[{"type":"WEB","url":"https://github.com/tokio-rs/tokio/security/advisories/GHSA-7rrj-xr53-82p7"},{"type":"ADVISORY","url":"https://nvd.nist.gov/vuln/detail/CVE-2023-22466"},{"type":"WEB","url":"https://github.com/tokio-rs/tokio/pull/5336"},{"type":"PACKAGE","url":"https://github.com/tokio-rs/tokio"},{"type":"WEB","url":"https://github.com/tokio-rs/tokio/releases/tag/tokio-1.23.1"},{"type":"WEB","url":"https://learn.microsoft.com/en-us/windows/win32/api/winbase/nf-winbase-createnamedpipea#pipe_reject_remote_clients"},{"type":"WEB","url":"https://rustsec.org/advisories/RUSTSEC-2023-0001.html"}],"affected":[{"package":{"name":"tokio","ecosystem":"crates.io","purl":"pkg:cargo/tokio"},"ranges":[{"type":"SEMVER","events":[{"introduced":"1.7.0"},{"fixed":"1.18.4"}]}],"database_specific":{"source":"https://github.com/github/advisory-database/blob/main/advisories/github-reviewed/2023/01/GHSA-7rrj-xr53-82p7/GHSA-7rrj-xr53-82p7.json"}},{"package":{"name":"tokio","ecosystem":"crates.io","purl":"pkg:cargo/tokio"},"ranges":[{"type":"SEMVER","events":[{"introduced":"1.19.0"},{"fixed":"1.20.3"}]}],"database_specific":{"source":"https://github.com/github/advisory-database/blob/main/advisories/github-reviewed/2023/01/GHSA-7rrj-xr53-82p7/GHSA-7rrj-xr53-82p7.json"}},{"package":{"name":"tokio","ecosystem":"crates.io","purl":"pkg:cargo/tokio"},"ranges":[{"type":"SEMVER","events":[{"introduced":"1.21.0"},{"fixed":"1.23.1"}]}],"database_specific":{"source":"https://github.com/github/advisory-database/blob/main/advisories/github-reviewed/2023/01/GHSA-7rrj-xr53-82p7/GHSA-7rrj-xr53-82p7.json"}}],"schema_version":"1.9.0","severity":[{"type":"CVSS_V3","score":"CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:L/I:N/A:L"}]}'
