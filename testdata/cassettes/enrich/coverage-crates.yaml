        content_length: 2271
        body: '{"id":"GHSA-fg7r-2g4j-5cgr","summary":"Race Condition in tokio","details":"If a tokio::sync::oneshot channel is closed (via the oneshot::Receiver::close method), a data race may occur if the oneshot::Sender::send method is called while the corresponding oneshot::Receiver is awaited or calling try_recv.\n\nWhen these methods are called concurrently on a closed channel, the two halves of the channel can concurrently access a shared memory location, resulting in a data race. This has been observed to cause memory corruption.\n\nNote that the race only occurs when both halves of the channel are used after the Receiver half has called close. Code where close is not used, or where the Receiver is not awaited and try_recv is not called after calling close, is not affected.\n\n","aliases":["CVE-2021-45710","RUSTSEC-2021-0124"],"modified":"2023-11-08T04:07:23.239744Z","published":"2022-01-06T22:04:37Z","database_specific":{"nvd_published_at":"2021-12-27T00:15:00Z","cwe_ids":["CWE-362"],"severity":"HIGH","github_reviewed":true,"github_reviewed_at":"2022-01-05T22:43:36Z"},"references":[{"type":"ADVISORY","url":"https://nvd.nist.gov/vuln/detail/CVE-2021-45710"},{"type":"WEB","url":"https://github.com/tokio-rs/tokio/issues/4225"},{"type":"PACKAGE","url":"https://github.com/tokio-rs/tokio"},{"type":"WEB","url":"https://raw.githubusercontent.com/rustsec/advisory-db/main/crates/tokio/RUSTSEC-2021-0124.md"},{"type":"WEB","url":"https://rustsec.org/advisories/RUSTSEC-2021-0124.html"}],"affected":[{"package":{"name":"tokio","ecosystem":"crates.io","purl":"pkg:cargo/tokio"},"ranges":[{"type":"SEMVER","events":[{"introduced":"0.1.14"},{"fixed":"1.8.4"}]}],"database_specific":{"source":"https://github.com/github/advisory-database/blob/main/advisories/github-reviewed/2022/01/GHSA-fg7r-2g4j-5cgr/GHSA-fg7r-2g4j-5cgr.json"}},{"package":{"name":"tokio","ecosystem":"crates.io","purl":"pkg:cargo/tokio"},"ranges":[{"type":"SEMVER","events":[{"introduced":"1.9.0"},{"fixed":"1.13.1"}]}],"database_specific":{"source":"https://github.com/github/advisory-database/blob/main/advisories/github-reviewed/2022/01/GHSA-fg7r-2g4j-5cgr/GHSA-fg7r-2g4j-5cgr.json"}}],"schema_version":"1.9.0","severity":[{"type":"CVSS_V3","score":"CVSS:3.1/AV:N/AC:H/PR:N/UI:N/S:U/C:H/I:H/A:H"}]}'
