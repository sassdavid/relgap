        content_length: 6312
        body: '{"id":"CVE-2026-40164","summary":"jq: Algorithmic complexity DoS via hardcoded MurmurHash3 seed","details":"jq is a command-line JSON processor. Before commit 0c7d133c3c7e37c00b6d46b658a02244fdd3c784, jq used MurmurHash3 with a hardcoded, publicly visible seed (0x432A9843) for all JSON object hash table operations, which allowed an attacker to precompute key collisions offline. By supplying a crafted JSON object (~100 KB) where all keys hashed to the same bucket, hash table lookups degraded from O(1) to O(n), turning any jq expression into an O(n²) operation and causing significant CPU exhaustion. This affected common jq use cases such as CI/CD pipelines, web services, and data processing scripts, and was far more practical to exploit than existing heap overflow issues since it required only a small payload. This issue has been patched in commit 0c7d133c3c7e37c00b6d46b658a02244fdd3c784.","aliases":["GHSA-wwj8-gxm6-jc29"],"modified":"2026-11-16T18:12:19.961299540Z","published":"2026-04-13T23:40:12.693Z","related":["ALSA-2026:16252","ALSA-2026:16692","ALSA-2026:16693","ALSA-2026:19151","ALSA-2026:19365","ALSA-2026:98496","ALSA-2026:98603","SUSE-SU-2026:22545-1","SUSE-SU-2026:22566-1","SUSE-SU-2026:22664-1","SUSE-SU-2026:22705-1","SUSE-SU-2026:23873-1","SUSE-SU-2026:2983-1","SUSE-SU-2026:4275-1","openSUSE-SU-2026:10850-1","openSUSE-SU-2026:21248-1"],"database_specific":{"osv_generated_from":"https://github.com/CVEProject/cvelistV5/tree/main/cves/2026/40xxx/CVE-2026-40164.json","cna_assigner":"GitHub_M","cwe_ids":["CWE-328","CWE-407"]},"references":[{"type":"WEB","url":"https://security.access.redhat.com/data/csaf/v2/vex/2026/cve-2026-40164.json"},{"type":"ADVISORY","url":"https://access.redhat.com/errata/RHSA-2026:16252"},{"type":"ADVISORY","url":"https://access.redhat.com/errata/RHSA-2026:16692"},{"type":"ADVISORY","url":"https://access.redhat.com/errata/RHSA-2026:16693"},{"type":"ADVISORY","url":"https://access.redhat.com/errata/RHSA-2026:18040"},{"typ