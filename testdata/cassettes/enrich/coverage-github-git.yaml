        content_length: 2204
        body: '{"id":"CVE-2026-41256","summary":"jq: Embedded NUL truncates top-level jq programs loaded with -f","details":"jq is a command-line JSON processor. In 1.8.1 and earlier, Top-level jq programs loaded from a file with -f are truncated at the first embedded NUL byte on current upstream HEAD. A crafted filter file such as . followed by \\x00 and arbitrary suffix compiles and executes as only the prefix before the NUL. This leaves jq with a post-CVE-2026-33948 prefix/full-buffer mismatch on the compilation path even though the JSON parser path has already been fixed.","aliases":["GHSA-vf2h-chrj-q3fg"],"modified":"2026-10-28T02:30:23.776087188Z","published":"2026-05-11T17:18:30.975Z","related":["SUSE-SU-2026:22545-1","SUSE-SU-2026:22566-1","SUSE-SU-2026:22664-1","SUSE-SU-2026:23873-1","SUSE-SU-2026:4275-1","openSUSE-SU-2026:10850-1","openSUSE-SU-2026:21248-1"],"database_specific":{"cwe_ids":["CWE-158"],"osv_generated_from":"https://github.com/CVEProject/cvelistV5/tree/main/cves/2026/41xxx/CVE-2026-41256.json","cna_assigner":"GitHub_M"},"references":[{"type":"ADVISORY","url":"https://github.com/CVEProject/cvelistV5/tree/main/cves/2026/41xxx/CVE-2026-41256.json"},{"type":"ADVISORY","url":"https://github.com/jqlang/jq/security/advisories/GHSA-vf2h-chrj-q3fg"},{"type":"ADVISORY","url":"https://nvd.nist.gov/vuln/detail/CVE-2026-41256"}],"affected":[{"ranges":[{"type":"GIT","repo":"https://github.com/jqlang/jq","events":[{"introduced":"0"},{"last_affected":"4467af7068b1bcd7f882defff6e7ea674c5357f4"}],"database_specific":{"extracted_events":[{"source":"AFFECTED_FIELD","strategy":"StringRangeExpression","range":[{"introduced":"0"},{"last_affected":"1.8.1"}]},{"cpe":"cpe:2.3:a:jqlang:jq:*:*:*:*:*:*:*:*","range":[{"introduced":"0"},{"last_affected":"1.8.1"}],"source":"CPE_RANGE"}]}}],"versions":["jq-1.8.1","jq-1.8.0","jq-1.7.1","jq-1.7","jq-1.7rc2","jq-1.7rc1","jq-1.6","1.6rc2","jq-1.6rc1","jq-1.5rc2","jq-1.5rc1","jq-1.4","jq-1.3","jq-1.2","jq-1.1","jq-1.0"],"database