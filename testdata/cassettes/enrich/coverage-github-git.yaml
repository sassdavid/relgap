        body: '{"id":"CVE-2026-41257","summary":"jq: Signed-int overflow in `stack_reallocate` (jq VM stack)","details":"jq is a command-line JSON processor. In 1.8.1 and earlier, the jq bytecode VM''s data stack tracks its allocation size in a signed int. When the stack grows beyond ≈1 GiB (via deeply nested generator forks), the doubling arithmetic overflows. The wrapped value is passed to realloc and then used for a memmove with attacker-influenced offsets.","aliases":["GHSA-4jm8-m363-4539"],"modified":"2026-10-28T02:30:49.299789631Z","published":"2026-05-11T17:14:32.579Z","related":["SUSE-SU-2026:22545-1","SUSE-SU-2026:22566-1","SUSE-SU-2026:22664-1","SUSE-SU-2026:23873-1","SUSE-SU-2026:4275-1","openSUSE-SU-2026:10850-1","openSUSE-SU-2026:21248-1"],"database_specific":{"cna_assigner":"GitHub_M","cwe_ids":["CWE-190","CWE-787"],"osv_generated_from":"https://github.com/CVEProject/cvelistV5/tree/main/cves/2026/41xxx/CVE-2026-41257.json"},"references":[{"type":"ADVISORY","url":"https://github.com/CVEProject/cvelistV5/tree/main/cves/2026/41xxx/CVE-2026-41257.json"},{"type":"ADVISORY","url":"https://github.com/jqlang/jq/security/advisories/GHSA-4jm8-m363-4539"},{"type":"ADVISORY","url":"https://nvd.nist.gov/vuln/detail/CVE-2026-41257"}],"affected":[{"ranges":[{"type":"GIT","repo":"https://github.com/jqlang/jq","events":[{"introduced":"0"},{"last_affected":"4467af7068b1bcd7f882defff6e7ea674c5357f4"}],"database_specific":{"extracted_events":[{"strategy":"StringRangeExpression","range":[{"introduced":"0"},{"last_affected":"1.8.1"}],"source":"AFFECTED_FIELD"},{"cpe":"cpe:2.3:a:jqlang:jq:*:*:*:*:*:*:*:*","range":[{"introduced":"0"},{"last_affected":"1.8.1"}],"source":"CPE_RANGE"}]}}],"versions":["jq-1.8.1","jq-1.8.0","jq-1.7.1","jq-1.7","jq-1.7rc2","jq-1.7rc1","jq-1.6","1.6rc2","jq-1.6rc1","jq-1.5rc2","jq-1.5rc1","jq-1.4","jq-1.3","jq-1.2","jq-1.1","jq-1.0"],"database_specific":{"source":"https://storage.googleapis.com/cve-osv-conversion/osv-output/CVE-2026-41257.json"}}],"