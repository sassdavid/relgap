        body: '{"id":"CVE-2026-43895","summary":"jq: Embedded NUL in jq import paths causes local redaction-policy bypass and preserves sensitive fields in published artifacts","details":"jq is a command-line JSON processor. In 1.8.1 and earlier, jq accepts embedded NUL bytes in import paths at the jq-language level, but later resolves those paths through C string operations during module and data-file lookup. This creates a mismatch between the logical import string that policy or audit code may validate and the on-disk path that jq actually opens.","aliases":["GHSA-7q7g-mrq3-phxr"],"modified":"2026-10-28T02:30:46.388572724Z","published":"2026-05-11T17:24:02.880Z","related":["SUSE-SU-2026:23671-1","SUSE-SU-2026:23707-1","SUSE-SU-2026:23728-1","SUSE-SU-2026:23735-1","SUSE-SU-2026:23873-1","SUSE-SU-2026:4275-1","openSUSE-SU-2026:10850-1","openSUSE-SU-2026:21833-1"],"database_specific":{"osv_generated_from":"https://github.com/CVEProject/cvelistV5/tree/main/cves/2026/43xxx/CVE-2026-43895.json","cna_assigner":"GitHub_M","cwe_ids":["CWE-158","CWE-20"]},"references":[{"type":"ADVISORY","url":"https://github.com/CVEProject/cvelistV5/tree/main/cves/2026/43xxx/CVE-2026-43895.json"},{"type":"ADVISORY","url":"https://github.com/jqlang/jq/security/advisories/GHSA-7q7g-mrq3-phxr"},{"type":"ADVISORY","url":"https://nvd.nist.gov/vuln/detail/CVE-2026-43895"}],"affected":[{"ranges":[{"type":"GIT","repo":"https://github.com/jqlang/jq","events":[{"introduced":"0"},{"last_affected":"4467af7068b1bcd7f882defff6e7ea674c5357f4"}],"database_specific":{"extracted_events":[{"source":"AFFECTED_FIELD","strategy":"StringRangeExpression","range":[{"introduced":"0"},{"last_affected":"1.8.1"}]},{"source":"CPE_RANGE","cpe":"cpe:2.3:a:jqlang:jq:*:*:*:*:*:*:*:*","range":[{"introduced":"0"},{"last_affected":"1.8.1"}]}]}}],"versions":["jq-1.8.1","jq-1.8.0","jq-1.7.1","jq-1.7","jq-1.7rc2","jq-1.7rc1","jq-1.6","1.6rc2","jq-1.6rc1","jq-1.5rc2","jq-1.5rc1","jq-1.4","jq-1.3","jq-1.2","jq-1.1","jq-1.0"],"dat