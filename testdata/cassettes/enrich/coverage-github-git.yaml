        content_length: 2536
        body: '{"id":"CVE-2026-49839","summary":"jq --rawfile invalid-state reuse after String too long causes heap-buffer-overflow","details":"jq is a command-line JSON processor. Prior to 1.8.2,` jq --rawfile` can turn a handled oversized-string error into invalid-state reuse and a real heap out-of-bounds write in assertion-disabled builds. When jv_load_file(raw=1) reads an attacker-controlled file, it repeatedly appends file chunks to the same jv string accumulator. Once jv_string_append_buf() returns jv_invalid_with_msg(\"String too long\"), the raw-file loop does not stop. If the file contains at least one more byte, the next loop iteration appends a new chunk to an object that is already invalid. With assertions enabled this aborts in jvp_string_ptr(). With assertions disabled, the invalid object is interpreted as a string object and ASan reports heap-buffer-overflow. This vulnerability is fixed in 1.8.2.","aliases":["GHSA-cfh2-vwfq-qfmm"],"modified":"2026-10-28T02:30:42.672190572Z","published":"2026-06-25T17:17:46.181Z","related":["SUSE-SU-2026:22597-1","SUSE-SU-2026:22637-1","SUSE-SU-2026:22900-1","SUSE-SU-2026:23873-1","SUSE-SU-2026:4275-1","openSUSE-SU-2026:11133-1","openSUSE-SU-2026:21318-1"],"database_specific":{"osv_generated_from":"https://github.com/CVEProject/cvelistV5/tree/main/cves/2026/49xxx/CVE-2026-49839.json","cna_assigner":"GitHub_M","cwe_ids":["CWE-787"]},"references":[{"type":"ADVISORY","url":"https://github.com/CVEProject/cvelistV5/tree/main/cves/2026/49xxx/CVE-2026-49839.json"},{"type":"ADVISORY","url":"https://github.com/jqlang/jq/security/advisories/GHSA-cfh2-vwfq-qfmm"},{"type":"ADVISORY","url":"https://nvd.nist.gov/vuln/detail/CVE-2026-49839"}],"affected":[{"ranges":[{"type":"GIT","repo":"https://github.com/jqlang/jq","events":[{"introduced":"0"},{"fixed":"34f7186b86743a083a589741b6cea95293524108"}],"database_specific":{"extracted_events":[{"range":[{"introduced":"0"},{"fixed":"1.8.2"}],"source":"AFFECTED_FIELD","strategy":"StringRange