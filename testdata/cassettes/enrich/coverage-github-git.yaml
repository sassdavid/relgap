        content_length: 2041
        body: '{"id":"CVE-2026-40612","summary":"jq: Stack overflow via unbounded recursion in jv_contains","details":"jq is a command-line JSON processor. In 1.8.1 and earlier, jv_contains recurses into nested arrays/objects with no depth limit. With a sufficiently nested input structure (built programmatically with reduce, since the JSON parser caps at depth 10000), the C stack is exhausted.","aliases":["GHSA-r7m6-x9c7-h69j"],"modified":"2026-10-28T02:30:22.930111564Z","published":"2026-05-11T17:16:25.453Z","related":["SUSE-SU-2026:22545-1","SUSE-SU-2026:22566-1","SUSE-SU-2026:22664-1","SUSE-SU-2026:23873-1","SUSE-SU-2026:4275-1","openSUSE-SU-2026:10850-1","openSUSE-SU-2026:21248-1"],"database_specific":{"cna_assigner":"GitHub_M","cwe_ids":["CWE-674"],"osv_generated_from":"https://github.com/CVEProject/cvelistV5/tree/main/cves/2026/40xxx/CVE-2026-40612.json"},"references":[{"type":"ADVISORY","url":"https://github.com/CVEProject/cvelistV5/tree/main/cves/2026/40xxx/CVE-2026-40612.json"},{"type":"ADVISORY","url":"https://github.com/jqlang/jq/security/advisories/GHSA-r7m6-x9c7-h69j"},{"type":"ADVISORY","url":"https://nvd.nist.gov/vuln/detail/CVE-2026-40612"}],"affected":[{"ranges":[{"type":"GIT","repo":"https://github.com/jqlang/jq","events":[{"introduced":"0"},{"last_affected":"4467af7068b1bcd7f882defff6e7ea674c5357f4"}],"database_specific":{"extracted_events":[{"strategy":"StringRangeExpression","range":[{"introduced":"0"},{"last_affected":"1.8.1"}],"source":"AFFECTED_FIELD"},{"cpe":"cpe:2.3:a:jqlang:jq:*:*:*:*:*:*:*:*","range":[{"introduced":"0"},{"last_affected":"1.8.1"}],"source":"CPE_RANGE"}]}}],"versions":["jq-1.8.1","jq-1.8.0","jq-1.7.1","jq-1.7","jq-1.7rc2","jq-1.7rc1","jq-1.6","1.6rc2","jq-1.6rc1","jq-1.5rc2","jq-1.5rc1","jq-1.4","jq-1.3","jq-1.2","jq-1.1","jq-1.0"],"database_specific":{"source":"https://storage.googleapis.com/cve-osv-conversion/osv-output/CVE-2026-40612.json"}}],"schema_version":"1.9.2","severity":[{"type":"CVSS_V4","score":"CVSS:4.0/AV:L/A