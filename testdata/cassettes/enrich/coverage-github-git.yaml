        body: '{"id":"CVE-2026-44777","summary":"jq: stack overflow in module loading on mutual `include`","details":"jq is a command-line JSON processor. In 1.8.2rc1 and earlier, the ordinary module loader recurses without cycle detection when two\notherwise valid modules include each other.","aliases":["GHSA-rmpv-jgvr-wpr9"],"modified":"2026-10-28T02:30:55.215389526Z","published":"2026-05-11T17:23:20.228Z","related":["SUSE-SU-2026:22597-1","SUSE-SU-2026:22637-1","SUSE-SU-2026:22900-1","SUSE-SU-2026:23873-1","SUSE-SU-2026:4275-1","openSUSE-SU-2026:10850-1","openSUSE-SU-2026:21318-1"],"database_specific":{"cna_assigner":"GitHub_M","cwe_ids":["CWE-674"],"osv_generated_from":"https://github.com/CVEProject/cvelistV5/tree/main/cves/2026/44xxx/CVE-2026-44777.json"},"references":[{"type":"ADVISORY","url":"https://github.com/CVEProject/cvelistV5/tree/main/cves/2026/44xxx/CVE-2026-44777.json"},{"type":"ADVISORY","url":"https://github.com/jqlang/jq/security/advisories/GHSA-rmpv-jgvr-wpr9"},{"type":"ADVISORY","url":"https://nvd.nist.gov/vuln/detail/CVE-2026-44777"}],"affected":[{"ranges":[{"type":"GIT","repo":"https://github.com/jqlang/jq","events":[{"introduced":"0"},{"last_affected":"5f2a14dd1b03a8b43015058ed006dd4ab24fb58f"}],"database_specific":{"extracted_events":[{"strategy":"StringRangeExpression","range":[{"introduced":"0"},{"last_affected":"1.8.2rc1"}],"source":"AFFECTED_FIELD"},{"range":[{"introduced":"0"},{"last_affected":"1.8.2"}],"source":"CPE_RANGE","cpe":"cpe:2.3:a:jqlang:jq:*:*:*:*:*:*:*:*"}]}}],"versions":["jq-1.8.2rc1","jq-1.8.1","jq-1.8.0","jq-1.7.1","jq-1.7","jq-1.7rc2","jq-1.7rc1","jq-1.6","1.6rc2","jq-1.6rc1","jq-1.5rc2","jq-1.5rc1","jq-1.4","jq-1.3","jq-1.2","jq-1.1","jq-1.0"],"database_specific":{"source":"https://storage.googleapis.com/cve-osv-conversion/osv-output/CVE-2026-44777.json"}}],"schema_version":"1.9.2","severity":[{"type":"CVSS_V4","score":"CVSS:4.0/AV:L/AC:L/AT:N/PR:N/UI:P/VC:N/VI:N/VA:H/SC:N/SI:N/SA:N/E:P"}]}'
