        content_length: 4314
        body: '{"id":"CVE-2026-32316","summary":"jq: Integer overflow in jvp_string_append() allows Heap-based Buffer Overflow","details":"jq is a command-line JSON processor. An integer overflow vulnerability exists through version 1.8.1 within the jvp_string_append() and jvp_string_copy_replace_bad functions, where concatenating strings with a combined length exceeding 2^31 bytes causes a 32-bit unsigned integer overflow in the buffer allocation size calculation, resulting in a drastically undersized heap buffer. Subsequent memory copy operations then write the full string data into this undersized buffer, causing a heap buffer overflow classified as CWE-190 (Integer Overflow) leading to CWE-122 (Heap-based Buffer Overflow). Any system evaluating untrusted jq queries is affected, as an attacker can crash the process or potentially achieve further exploitation through heap corruption by crafting queries that produce extremely large strings. The root cause is the absence of string size bounds checking, unlike arrays and objects which already have size limits. The issue has been addressed in commit e47e56d226519635768e6aab2f38f0ab037c09e5.","aliases":["GHSA-q3h9-m34w-h76f"],"modified":"2026-10-28T11:10:14.869554518Z","published":"2026-04-13T17:49:34.095Z","related":["SUSE-SU-2026:22545-1","SUSE-SU-2026:22566-1","SUSE-SU-2026:22664-1","SUSE-SU-2026:22705-1","SUSE-SU-2026:23873-1","SUSE-SU-2026:2983-1","openSUSE-SU-2026:10850-1","openSUSE-SU-2026:21248-1"],"database_specific":{"cna_assigner":"GitHub_M","cwe_ids":["CWE-122","CWE-190"],"osv_generated_from":"https://github.com/CVEProject/cvelistV5/tree/main/cves/2026/32xxx/CVE-2026-32316.json"},"references":[{"type":"WEB","url":"https://lists.debian.org/debian-lts-announce/2026/10/msg00034.html"},{"type":"ADVISORY","url":"https://github.com/CVEProject/cvelistV5/tree/main/cves/2026/32xxx/CVE-2026-32316.json"},{"type":"ADVISORY","url":"https://github.com/jqlang/jq/security/advisories/GHSA-q3h9-m34w-h76f"},{"type":"ADVISORY"