        body: '{"id":"CVE-2024-53427","details":"decNumberCopy in decNumber.c in jq through 1.7.1 does not properly consider that NaN is interpreted as numeric, which has a resultant stack-based buffer overflow and out-of-bounds write, as demonstrated by use of --slurp with subtraction, such as a filter of .-. when the input has a certain form of digit string with NaN (e.g., \"1 NaN123\" immediately followed by many more digits).","aliases":["GHSA-x6c3-qv5r-7q22"],"modified":"2026-10-28T02:30:31.960174721Z","published":"2025-02-26T00:00:00Z","related":["SUSE-SU-2025:20591-1","SUSE-SU-2026:23873-1","SUSE-SU-2026:4275-1","openSUSE-SU-2025:15161-1"],"database_specific":{"cwe_ids":["CWE-843"],"osv_generated_from":"https://github.com/CVEProject/cvelistV5/tree/main/cves/2024/53xxx/CVE-2024-53427.json","cna_assigner":"mitre"},"references":[{"type":"WEB","url":"https://gist.github.com/Ekkosun/a83870ce7f3b7813b9b462a395e8ad92"},{"type":"WEB","url":"https://github.com/jqlang/jq/blob/71c2ab509a8628dbbad4bc7b3f98a64aa90d3297/src/decNumber/decNumber.c#L3375"},{"type":"ADVISORY","url":"https://github.com/CVEProject/cvelistV5/tree/main/cves/2024/53xxx/CVE-2024-53427.json"},{"type":"ADVISORY","url":"https://github.com/jqlang/jq/security/advisories/GHSA-x6c3-qv5r-7q22"},{"type":"ADVISORY","url":"https://nvd.nist.gov/vuln/detail/CVE-2024-53427"},{"type":"REPORT","url":"https://github.com/jqlang/jq/issues/3196"},{"type":"REPORT","url":"https://github.com/jqlang/jq/issues/3296"}],"affected":[{"ranges":[{"type":"GIT","repo":"https://github.com/jqlang/jq","events":[{"introduced":"0"},{"last_affected":"71c2ab509a8628dbbad4bc7b3f98a64aa90d3297"}],"database_specific":{"extracted_events":[{"source":"AFFECTED_FIELD","strategy":"StandardRange","range":[{"introduced":"0"},{"last_affected":"1.7.1"}]},{"cpe":"cpe:2.3:a:jqlang:jq:*:*:*:*:*:*:*:*","range":[{"introduced":"0"},{"last_affected":"1.7.1"}],"source":"CPE_RANGE"}]}}],"versions":["jq-1.7.1","jq-1.7","jq-1.7rc2","jq-1.7rc1","jq-1.6","1.6rc2