        body: '{"id":"CVE-2026-47770","summary":"jq: stack overflow in deep structural equality","details":"jq is a command-line JSON processor. Prior to 1.8.2, comparing two sufficiently deeply nested arrays with the == operator exhausts the C stack on jq''s ordinary command-line surface, resulting in denial of service via stack exhaustion (uncontrolled recursion). The crash occurs in jq''s recursive structural comparison code, with the recursion repeating through jvp_array_equal() and jv_equal() in src/jv.c when comparing deeply nested arrays; a nearby sort comparator path through jv_cmp() in src/jv_aux.c overflows the stack at a larger nesting depth from  the same missing recursion guard. Anyone running jq comparisons on attacker-controlled deeply nested JSON values, or embedding jq in a context  where untrusted data can reach the == comparison path, is affected. This vulnerability is fixed in 1.8.2.","aliases":["GHSA-3pgx-frr7-3jxp"],"modified":"2026-10-28T02:30:37.513578787Z","published":"2026-06-25T17:22:21.531Z","related":["SUSE-SU-2026:23671-1","SUSE-SU-2026:23707-1","SUSE-SU-2026:23728-1","SUSE-SU-2026:23735-1","SUSE-SU-2026:23873-1","SUSE-SU-2026:4275-1","openSUSE-SU-2026:11133-1","openSUSE-SU-2026:21833-1"],"database_specific":{"osv_generated_from":"https://github.com/CVEProject/cvelistV5/tree/main/cves/2026/47xxx/CVE-2026-47770.json","cna_assigner":"GitHub_M","cwe_ids":["CWE-674"]},"references":[{"type":"ADVISORY","url":"https://github.com/CVEProject/cvelistV5/tree/main/cves/2026/47xxx/CVE-2026-47770.json"},{"type":"ADVISORY","url":"https://github.com/jqlang/jq/security/advisories/GHSA-3pgx-frr7-3jxp"},{"type":"ADVISORY","url":"https://nvd.nist.gov/vuln/detail/CVE-2026-47770"}],"affected":[{"ranges":[{"type":"GIT","repo":"https://github.com/jqlang/jq","events":[{"introduced":"0"},{"fixed":"34f7186b86743a083a589741b6cea95293524108"}],"database_specific":{"extracted_events":[{"strategy":"StringRangeExpression","range":[{"introduced":"0"},{"fixed":"1.8.2"}]