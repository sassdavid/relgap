        content_length: 2201
        body: '{"id":"CVE-2025-48060","summary":"AddressSanitizer: stack-buffer-overflow in jq_fuzz_execute (jv_string_vfmt)","details":"jq is a command-line JSON processor. In versions up to and including 1.7.1, a heap-buffer-overflow is present in function `jv_string_vfmt` in the jq_fuzz_execute harness from oss-fuzz. This crash happens on file jv.c, line 1456 `void* p = malloc(sz);`. As of time of publication, no patched versions are available.","aliases":["GHSA-p7rr-28xf-3m5w"],"modified":"2026-10-28T02:31:11.254152502Z","published":"2025-05-21T17:32:43.602Z","related":["ALSA-2025:10585","ALSA-2025:10618","SUSE-SU-2025:02915-1","SUSE-SU-2025:20591-1","SUSE-SU-2025:20655-1","SUSE-SU-2026:22545-1","SUSE-SU-2026:22566-1","openSUSE-SU-2025:15233-1","openSUSE-SU-2026:21248-1"],"database_specific":{"cwe_ids":["CWE-121"],"osv_generated_from":"https://github.com/CVEProject/cvelistV5/tree/main/cves/2025/48xxx/CVE-2025-48060.json","cna_assigner":"GitHub_M"},"references":[{"type":"WEB","url":"https://lists.debian.org/debian-lts-announce/2025/09/msg00022.html"},{"type":"ADVISORY","url":"https://github.com/CVEProject/cvelistV5/tree/main/cves/2025/48xxx/CVE-2025-48060.json"},{"type":"ADVISORY","url":"https://github.com/jqlang/jq/security/advisories/GHSA-p7rr-28xf-3m5w"},{"type":"ADVISORY","url":"https://nvd.nist.gov/vuln/detail/CVE-2025-48060"}],"affected":[{"ranges":[{"type":"GIT","repo":"https://github.com/jqlang/jq","events":[{"introduced":"0"},{"last_affected":"71c2ab509a8628dbbad4bc7b3f98a64aa90d3297"}],"database_specific":{"extracted_events":[{"range":[{"introduced":"0"},{"last_affected":"1.7.1"}],"source":"AFFECTED_FIELD","strategy":"StringRangeExpression"},{"source":"CPE_RANGE","cpe":"cpe:2.3:a:jqlang:jq:*:*:*:*:*:*:*:*","range":[{"introduced":"0"},{"last_affected":"1.7.1"}]}]}}],"versions":["jq-1.7.1","jq-1.7","jq-1.7rc2","jq-1.7rc1","jq-1.6","1.6rc2","jq-1.6rc1","jq-1.5rc2","jq-1.5rc1","jq-1.4","jq-1.3","jq-1.2","jq-1.1","jq-1.0"],"database_specific":{"source":"http