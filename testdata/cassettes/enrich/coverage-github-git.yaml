        content_length: 6078
        body: '{"id":"CVE-2026-39979","summary":"jq: Out-of-Bounds Read in jv_parse_sized() Error Formatting for Non-NUL-Terminated Counted Buffers","details":"jq is a command-line JSON processor. In commits before 2f09060afab23fe9390cce7cb860b10416e1bf5f, the jv_parse_sized() API in libjq accepts a counted buffer with an explicit length parameter, but its error-handling path formats the input buffer using %s in jv_string_fmt(), which reads until a NUL terminator is found rather than respecting the caller-supplied length. This means that when malformed JSON is passed in a non-NUL-terminated buffer, the error construction logic performs an out-of-bounds read past the end of the buffer. The vulnerability is reachable by any libjq consumer calling jv_parse_sized() with untrusted input, and depending on memory layout, can result in memory disclosure or process termination. The issue has been patched in commit 2f09060afab23fe9390cce7cb860b10416e1bf5f.","aliases":["GHSA-2hhh-px8h-355p"],"modified":"2026-11-16T18:12:21.512930433Z","published":"2026-04-13T22:18:56.252Z","related":["ALSA-2026:16252","ALSA-2026:16692","ALSA-2026:16693","ALSA-2026:19151","ALSA-2026:19365","ALSA-2026:98496","ALSA-2026:98603","SUSE-SU-2026:22545-1","SUSE-SU-2026:22566-1","SUSE-SU-2026:22664-1","SUSE-SU-2026:22705-1","SUSE-SU-2026:2983-1","openSUSE-SU-2026:10850-1","openSUSE-SU-2026:21248-1"],"database_specific":{"osv_generated_from":"https://github.com/CVEProject/cvelistV5/tree/main/cves/2026/39xxx/CVE-2026-39979.json","cna_assigner":"GitHub_M","cwe_ids":["CWE-125"]},"references":[{"type":"WEB","url":"https://security.access.redhat.com/data/csaf/v2/vex/2026/cve-2026-39979.json"},{"type":"ADVISORY","url":"https://access.redhat.com/errata/RHSA-2026:16252"},{"type":"ADVISORY","url":"https://access.redhat.com/errata/RHSA-2026:16692"},{"type":"ADVISORY","url":"https://access.redhat.com/errata/RHSA-2026:16693"},{"type":"ADVISORY","url":"https://access.redhat.com/errata/RHSA-2026:18040"},{"type":"ADVIS