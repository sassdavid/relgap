        content_length: 3181
        body: '{"id":"CVE-2026-39956","summary":"jq: Missing runtime type checks for _strindices lead to crash and limited memory disclosure","details":"jq is a command-line JSON processor. Prior to version 1.8.2, the _strindices builtin in jq''s src/builtin.c passes its arguments directly to jv_string_indexes() without verifying they are strings, and jv_string_indexes() in src/jv.c relies solely on assert() checks that are stripped in release builds compiled with -DNDEBUG. This allows an attacker to crash jq trivially with input like _strindices(0), and by crafting a numeric value whose IEEE-754 bit pattern maps to a chosen pointer, achieve a controlled pointer dereference and limited memory read/probe primitive. Any deployment that evaluates untrusted jq filters against a release build is vulnerable. This issue has been patched in commit fdf8ef0f0810e3d365cdd5160de43db46f57ed03, which is part of version 1.8.2.","aliases":["GHSA-6gc3-3g9p-xx28"],"modified":"2026-10-28T10:49:41.007963151Z","published":"2026-04-13T22:10:18.817Z","related":["SUSE-SU-2026:22545-1","SUSE-SU-2026:22566-1","SUSE-SU-2026:22664-1","SUSE-SU-2026:22705-1","SUSE-SU-2026:2983-1","openSUSE-SU-2026:10850-1","openSUSE-SU-2026:21248-1"],"database_specific":{"cna_assigner":"GitHub_M","cwe_ids":["CWE-125","CWE-476","CWE-843"],"osv_generated_from":"https://github.com/CVEProject/cvelistV5/tree/main/cves/2026/39xxx/CVE-2026-39956.json"},"references":[{"type":"ADVISORY","url":"https://github.com/CVEProject/cvelistV5/tree/main/cves/2026/39xxx/CVE-2026-39956.json"},{"type":"ADVISORY","url":"https://github.com/jqlang/jq/security/advisories/GHSA-6gc3-3g9p-xx28"},{"type":"ADVISORY","url":"https://nvd.nist.gov/vuln/detail/CVE-2026-39956"},{"type":"FIX","url":"https://github.com/jqlang/jq/commit/fdf8ef0f0810e3d365cdd5160de43db46f57ed03"}],"affected":[{"ranges":[{"type":"GIT","repo":"https://github.com/jqlang/jq","events":[{"introduced":"0"},{"fixed":"34f7186b86743a083a589741b6cea95293524108"},{"fixed":"fdf8ef0f