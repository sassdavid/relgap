        content_length: 2274
        body: '{"id":"CVE-2026-43894","summary":"jq: Wild stack write via signed-integer overflow in decNumber D2U() macro","details":"jq is a command-line JSON processor. In 1.8.1 and earlier, when decNumberFromString is given a number literal of INT_MAX-1 (2147483646) digits, the D2U() macro overflows during signed-int arithmetic. The wrapped negative value bypasses the heap-allocation size check, causes the function to use a 30-byte stack buffer, and then writes ≈715 million 16-bit units (≈1.4 GiB) at an offset 1.43 GiB below the stack frame. The written content is fully attacker-controlled (the parsed decimal digits, packed 3-per-unit).","aliases":["GHSA-5v7p-2r57-2g4g"],"modified":"2026-10-28T02:30:24.333368796Z","published":"2026-05-11T17:20:06.055Z","related":["SUSE-SU-2026:22545-1","SUSE-SU-2026:22566-1","SUSE-SU-2026:22664-1","SUSE-SU-2026:23873-1","SUSE-SU-2026:4275-1","openSUSE-SU-2026:10850-1","openSUSE-SU-2026:21248-1"],"database_specific":{"osv_generated_from":"https://github.com/CVEProject/cvelistV5/tree/main/cves/2026/43xxx/CVE-2026-43894.json","cna_assigner":"GitHub_M","cwe_ids":["CWE-190"]},"references":[{"type":"ADVISORY","url":"https://github.com/CVEProject/cvelistV5/tree/main/cves/2026/43xxx/CVE-2026-43894.json"},{"type":"ADVISORY","url":"https://github.com/jqlang/jq/security/advisories/GHSA-5v7p-2r57-2g4g"},{"type":"ADVISORY","url":"https://nvd.nist.gov/vuln/detail/CVE-2026-43894"}],"affected":[{"ranges":[{"type":"GIT","repo":"https://github.com/jqlang/jq","events":[{"introduced":"0"},{"last_affected":"4467af7068b1bcd7f882defff6e7ea674c5357f4"}],"database_specific":{"extracted_events":[{"strategy":"StringRangeExpression","range":[{"introduced":"0"},{"last_affected":"1.8.1"}],"source":"AFFECTED_FIELD"},{"source":"CPE_RANGE","cpe":"cpe:2.3:a:jqlang:jq:*:*:*:*:*:*:*:*","range":[{"introduced":"0"},{"last_affected":"1.8.1"}]}]}}],"versions":["jq-1.8.1","jq-1.8.0","jq-1.7.1","jq-1.7","jq-1.7rc2","jq-1.7rc1","jq-1.6","1.6rc2","jq-1.6rc1","jq-1.5rc2","