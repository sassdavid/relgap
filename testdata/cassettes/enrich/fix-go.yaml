        body: '{"id":"GO-2024-2887","summary":"Unexpected behavior from Is methods for IPv4-mapped IPv6 addresses in net/netip","details":"The various Is methods (IsPrivate, IsLoopback, etc) did not work as expected for IPv4-mapped IPv6 addresses, returning false for addresses which would return true in their traditional IPv4 forms.","aliases":["BIT-golang-2024-24790","CVE-2024-24790"],"modified":"2026-03-23T05:07:22.471505044Z","published":"2024-06-04T22:48:55Z","related":["CGA-234g-x4h3-6ppx"],"database_specific":{"url":"https://pkg.go.dev/vuln/GO-2024-2887","review_status":"REVIEWED"},"references":[{"type":"FIX","url":"https://go.dev/cl/590316"},{"type":"REPORT","url":"https://go.dev/issue/67680"},{"type":"WEB","url":"https://groups.google.com/g/golang-announce/c/XbxouI9gY7k/m/TuoGEhxIEwAJ"}],"affected":[{"package":{"name":"stdlib","ecosystem":"Go","purl":"pkg:golang/stdlib"},"ranges":[{"type":"SEMVER","events":[{"introduced":"0"},{"fixed":"1.21.11"},{"introduced":"1.22.0-0"},{"fixed":"1.22.4"}]}],"ecosystem_specific":{"imports":[{"symbols":["Addr.IsGlobalUnicast","Addr.IsInterfaceLocalMulticast","Addr.IsLinkLocalMulticast","Addr.IsLoopback","Addr.IsMulticast","Addr.IsPrivate"],"path":"net/netip"}]},"database_specific":{"source":"https://vuln.go.dev/ID/GO-2024-2887.json"}}],"schema_version":"1.7.3","credits":[{"name":"Enze Wang of Alioth (@zer0yu)"},{"name":"Jianjun Chen of Zhongguancun Lab (@chenjj)"}]}'
