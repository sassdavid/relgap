        body: '{"id":"GO-2026-4868","summary":"Missing bound checks can lead to memory corruption in safe Go in cmd/compile","details":"Arithmetic over induction variables in loops were not correctly checked for underflow or overflow. As a result, the compiler would allow for invalid indexing to occur at runtime, potentially leading to memory corruption.","aliases":["BIT-golang-2026-27143","CVE-2026-27143"],"modified":"2026-11-14T13:12:14.412102029Z","published":"2026-04-07T22:53:49Z","related":["RHSA-2026:10217","RHSA-2026:10219","RHSA-2026:10704","RHSA-2026:16021","RHSA-2026:16024","RHSA-2026:47712","RHSA-2026:47719","RHSA-2026:7291","RHSA-2026:7385"],"database_specific":{"url":"https://pkg.go.dev/vuln/GO-2026-4868","review_status":"REVIEWED"},"references":[{"type":"FIX","url":"https://go.dev/cl/763765"},{"type":"REPORT","url":"https://go.dev/issue/78333"},{"type":"WEB","url":"https://groups.google.com/g/golang-announce/c/0uYbvbPZRWU"}],"affected":[{"package":{"name":"toolchain","ecosystem":"Go","purl":"pkg:golang/toolchain"},"ranges":[{"type":"SEMVER","events":[{"introduced":"0"},{"fixed":"1.25.9"},{"introduced":"1.26.0-0"},{"fixed":"1.26.2"}]}],"ecosystem_specific":{"imports":[{"path":"cmd/compile"}]},"database_specific":{"source":"https://vuln.go.dev/ID/GO-2026-4868.json"}}],"schema_version":"1.7.5","credits":[{"name":"Jakub Ciolek - https://ciolek.dev/"}]}'
