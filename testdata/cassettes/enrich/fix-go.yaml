        body: '{"id":"GO-2025-3828","summary":"Unexpected command execution in untrusted VCS repositories in cmd/go","details":"The go command may execute unexpected commands when operating in untrusted VCS repositories.\n\nThis occurs when possibly dangerous VCS configuration is present in repositories. This can happen when a repository was fetched via one VCS (e.g. Git), but contains metadata for another VCS (e.g. Mercurial). Modules which are retrieved using the go command line, i.e. via \"go get\", are not affected.","aliases":["BIT-golang-2025-4674","CVE-2025-4674"],"modified":"2026-02-04T03:33:13.542630Z","published":"2025-07-29T21:02:00Z","related":["CGA-q5c4-jwmf-whc2","RHSA-2025:13935","RHSA-2025:13936","RHSA-2025:13939","RHSA-2025:13940","RHSA-2025:13941","RHSA-2025:14093"],"database_specific":{"review_status":"REVIEWED","url":"https://pkg.go.dev/vuln/GO-2025-3828"},"references":[{"type":"FIX","url":"https://go.dev/cl/686515"},{"type":"REPORT","url":"https://go.dev/issue/74380"},{"type":"WEB","url":"https://groups.google.com/g/golang-announce/c/gTNJnDXmn34"}],"affected":[{"package":{"name":"toolchain","ecosystem":"Go","purl":"pkg:golang/toolchain"},"ranges":[{"type":"SEMVER","events":[{"introduced":"0"},{"fixed":"1.23.11"},{"introduced":"1.24.0-0"},{"fixed":"1.24.5"}]}],"ecosystem_specific":{"imports":[{"path":"cmd/go"}]},"database_specific":{"source":"https://vuln.go.dev/ID/GO-2025-3828.json"}}],"schema_version":"1.7.3","credits":[{"name":"RyotaK (https://ryotak.net) of GMO Flatt Security Inc"}]}'
