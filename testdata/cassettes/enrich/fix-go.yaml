        proto: HTTP/2.0
        proto_major: 2
        proto_minor: 0
        content_length: 1731
        body: '{"id":"GO-2026-6856","summary":"Unexpected code execution and arbitrary file write via Clang -gen-* and GCC -gnat* flags in cgo in cmd/go","details":"When using Clang or GCC, building a malicious package that uses cgo could cause unexpected code execution at build time or write files to arbitrary directories via \"-gen-*\" or \"-gnat*\" flags in \"#cgo\" directives.\n\nThe \"-g*\" wildcard in the compiler and linker flag allowlists previously matched Clang''s two-argument \"-gen-cdb-fragment-path \u003cdir\u003e\" flag and GCC''s two-argument \"-gnatO \u003cfile\u003e\" flag, permitting compilation database fragments and sidecar output files to be written to arbitrary directories and desynchronizing flag argument parsing between the go command and the compiler driver so that subsequent arguments could be passed as unvalidated positional inputs to the linker.\n\n\"-gen-*\" and \"-gnat*\" flags are now disallowed in \"#cgo\" compiler and linker flags.","aliases":["CVE-2026-97035"],"modified":"2026-11-11T03:15:15.719402274Z","published":"2026-11-11T02:51:11Z","database_specific":{"url":"https://pkg.go.dev/vuln/GO-2026-6856","review_status":"REVIEWED"},"references":[{"type":"FIX","url":"https://go.dev/cl/862148"},{"type":"REPORT","url":"https://go.dev/issue/82575"},{"type":"WEB","url":"https://groups.google.com/g/golang-announce/c/iY8TY0wWgbM"}],"affected":[{"package":{"name":"toolchain","ecosystem":"Go","purl":"pkg:golang/toolchain"},"ranges":[{"type":"SEMVER","events":[{"introduced":"0"},{"fixed":"1.26.11"},{"introduced":"1.27.0-0"},{"fixed":"1.27.4"}]}],"ecosystem_specific":{"imports":[{"path":"cmd/go"}]},"database_specific":{"source":"https://vuln.go.dev/ID/GO-2026-6856.json"}}],"schema_version":"1.9.2"}'
