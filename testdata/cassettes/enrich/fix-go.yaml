        body: '{"id":"GO-2026-4864","summary":"TOCTOU permits root escape on Linux via Root.Chmod in os in internal/syscall/unix","details":"On Linux, if the target of Root.Chmod is replaced with a symlink while the chmod operation is in progress, Chmod can operate on the target of the symlink, even when the target lies outside the root.\n\nThe Linux fchmodat syscall silently ignores the AT_SYMLINK_NOFOLLOW flag, which Root.Chmod uses to avoid symlink traversal. Root.Chmod checks its target before acting and returns an error if the target is a symlink lying outside the root, so the impact is limited to cases where the target is replaced with a symlink between the check and operation.","aliases":["BIT-golang-2026-32282","CVE-2026-32282"],"modified":"2026-11-14T13:12:14.543537979Z","published":"2026-04-07T22:53:49Z","related":["RHSA-2026:10217","RHSA-2026:10219","RHSA-2026:10704","RHSA-2026:11507","RHSA-2026:11514","RHSA-2026:11704","RHSA-2026:11711","RHSA-2026:11712","RHSA-2026:11863","RHSA-2026:14200","RHSA-2026:15980","RHSA-2026:16021","RHSA-2026:16024","RHSA-2026:16101","RHSA-2026:16875","RHSA-2026:17075","RHSA-2026:17084","RHSA-2026:18027","RHSA-2026:18032","RHSA-2026:19132","RHSA-2026:19133","RHSA-2026:19134","RHSA-2026:19135","RHSA-2026:19136","RHSA-2026:19144","RHSA-2026:19156","RHSA-2026:19350","RHSA-2026:19351","RHSA-2026:19352","RHSA-2026:19353","RHSA-2026:19369","RHSA-2026:19450","RHSA-2026:19550","RHSA-2026:19714","RHSA-2026:19715","RHSA-2026:19719","RHSA-2026:19720","RHSA-2026:19721","RHSA-2026:19722","RHSA-2026:19750","RHSA-2026:19839","RHSA-2026:20556","RHSA-2026:22141","RHSA-2026:22326","RHSA-2026:22450","RHSA-2026:22709","RHSA-2026:22713","RHSA-2026:22714","RHSA-2026:22937","RHSA-2026:23228","RHSA-2026:24337","RHSA-2026:24716","RHSA-2026:24761","RHSA-2026:24762","RHSA-2026:25999","RHSA-2026:27076","RHSA-2026:27732","RHSA-2026:28038","RHSA-2026:28046","RHSA-2026:28047","RHSA-2026:28385","RHSA-2026:34365","RHSA-2026:34366","RHSA-2026:34368","RHSA-2026: