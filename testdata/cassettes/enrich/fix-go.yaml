        body: '{"id":"GO-2026-6809","summary":"Distrust compromised intermediate certificates in crypto/x509","details":"On most platforms, Go uses the given system root certificates. However, in some narrower cases, the system trust stores may not be updated without further action.\n\nTo defend against the narrower set of cases that may remain affected, a denylist was added in crypto/x509 to return an error when calling Verify with any of the known intermediate certificates that are no longer considered to be trustworthy.","aliases":["BIT-golang-2026-111943","CVE-2026-111943","RUSTSEC-2026-0381","RUSTSEC-2026-0382","RUSTSEC-2026-0383"],"modified":"2026-11-14T13:12:13.569550999Z","published":"2026-10-21T00:27:29Z","related":["RHBA-2026:89332","RHBA-2026:89649","RHSA-2026:85899","RHSA-2026:86029","RHSA-2026:86093","RHSA-2026:86196","RHSA-2026:86203","RHSA-2026:86733","RHSA-2026:86738","RHSA-2026:86776","RHSA-2026:86812","RHSA-2026:86839","RHSA-2026:86858","RHSA-2026:86863","RHSA-2026:86867","RHSA-2026:86886","RHSA-2026:86893","RHSA-2026:86906","RHSA-2026:86908","RHSA-2026:86914","RHSA-2026:86918","RHSA-2026:86922","RHSA-2026:86927","RHSA-2026:86928","RHSA-2026:86929","RHSA-2026:86930","RHSA-2026:86932","RHSA-2026:86934","RHSA-2026:86936","RHSA-2026:86938","RHSA-2026:86939","RHSA-2026:86943","RHSA-2026:86944","RHSA-2026:86946","RHSA-2026:86948","RHSA-2026:86949","RHSA-2026:86952","RHSA-2026:86956","RHSA-2026:86958","RHSA-2026:86960","RHSA-2026:86972","RHSA-2026:86973","RHSA-2026:86977","RHSA-2026:86978","RHSA-2026:86987","RHSA-2026:86990","RHSA-2026:86992","RHSA-2026:87008","RHSA-2026:87024","RHSA-2026:87028","RHSA-2026:87029","RHSA-2026:87040","RHSA-2026:87041","RHSA-2026:87042","RHSA-2026:87043","RHSA-2026:87053","RHSA-2026:87065","RHSA-2026:87075","RHSA-2026:87076","RHSA-2026:87092","RHSA-2026:87153","RHSA-2026:87732","RHSA-2026:87911","RHSA-2026:88188","RHSA-2026:88189","RHSA-2026:88262","RHSA-2026:88280","RHSA-2026:88316","RHSA-2026:88317","RHSA-2026:88332","RHSA