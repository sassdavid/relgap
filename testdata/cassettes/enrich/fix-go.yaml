        body: '{"id":"GO-2026-6601","summary":"Checksum bypass for golang.org/fips140 in cmd/go","details":"Previously, a user operating inside of a malicious Go project that defines a bogus golang.org/fips140 and operates a malicious GOMODPROXY the user chooses to connect to can serve an arbitrary module in its place.\n\nWe now unpack the trusted ziphash for the bundled golang.org/fips140 module and construct its entry in the GOMODCACHE such that it can be verified by the toolchain.","aliases":["BIT-golang-2026-94444","CVE-2026-94444"],"modified":"2026-11-14T13:12:13.661275021Z","published":"2026-10-08T22:31:09Z","related":["RHSA-2026:79715","RHSA-2026:79720","RHSA-2026:86093","RHSA-2026:86196","RHSA-2026:86203","RHSA-2026:87040","RHSA-2026:87041","RHSA-2026:87042","RHSA-2026:87043"],"database_specific":{"url":"https://pkg.go.dev/vuln/GO-2026-6601","review_status":"REVIEWED"},"references":[{"type":"FIX","url":"https://go.dev/cl/840685"},{"type":"REPORT","url":"https://go.dev/issue/81833"},{"type":"WEB","url":"https://groups.google.com/g/golang-announce/c/U2fTuyDJznI"}],"affected":[{"package":{"name":"toolchain","ecosystem":"Go","purl":"pkg:golang/toolchain"},"ranges":[{"type":"SEMVER","events":[{"introduced":"0"},{"fixed":"1.26.9"},{"introduced":"1.27.0-0"},{"fixed":"1.27.2"}]}],"ecosystem_specific":{"imports":[{"path":"cmd/go"}]},"database_specific":{"source":"https://vuln.go.dev/ID/GO-2026-6601.json"}}],"schema_version":"1.9.0"}'
