        body: '{"id":"GO-2026-4403","summary":"Improper access to parent directory of root in os","details":"It was possible to improperly access the parent directory of an os.Root by opening a filename ending in \"../\". For example, Root.Open(\"../\") would open the parent directory of the Root. This escape only permits opening the parent directory itself, not ancestors of the parent or files contained within the parent.","aliases":["BIT-golang-2025-22873","CVE-2025-22873"],"modified":"2026-05-15T10:59:22.074063204Z","published":"2026-02-04T22:42:26Z","related":["CGA-hm3h-gpf5-pcpj","RHSA-2026:7291","RHSA-2026:7385"],"database_specific":{"url":"https://pkg.go.dev/vuln/GO-2026-4403","review_status":"REVIEWED"},"references":[{"type":"FIX","url":"https://go.dev/cl/670036"},{"type":"REPORT","url":"https://go.dev/issue/73555"},{"type":"WEB","url":"https://groups.google.com/g/golang-announce/c/UZoIkUT367A/m/5WDxKizJAQAJ"}],"affected":[{"package":{"name":"stdlib","ecosystem":"Go","purl":"pkg:golang/stdlib"},"ranges":[{"type":"SEMVER","events":[{"introduced":"0"},{"fixed":"1.23.9"},{"introduced":"1.24.0-0"},{"fixed":"1.24.3"}]}],"ecosystem_specific":{"imports":[{"symbols":["checkPathEscapesInternal","doInRoot","splitPathInRoot"],"path":"os"}]},"database_specific":{"source":"https://vuln.go.dev/ID/GO-2026-4403.json"}}],"schema_version":"1.7.3","credits":[{"name":"Dan Sebastian Thrane of SDU eScience Center"}]}'
