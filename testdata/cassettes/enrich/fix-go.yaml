        body: '{"id":"GHSA-qxp5-gwg8-xv66","summary":"HTTP Proxy bypass using IPv6 Zone IDs in golang.org/x/net","details":"Matching of hosts against proxy patterns can improperly treat an IPv6 zone ID as a hostname component. For example, when the NO_PROXY environment variable is set to \"*.example.com\", a request to \"[::1%25.example.com]:80` will incorrectly match and not be proxied.","aliases":["CVE-2025-22870","GO-2025-3503"],"modified":"2026-09-10T03:50:23.280114085Z","published":"2025-03-12T22:06:40Z","database_specific":{"severity":"MODERATE","github_reviewed":true,"github_reviewed_at":"2025-03-12T22:06:40Z","nvd_published_at":"2025-03-12T19:15:38Z","cwe_ids":["CWE-115","CWE-20"]},"references":[{"type":"ADVISORY","url":"https://nvd.nist.gov/vuln/detail/CVE-2025-22870"},{"type":"PACKAGE","url":"https://go-review.googlesource.com/q/project:net"},{"type":"WEB","url":"https://go.dev/cl/654697"},{"type":"WEB","url":"https://go.dev/issue/71984"},{"type":"WEB","url":"https://groups.google.com/g/golang-announce/c/4t3lzH3I0eI/m/b42ImqrBAQAJ"},{"type":"WEB","url":"https://pkg.go.dev/vuln/GO-2025-3503"},{"type":"WEB","url":"https://security.netapp.com/advisory/ntap-20250509-0007"},{"type":"WEB","url":"http://www.openwall.com/lists/oss-security/2025/03/07/2"}],"affected":[{"package":{"name":"golang.org/x/net","ecosystem":"Go","purl":"pkg:golang/golang.org/x/net"},"ranges":[{"type":"SEMVER","events":[{"introduced":"0"},{"fixed":"0.36.0"}]}],"database_specific":{"source":"https://github.com/github/advisory-database/blob/main/advisories/github-reviewed/2025/03/GHSA-qxp5-gwg8-xv66/GHSA-qxp5-gwg8-xv66.json"}}],"schema_version":"1.9.0","severity":[{"type":"CVSS_V3","score":"CVSS:3.1/AV:L/AC:L/PR:L/UI:N/S:U/C:L/I:N/A:L"}]}'
