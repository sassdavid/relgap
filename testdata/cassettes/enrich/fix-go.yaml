        content_length: 3561
        body: '{"id":"GHSA-4v7x-pqxf-cx7m","summary":"net/http, x/net/http2: close connections when receiving too many headers","details":"An attacker may cause an HTTP/2 endpoint to read arbitrary amounts of header data by sending an excessive number of CONTINUATION frames. Maintaining HPACK state requires parsing and processing all HEADERS and CONTINUATION frames on a connection. When a request''s headers exceed MaxHeaderBytes, no memory is allocated to store the excess headers, but they are still parsed. This permits an attacker to cause an HTTP/2 endpoint to read arbitrary amounts of header data, all associated with a request which is going to be rejected. These headers can include Huffman-encoded data which is significantly more expensive for the receiver to decode than for an attacker to send. The fix sets a limit on the amount of excess header frames we will process before closing a connection.","aliases":["BIT-golang-2023-45288","CVE-2023-45288","GO-2024-2687"],"modified":"2026-09-10T03:50:11.106451165Z","published":"2024-04-04T21:30:32Z","database_specific":{"cwe_ids":["CWE-400"],"severity":"MODERATE","github_reviewed":true,"github_reviewed_at":"2024-04-04T23:02:57Z","nvd_published_at":"2024-04-04T21:15:16Z"},"references":[{"type":"ADVISORY","url":"https://nvd.nist.gov/vuln/detail/CVE-2023-45288"},{"type":"WEB","url":"https://go.dev/cl/576155"},{"type":"WEB","url":"https://go.dev/issue/65051"},{"type":"WEB","url":"https://groups.google.com/g/golang-announce/c/YgW0sx8mN3M"},{"type":"WEB","url":"https://lists.fedoraproject.org/archives/list/package-announce@lists.fedoraproject.org/message/QRYFHIQ6XRKRYBI2F5UESH67BJBQXUPT"},{"type":"WEB","url":"https://nowotarski.info/http2-continuation-flood-technical-details"},{"type":"WEB","url":"https://pkg.go.dev/vuln/GO-2024-2687"},{"type":"WEB","url":"https://security.netapp.com/advisory/ntap-20240419-0009"},{"type":"WEB","url":"https://www.kb.cert.org/vuls/id/421644"},{"type":"WEB","url":"http://www.openwall.com/lists/