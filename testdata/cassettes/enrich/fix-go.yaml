        body: '{"id":"GO-2024-2609","summary":"Comments in display names are incorrectly handled in net/mail","details":"The ParseAddressList function incorrectly handles comments (text within parentheses) within display names. Since this is a misalignment with conforming address parsers, it can result in different trust decisions being made by programs using different parsers.","aliases":["BIT-golang-2024-24784","CVE-2024-24784"],"modified":"2026-02-04T04:37:13.773873Z","published":"2024-03-05T22:15:04Z","related":["CGA-wp53-crgr-fr7w"],"database_specific":{"review_status":"REVIEWED","url":"https://pkg.go.dev/vuln/GO-2024-2609"},"references":[{"type":"REPORT","url":"https://go.dev/issue/65083"},{"type":"FIX","url":"https://go.dev/cl/555596"},{"type":"WEB","url":"https://groups.google.com/g/golang-announce/c/5pwGVUPoMbg"}],"affected":[{"package":{"name":"stdlib","ecosystem":"Go","purl":"pkg:golang/stdlib"},"ranges":[{"type":"SEMVER","events":[{"introduced":"0"},{"fixed":"1.21.8"},{"introduced":"1.22.0-0"},{"fixed":"1.22.1"}]}],"ecosystem_specific":{"imports":[{"path":"net/mail","symbols":["Address.String","AddressParser.Parse","AddressParser.ParseList","Header.AddressList","ParseAddress","ParseAddressList","addrParser.consumeGroupList","addrParser.consumePhrase","isAtext"]}]},"database_specific":{"source":"https://vuln.go.dev/ID/GO-2024-2609.json"}}],"schema_version":"1.7.3","credits":[{"name":"Juho Nurminen of Mattermost"},{"name":"Slonser (https://github.com/Slonser)"}]}'
