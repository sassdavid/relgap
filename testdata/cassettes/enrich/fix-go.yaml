        body: '{"id":"GO-2024-2600","summary":"Incorrect forwarding of sensitive headers and cookies on HTTP redirect in net/http","details":"When following an HTTP redirect to a domain which is not a subdomain match or exact match of the initial domain, an http.Client does not forward sensitive headers such as \"Authorization\" or \"Cookie\". For example, a redirect from foo.com to www.foo.com will forward the Authorization header, but a redirect to bar.com will not.\n\nA maliciously crafted HTTP redirect could cause sensitive headers to be unexpectedly forwarded.","aliases":["BIT-golang-2023-45289","CVE-2023-45289"],"modified":"2026-02-04T02:34:41.672789Z","published":"2024-03-05T22:15:02Z","related":["CGA-3j5f-rf5r-8cq9"],"database_specific":{"review_status":"REVIEWED","url":"https://pkg.go.dev/vuln/GO-2024-2600"},"references":[{"type":"REPORT","url":"https://go.dev/issue/65065"},{"type":"FIX","url":"https://go.dev/cl/569340"},{"type":"WEB","url":"https://groups.google.com/g/golang-announce/c/5pwGVUPoMbg"}],"affected":[{"package":{"name":"stdlib","ecosystem":"Go","purl":"pkg:golang/stdlib"},"ranges":[{"type":"SEMVER","events":[{"introduced":"0"},{"fixed":"1.21.8"},{"introduced":"1.22.0-0"},{"fixed":"1.22.1"}]}],"ecosystem_specific":{"imports":[{"path":"net/http","symbols":["Client.Do","Client.Get","Client.Head","Client.Post","Client.PostForm","Get","Head","Post","PostForm","isDomainOrSubdomain"]},{"path":"net/http/cookiejar","symbols":["Jar.Cookies","Jar.SetCookies","isIP"]}]},"database_specific":{"source":"https://vuln.go.dev/ID/GO-2024-2600.json"}}],"schema_version":"1.7.3","credits":[{"name":"Juho Nurminen of Mattermost"}]}'
