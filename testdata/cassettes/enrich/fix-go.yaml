        body: '{"id":"GO-2026-4976","summary":"ReverseProxy forwards queries with more than urlmaxqueryparams parameters in net/http/httputil","details":"ReverseProxy can forward queries containing parameters not visible to Rewrite functions.\n\nWhen used with a Rewrite function, or a Director function which parses query parameters, ReverseProxy sanitizes the forwarded request to remove query parameters which are not parsed by url.ParseQuery. ReverseProxy does not take ParseQuery''s limit on the total number of query parameters (controlled by GODEBUG=urlmaxqueryparams=N) into account. This can permit ReverseProxy to forward a request containing a query parameter that is not visible to the Rewrite function.\n\nFor example, the query \"a1=x&a2=x&...&a10000=x&hidden=y\" can forward the parameter \"hidden=y\" while hiding it from the proxy''s Rewrite function.","aliases":["BIT-golang-2026-39825","CVE-2026-39825"],"modified":"2026-11-14T13:12:14.270117517Z","published":"2026-05-07T19:21:40Z","related":["RHSA-2026:22112","RHSA-2026:22120","RHSA-2026:22121"],"database_specific":{"url":"https://pkg.go.dev/vuln/GO-2026-4976","review_status":"REVIEWED"},"references":[{"type":"FIX","url":"https://go.dev/cl/770541"},{"type":"REPORT","url":"https://go.dev/issue/78948"},{"type":"WEB","url":"https://groups.google.com/g/golang-announce/c/qcCIEXso47M"}],"affected":[{"package":{"name":"stdlib","ecosystem":"Go","purl":"pkg:golang/stdlib"},"ranges":[{"type":"SEMVER","events":[{"introduced":"0"},{"fixed":"1.25.10"},{"introduced":"1.26.0-0"},{"fixed":"1.26.3"}]}],"ecosystem_specific":{"imports":[{"path":"net/http/httputil","symbols":["ReverseProxy.ServeHTTP","cleanQueryParams"]}]},"database_specific":{"source":"https://vuln.go.dev/ID/GO-2026-4976.json"}}],"schema_version":"1.7.5"}'
