        body: '{"id":"GO-2026-4865","summary":"JsBraceDepth Context Tracking Bugs (XSS) in html/template","details":"Context was not properly tracked across template branches for JS template literals, leading to possibly incorrect escaping of content when branches were used. Additionally template actions within JS template literals did not properly track the brace depth, leading to incorrect escaping being applied.\n\nThese issues could cause actions within JS template literals to be incorrectly or improperly escaped, leading to XSS vulnerabilities.","aliases":["BIT-golang-2026-32289","CVE-2026-32289"],"modified":"2026-10-07T10:41:46.025548889Z","published":"2026-04-07T22:53:49Z","related":["RHSA-2026:10217","RHSA-2026:10219","RHSA-2026:22112","RHSA-2026:7291","RHSA-2026:7385"],"database_specific":{"review_status":"REVIEWED","url":"https://pkg.go.dev/vuln/GO-2026-4865"},"references":[{"type":"FIX","url":"https://go.dev/cl/763762"},{"type":"REPORT","url":"https://go.dev/issue/78331"},{"type":"WEB","url":"https://groups.google.com/g/golang-announce/c/0uYbvbPZRWU"}],"affected":[{"package":{"name":"stdlib","ecosystem":"Go","purl":"pkg:golang/stdlib"},"ranges":[{"type":"SEMVER","events":[{"introduced":"0"},{"fixed":"1.25.9"},{"introduced":"1.26.0-0"},{"fixed":"1.26.2"}]}],"ecosystem_specific":{"imports":[{"symbols":["Error.Error","HTMLEscaper","JSEscape","JSEscapeString","JSEscaper","ParseFS","ParseFiles","ParseGlob","Template.AddParseTree","Template.Clone","Template.DefinedTemplates","Template.Execute","Template.ExecuteTemplate","Template.Funcs","Template.Parse","Template.ParseFS","Template.ParseFiles","Template.ParseGlob","URLQueryEscaper","context.String","context.mangle","escaper.escapeBranch"],"path":"html/template"}]},"database_specific":{"source":"https://vuln.go.dev/ID/GO-2026-4865.json"}}],"schema_version":"1.7.5"}'
