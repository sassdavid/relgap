        body: '{"id":"GHSA-g9pc-8g42-g6vq","summary":"RoadRunner is at risk of HTTP Request/Response Smuggling through vulnerable dependency","details":"The net/http package dependency used by RoadRunner improperly accepts a bare LF as a line terminator in chunked data chunk-size lines. This can permit request smuggling if a net/http server is used in conjunction with a server that incorrectly accepts a bare LF as part of a chunk-ext.","aliases":["BIT-golang-2025-22871","CVE-2025-22871","GO-2025-3563"],"modified":"2026-09-10T03:50:23.911296198Z","published":"2025-04-08T21:31:40Z","database_specific":{"cwe_ids":["CWE-1395","CWE-444"],"severity":"CRITICAL","github_reviewed":true,"github_reviewed_at":"2025-10-24T20:57:40Z","nvd_published_at":"2025-04-08T20:15:20Z"},"references":[{"type":"ADVISORY","url":"https://nvd.nist.gov/vuln/detail/CVE-2025-22871"},{"type":"WEB","url":"https://github.com/roadrunner-server/roadrunner/issues/2166"},{"type":"WEB","url":"https://github.com/roadrunner-server/roadrunner/commit/f269279ee87d0b88127741cad1042389af7605fa"},{"type":"WEB","url":"https://cert-portal.siemens.com/productcert/html/ssa-783943.html"},{"type":"PACKAGE","url":"https://github.com/roadrunner-server/roadrunner"},{"type":"WEB","url":"https://github.com/roadrunner-server/roadrunner/releases/tag/v2025.1.0"},{"type":"WEB","url":"https://go.dev/cl/652998"},{"type":"WEB","url":"https://go.dev/issue/71988"},{"type":"WEB","url":"https://groups.google.com/g/golang-announce/c/Y2uBTVKjBQk"},{"type":"WEB","url":"https://pkg.go.dev/vuln/GO-2025-3563"},{"type":"WEB","url":"http://www.openwall.com/lists/oss-security/2025/04/04/4"}],"affected":[{"package":{"name":"spiral/roadrunner","ecosystem":"Packagist","purl":"pkg:composer/spiral/roadrunner"},"ranges":[{"type":"ECOSYSTEM","events":[{"introduced":"0"},{"fixed":"2025.1.0"}]}],"versions":["v0.9.0","v1.0.0","v1.0.1","v1.0.2","v1.0.3","v1.0.5","v1.1.0","v1.1.1","v1.2.0","v1.2.1","v1.2.2","v1.2.3","v1.2.4","v1.2.5","v1.2.6","v1.2.7","v1.