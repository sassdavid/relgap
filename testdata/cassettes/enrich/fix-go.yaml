        body: '{"id":"GO-2026-4603","summary":"URLs in meta content attribute actions are not escaped in html/template","details":"Actions which insert URLs into the content attribute of HTML meta tags are not escaped. This can allow XSS if the meta tag also has an http-equiv attribute with the value \"refresh\".\n\nA new GODEBUG setting has been added, htmlmetacontenturlescape, which can be used to disable escaping URLs in actions in the meta content attribute which follow \"url=\" by setting htmlmetacontenturlescape=0.","aliases":["BIT-golang-2026-27142","CVE-2026-27142"],"modified":"2026-05-15T10:59:23.946663160Z","published":"2026-03-06T21:03:42Z","related":["CGA-g36f-884r-6gj3","RHSA-2026:5192","RHSA-2026:7291"],"database_specific":{"review_status":"REVIEWED","url":"https://pkg.go.dev/vuln/GO-2026-4603"},"references":[{"type":"WEB","url":"https://groups.google.com/g/golang-announce/c/EdhZqrQ98hk"},{"type":"REPORT","url":"https://go.dev/issue/77954"},{"type":"FIX","url":"https://go.dev/cl/752081"}],"affected":[{"package":{"name":"stdlib","ecosystem":"Go","purl":"pkg:golang/stdlib"},"ranges":[{"type":"SEMVER","events":[{"introduced":"0"},{"fixed":"1.25.8"},{"introduced":"1.26.0-0"},{"fixed":"1.26.1"}]}],"ecosystem_specific":{"imports":[{"path":"html/template","symbols":["Template.Execute","Template.ExecuteTemplate","escaper.escapeAction","tTag"]}]},"database_specific":{"source":"https://vuln.go.dev/ID/GO-2026-4603.json"}}],"schema_version":"1.7.5"}'
