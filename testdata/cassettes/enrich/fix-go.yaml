        body: '{"id":"GO-2025-4010","summary":"Insufficient validation of bracketed IPv6 hostnames in net/url","details":"The Parse function permits values other than IPv6 addresses to be included in square brackets within the host component of a URL. RFC 3986 permits IPv6 addresses to be included within the host component, enclosed within square brackets. For example: \"http://[::1]/\". IPv4 addresses and hostnames must not appear within square brackets. Parse did not enforce this requirement.","aliases":["BIT-golang-2025-47912","CVE-2025-47912"],"modified":"2026-05-15T10:59:24.305821208Z","published":"2025-10-29T21:49:58Z","related":["CGA-crxx-5xpf-m6mv","RHSA-2026:7291","RHSA-2026:7385"],"database_specific":{"review_status":"REVIEWED","url":"https://pkg.go.dev/vuln/GO-2025-4010"},"references":[{"type":"REPORT","url":"https://go.dev/issue/75678"},{"type":"FIX","url":"https://go.dev/cl/709857"},{"type":"WEB","url":"https://groups.google.com/g/golang-announce/c/4Emdl2iQ_bI"}],"affected":[{"package":{"name":"stdlib","ecosystem":"Go","purl":"pkg:golang/stdlib"},"ranges":[{"type":"SEMVER","events":[{"introduced":"0"},{"fixed":"1.24.8"},{"introduced":"1.25.0"},{"fixed":"1.25.2"}]}],"ecosystem_specific":{"imports":[{"symbols":["JoinPath","Parse","ParseRequestURI","URL.Parse","URL.UnmarshalBinary","parseHost"],"path":"net/url"}]},"database_specific":{"source":"https://vuln.go.dev/ID/GO-2025-4010.json"}}],"schema_version":"1.7.3","credits":[{"name":"Enze Wang, Jingcheng Yang and Zehui Miao of Tsinghua University"}]}'
