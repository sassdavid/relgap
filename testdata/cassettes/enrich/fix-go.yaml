        body: '{"id":"GO-2026-4337","summary":"Unexpected session resumption in crypto/tls","details":"During session resumption in crypto/tls, if the underlying Config has its ClientCAs or RootCAs fields mutated between the initial handshake and the resumed handshake, the resumed handshake may succeed when it should have failed. This may happen when a user calls Config.Clone and mutates the returned Config, or uses Config.GetConfigForClient. This can cause a client to resume a session with a server that it would not have resumed with during the initial handshake, or cause a server to resume a session with a client that it would not have resumed with during the initial handshake.","aliases":["BIT-golang-2025-68121","CVE-2025-68121"],"modified":"2026-11-14T13:12:13.857383242Z","published":"2026-02-05T17:23:09Z","related":["RHSA-2026:11749","RHSA-2026:12028","RHSA-2026:12029","RHSA-2026:12030","RHSA-2026:12031","RHSA-2026:12032","RHSA-2026:12033","RHSA-2026:14868","RHSA-2026:16102","RHSA-2026:16696","RHSA-2026:17040","RHSA-2026:17084","RHSA-2026:17446","RHSA-2026:17595","RHSA-2026:17686","RHSA-2026:18913","RHSA-2026:19013","RHSA-2026:19475","RHSA-2026:19634","RHSA-2026:22141","RHSA-2026:22450","RHSA-2026:22714","RHSA-2026:22937","RHSA-2026:23228","RHSA-2026:25248","RHSA-2026:25250","RHSA-2026:25251","RHSA-2026:25252","RHSA-2026:25253","RHSA-2026:26527","RHSA-2026:26541","RHSA-2026:2706","RHSA-2026:2708","RHSA-2026:2709","RHSA-2026:28047","RHSA-2026:28886","RHSA-2026:28961","RHSA-2026:2914","RHSA-2026:2920","RHSA-2026:3035","RHSA-2026:3040","RHSA-2026:3092","RHSA-2026:3187","RHSA-2026:3188","RHSA-2026:3192","RHSA-2026:3193","RHSA-2026:3291","RHSA-2026:3297","RHSA-2026:3298","RHSA-2026:3336","RHSA-2026:3337","RHSA-2026:3340","RHSA-2026:3341","RHSA-2026:3343","RHSA-2026:3506","RHSA-2026:3752","RHSA-2026:3753","RHSA-2026:3816","RHSA-2026:3817","RHSA-2026:3831","RHSA-2026:3833","RHSA-2026:3839","RHSA-2026:3840","RHSA-2026:3842","RHSA-2026:3843","RHSA-2026:3864","RHSA-2026: