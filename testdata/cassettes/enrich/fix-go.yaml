        body: '{"id":"GO-2026-6599","summary":"Reset context tracking on consecutive template expressions in html/template","details":"When a JavaScript template literal contains consecutive expressions, the context tracking state was not properly reset upon entering a new expression.\n\nWe now ensure that template-literal expression entries correctly reset context variables so all subsequent regular expression literals are accurately recognized and escaped.","aliases":["BIT-golang-2026-94448","CVE-2026-94448"],"modified":"2026-11-14T13:12:14.032615779Z","published":"2026-10-08T22:31:09Z","related":["RHSA-2026:86093","RHSA-2026:86196","RHSA-2026:86203","RHSA-2026:87040","RHSA-2026:87041","RHSA-2026:87042","RHSA-2026:87043"],"database_specific":{"url":"https://pkg.go.dev/vuln/GO-2026-6599","review_status":"REVIEWED"},"references":[{"type":"FIX","url":"https://go.dev/cl/839866"},{"type":"REPORT","url":"https://go.dev/issue/81821"},{"type":"WEB","url":"https://groups.google.com/g/golang-announce/c/U2fTuyDJznI"}],"affected":[{"package":{"name":"stdlib","ecosystem":"Go","purl":"pkg:golang/stdlib"},"ranges":[{"type":"SEMVER","events":[{"introduced":"0"},{"fixed":"1.26.9"},{"introduced":"1.27.0-0"},{"fixed":"1.27.2"}]}],"ecosystem_specific":{"imports":[{"symbols":["Template.Execute","Template.ExecuteTemplate","tJSTmpl"],"path":"html/template"}]},"database_specific":{"source":"https://vuln.go.dev/ID/GO-2026-6599.json"}}],"schema_version":"1.9.0"}'
