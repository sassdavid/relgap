        body: '{"id":"GO-2025-3447","summary":"Timing sidechannel for P-256 on ppc64le in crypto/internal/nistec","details":"Due to the usage of a variable time instruction in the assembly implementation of an internal function, a small number of bits of secret scalars are leaked on the ppc64le architecture. Due to the way this function is used, we do not believe this leakage is enough to allow recovery of the private key when P-256 is used in any well known protocols.","aliases":["BIT-golang-2025-22866","CVE-2025-22866"],"modified":"2026-11-14T13:12:14.991407873Z","published":"2025-02-06T16:38:14Z","database_specific":{"url":"https://pkg.go.dev/vuln/GO-2025-3447","review_status":"REVIEWED"},"references":[{"type":"FIX","url":"https://go.dev/cl/643735"},{"type":"REPORT","url":"https://go.dev/issue/71383"},{"type":"WEB","url":"https://groups.google.com/g/golang-announce/c/xU1ZCHUZw3k"}],"affected":[{"package":{"name":"stdlib","ecosystem":"Go","purl":"pkg:golang/stdlib"},"ranges":[{"type":"SEMVER","events":[{"introduced":"0"},{"fixed":"1.22.12"},{"introduced":"1.23.0-0"},{"fixed":"1.23.6"},{"introduced":"1.24.0-0"},{"fixed":"1.24.0-rc.3"}]}],"ecosystem_specific":{"imports":[{"path":"crypto/internal/nistec","symbols":["P256Point.ScalarBaseMult","P256Point.ScalarMult","P256Point.SetBytes","p256NegCond"],"goarch":["ppc64le"]}]},"database_specific":{"source":"https://vuln.go.dev/ID/GO-2025-3447.json"}}],"schema_version":"1.7.5"}'
