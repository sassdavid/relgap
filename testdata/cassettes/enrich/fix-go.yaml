        body: '{"id":"GO-2024-2599","summary":"Memory exhaustion in multipart form parsing in net/textproto and net/http","details":"When parsing a multipart form (either explicitly with Request.ParseMultipartForm or implicitly with Request.FormValue, Request.PostFormValue, or Request.FormFile), limits on the total size of the parsed form were not applied to the memory consumed while reading a single form line. This permits a maliciously crafted input containing very long lines to cause allocation of arbitrarily large amounts of memory, potentially leading to memory exhaustion.\n\nWith fix, the ParseMultipartForm function now correctly limits the maximum size of form lines.","aliases":["BIT-golang-2023-45290","CVE-2023-45290"],"modified":"2026-02-04T02:21:09.533216Z","published":"2024-03-05T22:15:00Z","related":["CGA-5mf6-fhc2-jwpm","RHSA-2024:0045","RHSA-2024:2562","RHSA-2024:2724","RHSA-2024:3259","RHSA-2024:3346","RHSA-2024:3781","RHSA-2024:3826","RHSA-2024:3827","RHSA-2024:3830","RHSA-2024:3831","RHSA-2024:4023","RHSA-2024:4893","RHSA-2024:5075","RHSA-2024:5077","RHSA-2024:5202","RHSA-2024:5258","RHSA-2024:5436","RHSA-2024:5442","RHSA-2024:5446","RHSA-2024:5810","RHSA-2024:6969","RHSA-2024:8038","RHSA-2024:9135"],"database_specific":{"url":"https://pkg.go.dev/vuln/GO-2024-2599","review_status":"REVIEWED"},"references":[{"type":"REPORT","url":"https://go.dev/issue/65383"},{"type":"FIX","url":"https://go.dev/cl/569341"},{"type":"WEB","url":"https://groups.google.com/g/golang-announce/c/5pwGVUPoMbg"}],"affected":[{"package":{"name":"stdlib","ecosystem":"Go","purl":"pkg:golang/stdlib"},"ranges":[{"type":"SEMVER","events":[{"introduced":"0"},{"fixed":"1.21.8"},{"introduced":"1.22.0-0"},{"fixed":"1.22.1"}]}],"ecosystem_specific":{"imports":[{"path":"net/textproto","symbols":["Reader.ReadCodeLine","Reader.ReadContinuedLine","Reader.ReadContinuedLineBytes","Reader.ReadDotLines","Reader.ReadLine","Reader.ReadLineBytes","Reader.ReadMIMEHeader","Reader.ReadResponse","Reade