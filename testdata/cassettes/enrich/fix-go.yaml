        body: '{"id":"GO-2026-4602","summary":"FileInfo can escape from a Root in os","details":"On Unix platforms, when listing the contents of a directory using File.ReadDir or File.Readdir the returned FileInfo could reference a file outside of the Root in which the File was opened.\n\nThe impact of this escape is limited to reading metadata provided by lstat from arbitrary locations on the filesystem without permitting reading or writing files outside the root.","aliases":["BIT-golang-2026-27139","CVE-2026-27139"],"modified":"2026-05-15T10:59:23.640277156Z","published":"2026-03-06T21:03:42Z","related":["CGA-6q67-6c3m-gmpw","RHSA-2026:7291","RHSA-2026:7385"],"database_specific":{"url":"https://pkg.go.dev/vuln/GO-2026-4602","review_status":"REVIEWED"},"references":[{"type":"WEB","url":"https://groups.google.com/g/golang-announce/c/EdhZqrQ98hk"},{"type":"REPORT","url":"https://go.dev/issue/77827"},{"type":"FIX","url":"https://go.dev/cl/749480"}],"affected":[{"package":{"name":"stdlib","ecosystem":"Go","purl":"pkg:golang/stdlib"},"ranges":[{"type":"SEMVER","events":[{"introduced":"0"},{"fixed":"1.25.8"},{"introduced":"1.26.0-0"},{"fixed":"1.26.1"}]}],"ecosystem_specific":{"imports":[{"path":"os","symbols":["File.ReadDir","File.Readdir","ReadDir","dirFS.ReadDir","rootFS.ReadDir"]}]},"database_specific":{"source":"https://vuln.go.dev/ID/GO-2026-4602.json"}}],"schema_version":"1.7.3","credits":[{"name":"Miloslav Trmač of Red Hat"}]}'
