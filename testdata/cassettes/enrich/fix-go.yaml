        body: '{"id":"GO-2026-6610","summary":"HTTP/2 transport accepts malformed framing-related headers in net/http","details":"Historically, we have been rather lax about malformed framing-related headers in our HTTP/2 implementation, as they cannot interfere with HTTP/2 framing. However, this makes it possible for our HTTP/2 implementation to forward responses containing such headers to an HTTP/1 client when acting as a reverse proxy. If the HTTP/1 client also does not behave strictly enough, this can result in response smuggling.","aliases":["BIT-golang-2026-78660","CVE-2026-78660"],"modified":"2026-11-14T13:12:14.502576208Z","published":"2026-10-08T22:31:09Z","related":["RHSA-2026:86093","RHSA-2026:86196","RHSA-2026:86203","RHSA-2026:87040","RHSA-2026:87041","RHSA-2026:87042","RHSA-2026:87043"],"database_specific":{"url":"https://pkg.go.dev/vuln/GO-2026-6610","review_status":"REVIEWED"},"references":[{"type":"FIX","url":"https://go.dev/cl/835145"},{"type":"FIX","url":"https://go.dev/cl/836385"},{"type":"REPORT","url":"https://go.dev/issue/81115"},{"type":"WEB","url":"https://groups.google.com/g/golang-announce/c/U2fTuyDJznI"}],"affected":[{"package":{"name":"stdlib","ecosystem":"Go","purl":"pkg:golang/stdlib"},"ranges":[{"type":"SEMVER","events":[{"introduced":"0"},{"fixed":"1.26.9"}]}],"ecosystem_specific":{"imports":[{"path":"net/http","symbols":["Client.CloseIdleConnections","Client.Do","Client.Get","Client.Head","Client.Post","Client.PostForm","ClientConn.Close","ClientConn.RoundTrip","Get","Head","Post","PostForm","Transport.CloseIdleConnections","Transport.NewClientConn","Transport.RoundTrip","http1ClientConn.Close","http1ClientConn.RoundTrip","http2Transport.NewClientConn","http2Transport.RoundTrip","http2Transport.RoundTripOpt","http2clientConnPool.GetClientConn","http2clientConnReadLoop.handleResponse","http2noDialClientConnPool.GetClientConn","http2noDialH2RoundTripper.NewClientConn","http2noDialH2RoundTripper.RoundTrip","http2unencryptedTransport.Ro