        body: '{"id":"GO-2025-4175","summary":"Improper application of excluded DNS name constraints when verifying wildcard names in crypto/x509","details":"An excluded subdomain constraint in a certificate chain does not restrict the usage of wildcard SANs in the leaf certificate. For example a constraint that excludes the subdomain test.example.com does not prevent a leaf certificate from claiming the SAN *.example.com.","aliases":["BIT-golang-2025-61727","CVE-2025-61727"],"modified":"2026-05-15T10:59:24.063040444Z","published":"2025-12-02T20:55:55Z","related":["CGA-h5w2-2hch-h662","RHSA-2026:7070","RHSA-2026:7291","RHSA-2026:7385"],"database_specific":{"review_status":"REVIEWED","url":"https://pkg.go.dev/vuln/GO-2025-4175"},"references":[{"type":"FIX","url":"https://go.dev/cl/723900"},{"type":"REPORT","url":"https://go.dev/issue/76442"},{"type":"WEB","url":"https://groups.google.com/g/golang-announce/c/8FJoBkPddm4"}],"affected":[{"package":{"name":"stdlib","ecosystem":"Go","purl":"pkg:golang/stdlib"},"ranges":[{"type":"SEMVER","events":[{"introduced":"0"},{"fixed":"1.24.11"},{"introduced":"1.25.0"},{"fixed":"1.25.5"}]}],"ecosystem_specific":{"imports":[{"path":"crypto/x509","symbols":["Certificate.Verify"]}]},"database_specific":{"source":"https://vuln.go.dev/ID/GO-2025-4175.json"}}],"schema_version":"1.7.3"}'
