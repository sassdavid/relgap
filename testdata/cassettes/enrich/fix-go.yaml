        content_length: 1405
        body: '{"id":"GO-2026-6218","summary":"Avoid quadratic complexity in resolvePath in net/url","details":"Previously, resolving relative paths containing parent directory (''..'') segments performed string conversions and buffer rewrites on each step, resulting in quadratic time complexity and high memory allocation overhead.\n\nNow, path resolution operates on a byte buffer using index-based backtracking for ''..'' segments, eliminating the quadratic time complexity and significantly reducing memory allocations.","aliases":["BIT-golang-2026-56860","CVE-2026-56860"],"modified":"2026-11-14T13:12:14.763932585Z","published":"2026-08-13T21:43:54Z","database_specific":{"review_status":"REVIEWED","url":"https://pkg.go.dev/vuln/GO-2026-6218"},"references":[{"type":"FIX","url":"https://go.dev/cl/803681"},{"type":"REPORT","url":"https://go.dev/issue/80494"},{"type":"WEB","url":"https://groups.google.com/g/golang-announce/c/94pEornpRlI"}],"affected":[{"package":{"name":"stdlib","ecosystem":"Go","purl":"pkg:golang/stdlib"},"ranges":[{"type":"SEMVER","events":[{"introduced":"0"},{"fixed":"1.25.13"},{"introduced":"1.26.0-0"},{"fixed":"1.26.6"},{"introduced":"1.27.0-0"},{"fixed":"1.27.0-rc.3"}]}],"ecosystem_specific":{"imports":[{"path":"net/url","symbols":["URL.Parse","URL.ResolveReference","resolvePath"]}]},"database_specific":{"source":"https://vuln.go.dev/ID/GO-2026-6218.json"}}],"schema_version":"1.9.0"}'
