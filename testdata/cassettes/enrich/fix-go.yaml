        body: '{"id":"GO-2026-5037","summary":"Inefficient candidate hostname parsing in crypto/x509","details":"(*x509.Certificate).VerifyHostname previously called matchHostnames in a loop over all DNS Subject Alternative Name (SAN) entries. This caused strings.Split(host, \".\") to execute repeatedly on the same input hostname.\n\nWith a large DNS SAN list, verification costs scaled quadratically based on the number of SAN entries multiplied by the hostname''s label count. Because x509.Verify validates hostnames before building the certificate chain, this overhead occurred even for untrusted certificates.","aliases":["BIT-golang-2026-27145","CVE-2026-27145"],"modified":"2026-11-14T13:12:12.962669731Z","published":"2026-06-02T21:39:47Z","related":["RHSA-2026:29980","RHSA-2026:29981","RHSA-2026:35832","RHSA-2026:36317","RHSA-2026:42946","RHSA-2026:46394","RHSA-2026:49703","RHSA-2026:50319","RHSA-2026:53416","RHSA-2026:54168","RHSA-2026:57482","RHSA-2026:97644"],"database_specific":{"url":"https://pkg.go.dev/vuln/GO-2026-5037","review_status":"REVIEWED"},"references":[{"type":"FIX","url":"https://go.dev/cl/783621"},{"type":"REPORT","url":"https://go.dev/issue/79694"},{"type":"WEB","url":"https://groups.google.com/g/golang-announce/c/tKs3rmcBcKw"}],"affected":[{"package":{"name":"stdlib","ecosystem":"Go","purl":"pkg:golang/stdlib"},"ranges":[{"type":"SEMVER","events":[{"introduced":"0"},{"fixed":"1.25.11"},{"introduced":"1.26.0-0"},{"fixed":"1.26.4"}]}],"ecosystem_specific":{"imports":[{"path":"crypto/x509","symbols":["Certificate.Verify","Certificate.VerifyHostname","HostnameError.Error","matchHostnames"]}]},"database_specific":{"source":"https://vuln.go.dev/ID/GO-2026-5037.json"}}],"schema_version":"1.7.5","credits":[{"name":"Jakub Ciolek - https://ciolek.dev/"}]}'
