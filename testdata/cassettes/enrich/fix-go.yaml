        body: '{"id":"GO-2025-3750","summary":"Inconsistent handling of O_CREATE|O_EXCL on Unix and Windows in os in syscall","details":"os.OpenFile(path, os.O_CREATE|O_EXCL) behaved differently on Unix and Windows systems when the target path was a dangling symlink. On Unix systems, OpenFile with O_CREATE and O_EXCL flags never follows symlinks. On Windows, when the target path was a symlink to a nonexistent location, OpenFile would create a file in that location. OpenFile now always returns an error when the O_CREATE and O_EXCL flags are both set and the target path is a symlink.","aliases":["BIT-golang-2025-0913","CVE-2025-0913"],"modified":"2026-02-04T03:28:12.135241Z","published":"2025-06-11T16:59:06Z","related":["CGA-455f-g86x-5phg"],"database_specific":{"review_status":"REVIEWED","url":"https://pkg.go.dev/vuln/GO-2025-3750"},"references":[{"type":"FIX","url":"https://go.dev/cl/672396"},{"type":"REPORT","url":"https://go.dev/issue/73702"},{"type":"WEB","url":"https://groups.google.com/g/golang-announce/c/ufZ8WpEsA3A"}],"affected":[{"package":{"name":"stdlib","ecosystem":"Go","purl":"pkg:golang/stdlib"},"ranges":[{"type":"SEMVER","events":[{"introduced":"0"},{"fixed":"1.23.10"},{"introduced":"1.24.0-0"},{"fixed":"1.24.4"}]}],"ecosystem_specific":{"imports":[{"path":"syscall","symbols":["Open"],"goos":["windows"]},{"goos":["windows"],"path":"os","symbols":["Chdir","Chmod","Chown","CopyFS","Create","CreateTemp","File.ReadDir","File.Readdir","File.Readdirnames","Getwd","Lchown","Link","Lstat","Mkdir","MkdirAll","MkdirTemp","NewFile","Open","OpenFile","OpenInRoot","OpenRoot","Pipe","ReadDir","ReadFile","Remove","RemoveAll","Rename","Root.Create","Root.Lstat","Root.Mkdir","Root.Open","Root.OpenFile","Root.OpenRoot","Root.Remove","Root.Stat","StartProcess","Stat","Symlink","Truncate","WriteFile","dirFS.Open","dirFS.ReadDir","dirFS.ReadFile","dirFS.Stat","rootFS.Open","rootFS.ReadDir","rootFS.ReadFile","rootFS.Stat","unixDirent.Info"]}]},"database_specific":{"source":