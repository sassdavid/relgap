        content_length: 1973
        body: '{"id":"GO-2026-6179","summary":"Fix transparency log tile verification bypass in golang.org/x/mod/sumdb/tlog","details":"A malicious GOPROXY was previously capable of forging up to two sumdb tiles that allow for a requested module to bypass the GOSUMDB check and persist attacker-controlled module content to a local Go module cache.\n\nThis attack allows for a malicious GOPROXY to serve malicious module content that cannot be detected by evaluating the transparency log.\n\nAll tiles are now correctly verified against their parents.\n\nIn order to determine if you have been affected:\n\nrm -r go.sum go.work.sum vendor/ && go mod tidy","aliases":["BIT-golang-2026-56865","CVE-2026-56865"],"modified":"2026-08-19T12:25:40.780492871Z","published":"2026-08-13T21:43:54Z","related":["CGA-jw38-qq2g-45fw"],"database_specific":{"review_status":"REVIEWED","url":"https://pkg.go.dev/vuln/GO-2026-6179"},"references":[{"type":"REPORT","url":"https://go.dev/issue/80744"},{"type":"WEB","url":"https://groups.google.com/g/golang-announce/c/94pEornpRlI"},{"type":"FIX","url":"https://go.dev/cl/814960"},{"type":"FIX","url":"https://go.dev/cl/815020"}],"affected":[{"package":{"name":"toolchain","ecosystem":"Go","purl":"pkg:golang/toolchain"},"ranges":[{"type":"SEMVER","events":[{"introduced":"0"},{"fixed":"1.25.13"},{"introduced":"1.26.0-0"},{"fixed":"1.26.6"},{"introduced":"1.27.0-0"},{"fixed":"1.27.0-rc.3"}]}],"ecosystem_specific":{"imports":[{"path":"cmd/go"}]},"database_specific":{"source":"https://vuln.go.dev/ID/GO-2026-6179.json"}},{"package":{"name":"golang.org/x/mod","ecosystem":"Go","purl":"pkg:golang/golang.org/x/mod"},"ranges":[{"type":"SEMVER","events":[{"introduced":"0"},{"fixed":"0.40.0"}]}],"ecosystem_specific":{"imports":[{"symbols":["tileHashReader.ReadHashes"],"path":"golang.org/x/mod/sumdb/tlog"}]},"database_specific":{"source":"https://vuln.go.dev/ID/GO-2026-6179.json"}}],"schema_version":"1.9.0","credits":[{"name":"Filippo Valsorda (Geomys)"}]}'
