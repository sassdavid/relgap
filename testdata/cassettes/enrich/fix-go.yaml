        body: '{"id":"GO-2024-2963","summary":"Denial of service due to improper 100-continue handling in net/http","details":"The net/http HTTP/1.1 client mishandled the case where a server responds to a request with an \"Expect: 100-continue\" header with a non-informational (200 or higher) status. This mishandling could leave a client connection in an invalid state, where the next request sent on the connection will fail.\n\nAn attacker sending a request to a net/http/httputil.ReverseProxy proxy can exploit this mishandling to cause a denial of service by sending \"Expect: 100-continue\" requests which elicit a non-informational response from the backend. Each such request leaves the proxy with an invalid connection, and causes one subsequent request using that connection to fail.","aliases":["BIT-golang-2024-24791","CVE-2024-24791"],"modified":"2026-02-04T03:37:39.895574Z","published":"2024-07-02T20:11:00Z","related":["CGA-7r9v-mf57-276j"],"database_specific":{"review_status":"REVIEWED","url":"https://pkg.go.dev/vuln/GO-2024-2963"},"references":[{"type":"FIX","url":"https://go.dev/cl/591255"},{"type":"REPORT","url":"https://go.dev/issue/67555"},{"type":"WEB","url":"https://groups.google.com/g/golang-dev/c/t0rK-qHBqzY/m/6MMoAZkMAgAJ"}],"affected":[{"package":{"name":"stdlib","ecosystem":"Go","purl":"pkg:golang/stdlib"},"ranges":[{"type":"SEMVER","events":[{"introduced":"0"},{"fixed":"1.21.12"},{"introduced":"1.22.0-0"},{"fixed":"1.22.5"}]}],"ecosystem_specific":{"imports":[{"path":"net/http","symbols":["Client.CloseIdleConnections","Client.Do","Client.Get","Client.Head","Client.Post","Client.PostForm","Get","Head","Post","PostForm","Transport.CancelRequest","Transport.CloseIdleConnections","Transport.RoundTrip","persistConn.readResponse"]}]},"database_specific":{"source":"https://vuln.go.dev/ID/GO-2024-2963.json"}}],"schema_version":"1.7.3","credits":[{"name":"Geoff Franks"}]}'
