        body: '{"id":"GO-2026-4340","summary":"Handshake messages may be processed at the incorrect encryption level in crypto/tls","details":"During the TLS 1.3 handshake if multiple messages are sent in records that span encryption level boundaries (for instance the Client Hello and Encrypted Extensions messages), the subsequent messages may be processed before the encryption level changes. This can cause some minor information disclosure if a network-local attacker can inject messages during the handshake.","aliases":["BIT-golang-2025-61730","CVE-2025-61730"],"modified":"2026-08-07T10:42:58.273913222Z","published":"2026-01-28T19:08:09Z","related":["CGA-4r5q-7r6m-7v9p"],"database_specific":{"review_status":"REVIEWED","url":"https://pkg.go.dev/vuln/GO-2026-4340"},"references":[{"type":"FIX","url":"https://go.dev/cl/724120"},{"type":"REPORT","url":"https://go.dev/issue/76443"},{"type":"WEB","url":"https://groups.google.com/g/golang-announce/c/Vd2tYVM8eUc"}],"affected":[{"package":{"name":"stdlib","ecosystem":"Go","purl":"pkg:golang/stdlib"},"ranges":[{"type":"SEMVER","events":[{"introduced":"0"},{"fixed":"1.24.12"},{"introduced":"1.25.0"},{"fixed":"1.25.6"}]}],"ecosystem_specific":{"imports":[{"symbols":["Conn.Handshake","Conn.HandshakeContext","Conn.Read","Conn.Write","Conn.handleKeyUpdate","Conn.handshakeContext","Conn.quicSetReadSecret","Dial","DialWithDialer","Dialer.Dial","Dialer.DialContext","QUICConn.HandleData","QUICConn.Start","clientHandshakeStateTLS13.establishHandshakeKeys","clientHandshakeStateTLS13.readServerFinished","clientHandshakeStateTLS13.sendClientFinished","serverHandshakeStateTLS13.checkForResumption","serverHandshakeStateTLS13.doHelloRetryRequest","serverHandshakeStateTLS13.readClientFinished","serverHandshakeStateTLS13.sendServerFinished","serverHandshakeStateTLS13.sendServerParameters"],"path":"crypto/tls"}]},"database_specific":{"source":"https://vuln.go.dev/ID/GO-2026-4340.json"}}],"schema_version":"1.7.3","credits":[{"name":"Coia Prant (