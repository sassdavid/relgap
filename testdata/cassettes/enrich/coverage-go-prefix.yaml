        content_length: 2058
        body: '{"id":"GHSA-v53g-5gjp-272r","summary":"Helm dependency management path traversal","details":"A Helm contributor discovered a path traversal vulnerability when Helm saves a chart including at download time.\n\n### Impact\n\nWhen either the Helm client or SDK is used to save a chart whose name within the `Chart.yaml` file includes a relative path change, the chart would be saved outside its expected directory based on the changes in the relative path. The validation and linting did not detect the path changes in the name.\n\n### Patches\n\nThis issue has been resolved in Helm v3.14.1.\n\n### Workarounds\n\nCheck all charts used by Helm for path changes in their name as found in the `Chart.yaml` file. This includes dependencies.\n\n### Credits\n\nDisclosed by Dominykas Blyžė at Nearform Ltd.","aliases":["BIT-helm-2024-25620","CVE-2024-25620","GO-2024-2554"],"modified":"2026-09-10T03:50:09.883919745Z","published":"2024-02-15T15:34:40Z","database_specific":{"github_reviewed":true,"github_reviewed_at":"2024-02-15T15:34:40Z","nvd_published_at":"2024-02-15T00:15:45Z","cwe_ids":["CWE-22","CWE-23"],"severity":"MODERATE"},"references":[{"type":"WEB","url":"https://github.com/helm/helm/security/advisories/GHSA-v53g-5gjp-272r"},{"type":"ADVISORY","url":"https://nvd.nist.gov/vuln/detail/CVE-2024-25620"},{"type":"WEB","url":"https://github.com/helm/helm/commit/0d0f91d1ce277b2c8766cdc4c7aa04dbafbf2503"},{"type":"PACKAGE","url":"https://github.com/helm/helm"},{"type":"WEB","url":"https://github.com/helm/helm/releases/tag/v3.14.1"}],"affected":[{"package":{"name":"helm.sh/helm/v3","ecosystem":"Go","purl":"pkg:golang/helm.sh/helm/v3"},"ranges":[{"type":"SEMVER","events":[{"introduced":"0"},{"fixed":"3.14.1"}]}],"database_specific":{"last_known_affected_version_range":"\u003c= 3.14.0","source":"https://github.com/github/advisory-database/blob/main/advisories/github-reviewed/2024/02/GHSA-v53g-5gjp-272r/GHSA-v53g-5gjp-272r.json"}}],"schema_version":"1.9.0","severity":[{"ty