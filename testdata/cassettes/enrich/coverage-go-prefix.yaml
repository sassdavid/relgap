        content_length: 2142
        body: '{"id":"GHSA-f9f8-9pmf-xv68","summary":"Helm May Panic Due To Incorrect YAML Content","details":"A Helm contributor discovered an improper validation of type error when parsing Chart.yaml and index.yaml files that can lead to a panic.\n\n### Impact\n\nThere are two areas of YAML validation that were impacted. First, when a `Chart.yaml` file had a `null` maintainer or the `child` or `parent` of a dependencies `import-values` could be parsed as something other than a string, `helm lint` would panic. Second, when an `index.yaml` had an empty entry in the list of chart versions Helm would panic on interactions with that repository.\n\n### Patches\n\nThis issue has been resolved in Helm v3.18.5.\n\n### Workarounds\n\nEnsure YAML files are formatted as Helm expects prior to processing them with Helm.\n\n### References\n\nHelm''s security policy is spelled out in detail in our [SECURITY](https://github.com/helm/community/blob/master/SECURITY.md) document.\n\n### Credits\n\nDisclosed by Jakub Ciolek at AlphaSense.","aliases":["BIT-helm-2025-55198","CVE-2025-55198","GO-2025-3888"],"modified":"2026-09-10T03:50:26.950698254Z","published":"2025-08-14T00:05:27Z","database_specific":{"cwe_ids":["CWE-908"],"severity":"MODERATE","github_reviewed":true,"github_reviewed_at":"2025-08-14T00:05:27Z","nvd_published_at":"2025-08-14T00:15:26Z"},"references":[{"type":"WEB","url":"https://github.com/helm/helm/security/advisories/GHSA-f9f8-9pmf-xv68"},{"type":"ADVISORY","url":"https://nvd.nist.gov/vuln/detail/CVE-2025-55198"},{"type":"WEB","url":"https://github.com/helm/helm/commit/ec5f59e2db56533d042a124f5bae54dd87b558e6"},{"type":"PACKAGE","url":"https://github.com/helm/helm"}],"affected":[{"package":{"name":"helm.sh/helm/v3","ecosystem":"Go","purl":"pkg:golang/helm.sh/helm/v3"},"ranges":[{"type":"SEMVER","events":[{"introduced":"0"},{"fixed":"3.18.5"}]}],"database_specific":{"source":"https://github.com/github/advisory-database/blob/main/advisories/github-reviewed/2025/08/GHS