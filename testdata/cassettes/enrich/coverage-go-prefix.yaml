      response:
        proto: HTTP/2.0
        proto_major: 2
        proto_minor: 0
        content_length: 3305
        body: '{"id":"GHSA-hr2v-4r36-88hr","summary":"Helm Chart extraction output directory collapse via `Chart.yaml` name dot-segment","details":"Helm is a package manager for Charts for Kubernetes. In Helm versions \u003c=3.20.1 and \u003c=4.1.3, a specially crafted Chart will cause `helm pull --untar  [chart URL | repo/chartname]` to write the Chart''s contents to the immediate output directory (as defaulted to the current working directory; or as given by the `--destination` and `--untardir` flags), rather than the expected output directory suffixed by the chart''s name.\n\n### Impact\n\nThe bug enables writing the Chart''s contents (unpackaged/untar''ed) to the output directory `\u003coutput dir\u003e/`, instead of the expected `\u003coutput dir\u003e/\u003cchart name\u003e/`, potentially overwriting the contents of the targeted directory.\n\nNote: a chart name containing POSIX dot-dot, or dot-dot and slashes (as if to refer to parent directories) do not resolve beyond the output directory as designed.\n\n### Patches\n\nThis issue has been resolved in Helm v3.20.2 and v4.1.3\n\nA Chart with an unexpected name (those specified to be \".\" or \"..\"), or a Chart name which results in a non-unique directory will be rejected.\n\n### Workarounds\n\nEnsure the the name of the Chart does not comprise/contain POSIX pathname special directory references ie. dot-dot (\"..\") or dot (\".\"). In addition, ensuring that the `pull --untar` flag (or equivalent SDK option) refers to a unique/empty output directory prevents chart extraction from inadvertently overwriting existing files within the specified directory.\n\n### Credits\n\nOleh Konko\n@1seal","aliases":["BIT-helm-2026-35206","CVE-2026-35206","GO-2026-5435"],"modified":"2026-09-10T03:51:02.108024621Z","published":"2026-04-10T15:33:09Z","database_specific":{"severity":"MODERATE","github_reviewed":true,"github_reviewed_at":"2026-04-10T15:33:09Z","nvd_published_at":"2026-04-09T21:16:09Z","cwe_ids":["CWE-22"]},"referenc