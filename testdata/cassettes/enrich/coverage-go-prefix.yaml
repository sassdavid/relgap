        content_length: 2189
        body: '{"id":"GHSA-4hfp-h4cw-hj8p","summary":"Helm Allows A Specially Crafted Chart Archive To Cause Out Of Memory Termination","details":"A Helm contributor discovered that a specially crafted chart archive file can cause Helm to use all available memory and have an out of memory (OOM) termination.\n\n### Impact\nA chart archive file can be crafted in a manner where it expands to be significantly larger uncompressed than compressed (e.g., \u003e800x difference). When Helm loads this specially crafted chart, memory can be exhausted causing the application to terminate.\n\n### Patches\nThis issue has been resolved in Helm v3.17.3.\n\n### Workarounds\nEnsure that any chart archive files being loaded by Helm do not contain files that are large enough to cause the Helm Client or SDK to use up available memory leading to a termination.\n\n### For more information\nHelm''s security policy is spelled out in detail in our [SECURITY](https://github.com/helm/community/blob/master/SECURITY.md) document.\n\n### Credits\nDisclosed by Jakub Ciolek at AlphaSense.","aliases":["BIT-helm-2025-32386","CVE-2025-32386","GO-2025-3601"],"modified":"2026-09-10T03:50:23.422045323Z","published":"2025-04-10T13:48:05Z","database_specific":{"cwe_ids":["CWE-770","CWE-789"],"severity":"MODERATE","github_reviewed":true,"github_reviewed_at":"2025-04-10T13:48:05Z","nvd_published_at":"2025-04-09T23:15:37Z"},"references":[{"type":"WEB","url":"https://github.com/helm/helm/security/advisories/GHSA-4hfp-h4cw-hj8p"},{"type":"ADVISORY","url":"https://nvd.nist.gov/vuln/detail/CVE-2025-32386"},{"type":"WEB","url":"https://github.com/helm/helm/commit/d8ca55fc669645c10c0681d49723f4bb8c0b1ce7"},{"type":"PACKAGE","url":"https://github.com/helm/helm"}],"affected":[{"package":{"name":"helm.sh/helm/v3","ecosystem":"Go","purl":"pkg:golang/helm.sh/helm/v3"},"ranges":[{"type":"SEMVER","events":[{"introduced":"0"},{"fixed":"3.17.3"}]}],"database_specific":{"source":"https://github.com/github/advisory-database/b