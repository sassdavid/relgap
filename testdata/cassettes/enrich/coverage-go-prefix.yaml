        content_length: 3107
        body: '{"id":"GHSA-557j-xg8c-q2mm","summary":"Helm vulnerable to Code Injection through malicious chart.yaml content","details":"A Helm contributor discovered that a specially crafted `Chart.yaml` file along with a specially linked `Chart.lock` file can lead to local code execution when dependencies are updated.\n\n### Impact\n\nFields in a `Chart.yaml` file, that are carried over to a `Chart.lock` file when dependencies are updated and this file is written, can be crafted in a way that can cause execution if that same content were in a file that is executed (e.g., a `bash.rc` file or shell script). If the `Chart.lock` file is symlinked to one of these files updating dependencies will write the lock file content to the symlinked file. This can lead to unwanted execution. Helm warns of the symlinked file but did not stop execution due to symlinking.\n\nThis affects when dependencies are updated. When using the `helm` command this happens when `helm dependency update` is run. `helm dependency build` can write a lock file when one does not exist but this vector requires one to already exist. This affects the Helm SDK when the downloader `Manager` performs an update.\n\n### Patches\n\nThis issue has been resolved in Helm v3.18.4\n\n### Workarounds\n\nEnsure the `Chart.lock` file in a chart is not a symlink prior to updating dependencies.\n\n### For more information\n\nHelm''s security policy is spelled out in detail in our [SECURITY](https://github.com/helm/community/blob/master/SECURITY.md) document.\n\n### Credits\n\nDisclosed by Jakub Ciolek at AlphaSense.","aliases":["BIT-helm-2025-53547","CVE-2025-53547","GO-2025-3802"],"modified":"2026-09-10T03:50:25.790911761Z","published":"2025-07-08T23:20:54Z","database_specific":{"cwe_ids":["CWE-94"],"severity":"HIGH","github_reviewed":true,"github_reviewed_at":"2025-07-08T23:20:54Z","nvd_published_at":"2025-07-08T22:15:27Z"},"references":[{"type":"WEB","url":"https://github.com/helm/helm/security/advisories/GHSA-557j-xg8c-q2mm"},{"type":"ADVISORY","url":"https://nvd.nist.gov/vuln/detail/CVE-2025-53547"},{"type":"WEB","url":"https://github.com/helm/helm/commit/4b8e61093d8f579f1165cdc6bd4b43fa5455f571"},{"type":"PACKAGE","url":"https://github.com/helm/helm"},{"type":"WEB","url":"https://news.ycombinator.com/item?id=44506696"}],"affected":[{"package":{"name":"helm.sh/helm/v3","ecosystem":"Go","purl":"pkg:golang/helm.sh/helm/v3"},"ranges":[{"type":"SEMVER","events":[{"introduced":"3.18.0-rc.1"},{"fixed":"3.18.4"}]}],"database_specific":{"source":"https://github.com/github/advisory-database/blob/main/advisories/github-reviewed/2025/07/GHSA-557j-xg8c-q2mm/GHSA-557j-xg8c-q2mm.json"}},{"package":{"name":"helm.sh/helm/v3","ecosystem":"Go","purl":"pkg:golang/helm.sh/helm/v3"},"ranges":[{"type":"SEMVER","events":[{"introduced":"0"},{"fixed":"3.17.4"}]}],"database_specific":{"source":"https://github.com/github/advisory-database/blob/main/advisories/github-reviewed/2025/07/GHSA-557j-xg8c-q2mm/GHSA-557j-xg8c-q2mm.json"}}],"schema_version":"1.9.0","severity":[{"type":"CVSS_V3","score":"CVSS:3.1/AV:L/AC:L/PR:N/UI:R/S:C/C:L/I:H/A:H"}]}'
