        content_length: 2518
        body: '{"id":"GHSA-r53h-jv2g-vpx6","summary":"Helm''s Missing YAML Content Leads To Panic","details":"A Helm contributor discovered uninitialized variable vulnerability when Helm parses index and plugin yaml files missing expected content.\n\n### Impact\n\nWhen either an `index.yaml` file or a plugins `plugin.yaml` file were missing all metadata a panic would occur in Helm.\n\nIn the Helm SDK this is found when using the `LoadIndexFile` or `DownloadIndexFile` functions in the `repo` package or the `LoadDir` function in the `plugin` package. For the Helm client this impacts functions around adding a repository and all Helm functions if a malicious plugin is added as Helm inspects all known plugins on each invocation.\n\n### Patches\n\nThis issue has been resolved in Helm v3.14.2.\n\n### Workarounds\n\nIf a malicious plugin has been added which is causing all Helm client commands to panic, the malicious plugin can be manually removed from the filesystem.\n\nIf using Helm SDK versions prior to 3.14.2, calls to affected functions can use `recover` to catch the panic.\n\n### For more information\n\nHelm''s security policy is spelled out in detail in our [SECURITY](https://github.com/helm/community/blob/master/SECURITY.md) document.\n\n### Credits\n\nDisclosed by Jakub Ciolek at AlphaSense.","aliases":["BIT-helm-2024-26147","CVE-2024-26147","GO-2024-2575"],"modified":"2026-09-10T03:50:09.851138804Z","published":"2024-02-22T19:34:47Z","database_specific":{"github_reviewed_at":"2024-02-22T19:34:47Z","nvd_published_at":"2024-02-21T23:15:08Z","cwe_ids":["CWE-457","CWE-908"],"severity":"HIGH","github_reviewed":true},"references":[{"type":"WEB","url":"https://github.com/helm/helm/security/advisories/GHSA-r53h-jv2g-vpx6"},{"type":"ADVISORY","url":"https://nvd.nist.gov/vuln/detail/CVE-2024-26147"},{"type":"WEB","url":"https://github.com/helm/helm/commit/bb4cc9125503a923afb7988f3eb478722a8580af"},{"type":"PACKAGE","url":"https://github.com/helm/helm"}],"affected":[{"packag