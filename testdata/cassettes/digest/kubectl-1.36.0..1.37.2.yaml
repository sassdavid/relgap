            ## Changelog since v1.37.0

            ## Changes by Kind

            ### Feature

            - Kubernetes is now built using Go 1.26.8 ([#142179](https://github.com/kubernetes/kubernetes/pull/142179), [@cpanato](https://github.com/cpanato)) [SIG Release and Testing]

            ### Failing Test

            - Adjust the Projected PodCertificate e2e conformance test added in 1.37 to be able to run in unprivileged environments ([#141780](https://github.com/kubernetes/kubernetes/pull/141780), [@yt2985](https://github.com/yt2985)) [SIG Auth and Testing]

            ### Bug or Regression

            - Fixed a bug where a DeviceTaintRule with no `spec.deviceSelector` incorrectly matched every device cluster-wide and made all DRA devices unschedulable for `NoSchedule` or `NoExecute` taints. The rule now correctly matches no devices as documented. Use an explicit empty selector (`deviceSelector: {}`) to target all devices. ([#141998](https://github.com/kubernetes/kubernetes/pull/141998), [@marwan562](https://github.com/marwan562)) [SIG Node]
            - Fixed a panic in the Windows kube-proxy (winkernel) that could terminate kube-proxy when
              an HNS load balancer without port mappings was enumerated. ([#141681](https://github.com/kubernetes/kubernetes/pull/141681), [@prince-melvin](https://github.com/prince-melvin)) [SIG Network and Windows]
            - Kube-scheduler: a ResourceClaim whose device request counts add up past the int range no longer crashes the scheduler or skips the `firstAvailable` fallback in the DRA allocator. A request over the per-claim device limit is rejected with an error naming it, and an oversized `firstAvailable` alternative falls through to a smaller one. ([#141922](https://github.com/kubernetes/kubernetes/pull/141922), [@thc1006](https://github.com/thc1006)) [SIG Node]
            - Kubeadm: no longer persists a node-specific systemd-resolved resolvConf path in the cluster-wide kubelet-config ConfigMap during init. ([#141627](https://github.com/kubernetes/kubernetes/pull/141627), [@HirazawaUi](https://github.com/HirazawaUi)) [SIG Cluster Lifecycle]

