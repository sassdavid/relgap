    - version: 1.2.0
      heading: [Collect runtime profiles]
      text: |-
        Terragrunt writes CPU, heap, and goroutine profiles on request, so you can see where a slow run spends its time. Pass `--profile-cpu`, `--profile-mem` or `--profile-goroutine` with a path, or `--profile-dir` to collect all three into one directory under conventional names. Each flag has a matching `TG_PROFILE_*` environment variable.

        ```bash
        terragrunt --profile-dir /tmp/profiles run --all -- plan
        ```

        Read the result with `go tool pprof`. The profiles cover Terragrunt itself, not the OpenTofu/Terraform processes it runs.

        Previously gated behind the `profiling` experiment, the profile flags no longer require `--experiment profiling`.
      breaking: false
    - version: 1.2.0
      heading: [Nested stacks now generate inside Git filter worktrees]
      text: |-
        A stack file can reference another stack with a `stack` block. For a brand-new stack like that, `terragrunt find --filter '[a...b]'` reported the nested stack, but `terragrunt run` with the same filter warned `No units discovered` and did nothing. Terragrunt never generated the nested stack in the temporary worktree, so no units existed there to run.

        Worktree generation now recurses into nested stacks, the same way it does in the working directory, including nested stacks that set `no_dot_terragrunt_stack = true`. `find` and `run` agree again, and Terragrunt discovers and runs the units of added, changed, and removed nested stacks.

        After each level of generation, Terragrunt now only walks the directories of the stacks it just generated, instead of walking everything again.
      breaking: false
    - version: 1.2.0
      heading: ['`mcp-command` — Serve Terragrunt operations to AI agents']
      text: |-
        `--allow=env` passes the server's environment variables to configurations and the commands the tools run.

        Unless it is granted, tool calls start from an empty environment, so `get_env()` returns its default. The server also clears its own environment variables and points `HOME` at an empty directory, so cloud SDKs, the SOPS decrypter, and `git` commands Terragrunt runs will find no credentials in environment variables or your home directory.
      breaking: false
    - version: 1.2.0
      heading: [CAS leaves `.terragrunt-stack` out of local sources]
      text: |-
        A stack reading a local source from its own repository, such as `source = "../..//catalog/stacks/foo"` with `update_source_with_cas = true`, got a new [CAS](https://docs.terragrunt.com/features/caching/cas) key on every `stack generate`, even when the source had not changed.

        CAS now leaves `.terragrunt-stack` out of local sources, like it does for `.terraform` and `.terragrunt-cache`.
      breaking: false
    - version: 1.2.0
      heading: [Pull Requests, ✨ Features]
      text: 'feat(profiling): collect runtime profiles by default by [@denis256](https://github.com/denis256) in [#6945](https://github.com/gruntwork-io/terragrunt/pull/6945)'
      breaking: false
    - version: 1.2.1
      heading: [Reading a unit's outputs no longer collides with that unit's own run]
      text: |-
        In `run --all`, a unit could run at the same time as another unit reading its outputs, e.g. with [`--queue-ignore-dag-order`](https://docs.terragrunt.com/reference/cli/commands/run#queue-ignore-dag-order), or when a Git filter plans the destroy of a removed unit while its dependents plan. Both ran OpenTofu/Terraform in the unit's `.terragrunt-cache` directory, so one could reinstall providers while the other used them, and the run failed with errors such as:

        ```text
        Error: Required plugins are not installed
          - registry.opentofu.org/hashicorp/null: the cached package for registry.opentofu.org/hashicorp/null 3.2.4 (in .terraform/providers) does not match any of the checksums recorded in the dependency lock file
        ```

        Terragrunt now waits for a unit's run to finish before reading its outputs, and waits for a read in progress before running the unit.
      breaking: false
