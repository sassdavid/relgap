range: 1.0.0..1.2.1
entries:
    - version: 1.0.1
      heading: [What's Changed]
      text: 'fix: Addressing #5828 feedback by @yhakbar in https://github.com/gruntwork-io/terragrunt/pull/5876'
      breaking: false
    - version: 1.0.1
      heading: ['`hcl validate` no longer fails on `dependency.outputs` references']
      text: |-
        `terragrunt hcl validate` previously failed with "Unsupported attribute" when a configuration referenced `dependency.<name>.outputs.<key>` without `mock_outputs`. 

        During validation, output resolution is skipped, but the `outputs` attribute was never added to the dependency evaluation context, causing any output reference to error. The fix provides a dynamic placeholder for dependency outputs (and inputs) during validation so that attribute access evaluates to unknown rather than failing. Additionally, the dependency resolution pipeline is now more resilient during validation. Dependencies with unresolvable `config_path` values or nonexistent targets no longer cause the entire `dependency` namespace to disappear from the evaluation context.
      breaking: false
    - version: 1.0.2
      heading: ['`catalog-redesign` — Reworked `terragrunt catalog` TUI']
      text: |-
        A new `catalog-redesign` experiment reworks the design of the `terragrunt catalog` TUI.

        `terragrunt catalog` now launches the TUI right away and runs discovery in the background instead of waiting for discovery to complete before launching the TUI. As a consequence, `terragrunt catalog` users with large catalogs should see significant speed improvements as they launch the `terragrunt catalog` TUI.

        Modules now stream into the list view of the catalog as they are discovered, so you'll be able to select and use a module even if your entire catalog hasn't been discovered yet.

        If `catalog.urls` is not configured in `root.hcl`, `terragrunt catalog` no longer errors. A welcome screen explains how to populate the catalog and can open the catalog documentation on a keypress. In addition, `terraform.source` values from existing units are automatically included in the set of URLs used for discovery, so users with existing units get a populated catalog pointing to other modules that can be pulled from the same module source without any additional configuration.

        This experiment is subject to change, and core elements of the design are being iterated on rapidly.

        To try it out, run:

        ```bash
        terragrunt catalog --experiment catalog-redesign
        ```

        To learn more, see the [experiment documentation](https://docs.terragrunt.com/reference/experiments/active#catalog-redesign).
      breaking: false
    - version: 1.1.0
      heading: [Fix `permission denied` when generated files overwrite CAS-materialized files]
      text: 'With the CAS enabled, Terragrunt fetches sources as read-only files. Writing a generated file over one of them no longer fails with `permission denied`:'
      breaking: false
    - version: 1.1.0
      heading: [Fix panic on non-string literal interpolation in `autoinclude` templates]
      text: '`terragrunt stack generate` no longer panics when an `autoinclude` template interpolates a non-string literal (for example `"${0}"` or `"${true}"`) alongside a `dependency.*` reference. The interpolated literal is now rendered to its string form (`${0}` becomes `0`) and the dependency reference is preserved for the unit.'
      breaking: false
    - version: 1.1.0
      heading: [Redesigned `terragrunt catalog`]
      text: |-
        The [`catalog`](https://docs.terragrunt.com/features/catalog) command has been redesigned. It now starts without any configuration, discovers components across your catalog repositories in the background, and streams them into the TUI as they're found.

        Discovery is no longer limited to a `modules/` directory; components can live anywhere in a catalog repository. To control what gets discovered, add a `.terragrunt-catalog-ignore` file with `.gitignore`-style globs for the paths you want filtered out.

        Components in the TUI now carry metadata to help you navigate a large catalog: each one shows a kind label (`template`, `stack`, `unit`, or `module`) and optional tags defined in the front-matter of its `README.md`. From the component list, press `s` to open a new screen that interactively collects the values used to [scaffold](https://docs.terragrunt.com/features/catalog/scaffold) the component into your repository.

        Previously gated behind the `catalog-redesign` experiment, the redesigned catalog is now the default `terragrunt catalog` experience.
      breaking: false
    - version: 1.1.0
      heading: [Scaffold only detects variables in the module directory]
      text: '`terragrunt scaffold` now reads input variables from the module directory itself, matching what OpenTofu and Terraform load for a root module. Previously it scanned subdirectories too, so `variable` blocks defined in nested modules or examples leaked into the scaffolded inputs even though the module never exposes them.'
      breaking: false
