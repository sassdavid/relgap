tool: terraform
repo: hashicorp/terraform
range: 1.13.0..1.17.1
entries:
    - version: 1.13.5
      heading: ['BUG FIXES:']
      text: impure functions could cause templatefile to incorrectly fail consistency checks ([#37807](https://github.com/hashicorp/terraform/issues/37807))
      breaking: false
    - version: 1.14.0
      heading: ['UPGRADE NOTES:']
      text: Building Terraform 1.14 requires macOS Monterey or later (due to being built on Go 1.25 which imposes these requirements) ([#37436](https://github.com/hashicorp/terraform/issues/37436))
      breaking: true
    - version: 1.14.0
      heading: ['UPGRADE NOTES:']
      text: The parallelism of Terraform operations within container runtimes may be reduced depending on the CPU bandwidth limit setting. ([#37436](https://github.com/hashicorp/terraform/issues/37436))
      breaking: false
    - version: 1.14.0
      heading: ['EXPERIMENTS:']
      text: The experimental "deferred actions" feature, enabled by passing the `-allow-deferral` option to `terraform plan`, permits `count` and `for_each` arguments in `module`, `resource`, and `data` blocks to have unknown values and allows providers to react more flexibly to unknown values.
      breaking: false
    - version: 1.14.0
      heading: ['EXPERIMENTS:']
      text: '`terraform test cleanup`: The experimental `test cleanup` command. In experimental builds of Terraform, a manifest file and state files for each failed cleanup operation during test operations are saved within the `.terraform` local directory. The `test cleanup` command will attempt to clean up the local state files left behind automatically, without requiring manual intervention.'
      breaking: false
    - version: 1.14.0
      heading: ['ENHANCEMENTS:']
      text: Updates to support the AWS European Sovereign Cloud ([#37721](https://github.com/hashicorp/terraform/issues/37721))
      breaking: false
    - version: 1.14.4
      heading: ['BUG FIXES:']
      text: Fixes an issue where any warning diagnostics generated during terraform query execution failed to render in the cloud backend session ([#38040](https://github.com/hashicorp/terraform/issues/38040))
      breaking: false
    - version: 1.14.9
      heading: ['BUG FIXES:']
      text: Fix Terraform Stacks plugin installation error ([#38406](https://github.com/hashicorp/terraform/issues/38406))
      breaking: false
    - version: 1.15.0
      heading: ['UPGRADE NOTES:']
      text: 'backend/s3: The `AWS_USE_FIPS_ENDPOINT` and `AWS_USE_DUALSTACK_ENDPOINT` environment variables now only respect `true` or `false` values, aligning with the AWS SDK for Go. This replaces the previous behavior which treated any non-empty value as `true`. ([#37601](https://github.com/hashicorp/terraform/issues/37601))'
      breaking: true
    - version: 1.15.0
      heading: ['NEW FEATURES:']
      text: 'validate: The validate command now checks the `backend` block. This ensures the backend type exists, that all required attributes are present, and that the backend''s own validation logic passes. ([#38021](https://github.com/hashicorp/terraform/issues/38021))'
      breaking: true
    - version: 1.15.0
      heading: ['BUG FIXES:']
      text: 'testing: File-level error diagnostics are now included in JUnit XML skipped test elements, ensuring CI/CD pipelines can detect validation failures ([#37801](https://github.com/hashicorp/terraform/issues/37801))'
      breaking: false
    - version: 1.15.0
      heading: ['ENHANCEMENTS:']
      text: As part of supporting variables in module sources, most commands now accept variable values ([#38276](https://github.com/hashicorp/terraform/issues/38276))
      breaking: false
    - version: 1.15.0
      heading: ['ENHANCEMENTS:']
      text: 'Terraform Test: Allow functions within mock blocks ([#34672](https://github.com/hashicorp/terraform/issues/34672))'
      breaking: false
    - version: 1.15.8
      heading: ['NOTES:']
      text: 'command/init: Provider installation was changed to enable future enhancements in the area. This partially reverses the init event order changes from v1.15; module installation will now occur after the backend is initialized. The change should not have any significant end-user impact aside from the command output. ([#38838](https://github.com/hashicorp/terraform/issues/38838))'
      breaking: false
    - version: 1.16.0
      heading: ['UPGRADE NOTES:']
      text: '`bastion_host_key` is now correctly applied by provisioners. Review your provisioner configurations to verify the configured key is correct before upgrading. ([#38318](https://github.com/hashicorp/terraform/issues/38318))'
      breaking: true
    - version: 1.16.0
      heading: ['NOTES:']
      text: 'init: Errors due to incompatible `-upgrade` and `-lockfile=readonly` flags are now raised earlier in the init process. ([#38561](https://github.com/hashicorp/terraform/issues/38561))'
      breaking: false
    - version: 1.16.0
      heading: ['BUG FIXES:']
      text: 'init: Terraform no longer removes locks from the dependency lock file for providers configured as `dev_override`. ([#38634](https://github.com/hashicorp/terraform/issues/38634))'
      breaking: false
    - version: 1.16.0
      heading: ['BUG FIXES:']
      text: '`terraform apply` no longer panics when the plan contains a no-op change for a deposed resource that has `lifecycle.precondition` or `lifecycle.postcondition` blocks. ([#38586](https://github.com/hashicorp/terraform/issues/38586))'
      breaking: false
    - version: 1.16.0
      heading: ['ENHANCEMENTS:']
      text: 'workspace: The `workspace list` command can now produce machine-readable output when supplied with the `-json` flag ([#38397](https://github.com/hashicorp/terraform/issues/38397))'
      breaking: false
    - version: 1.17.0
      heading: ['ENHANCEMENTS:']
      text: 'command/login: display warning after successful login if user is subject to an organization''s TTL policy'
      breaking: false
