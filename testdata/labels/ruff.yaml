    - version: 0.17.0
      heading: [Release Notes, Breaking changes]
      text: |-
        Support Unicode dummy variable names ([#28722](https://github.com/astral-sh/ruff/pull/28722))

          The default [`lint.dummy-variable-rgx`](https://docs.astral.sh/ruff/settings/#lint_dummy-variable-rgx) now recognizes underscore-prefixed Unicode names, such as `_次`, as dummy variables.
      breaking: true
    - version: 0.17.0
      heading: [Release Notes, Breaking changes]
      text: |-
        Update Rust crate quick-junit to 0.8.0 ([#27295](https://github.com/astral-sh/ruff/pull/27295))

          JUnit output now uses a `skipped` attribute instead of `disabled` on `<testsuite>` elements and includes a `skipped` attribute on the root `<testsuites>` element.
      breaking: true
    - version: 0.17.0
      heading: [Release Notes, Breaking changes]
      text: |-
        Update the default and latest Python versions for 3.15 ([#28792](https://github.com/astral-sh/ruff/pull/28792))

          Ruff now defaults to Python 3.11 instead of 3.10 when no Python version is configured through [`target-version`](https://docs.astral.sh/ruff/settings/#target-version) or [`requires-python`](https://docs.astral.sh/ruff/configuration/#inferring-the-python-version). When checking for syntax errors without a configured Python version, Ruff now defaults to Python 3.15 instead of 3.14.
      breaking: true
    - version: 0.17.0
      heading: [Release Notes, Breaking changes]
      text: |-
        Remove support for ruff-lsp ([#28750](https://github.com/astral-sh/ruff/pull/28750))

          Support for `ruff-lsp`, the legacy Python language server [deprecated in Ruff v0.9.5](https://github.com/astral-sh/ruff/releases/tag/0.9.5), has been removed. The Ruff VS Code extension now always uses the native language server; `ruff.nativeServer` is deprecated and ignored. See the [migration guide](https://docs.astral.sh/ruff/editors/migration/).
      breaking: true
    - version: 0.17.0
      heading: [Release Notes, Breaking changes]
      text: |-
        Update to Unicode 17 ([#21229](https://github.com/astral-sh/ruff/pull/21229), [#28784](https://github.com/astral-sh/ruff/pull/28784))

          Ruff now uses Unicode 17 data for identifier normalization and named character escapes (`"\N{...}"`).
      breaking: false
    - version: 0.17.0
      heading: [Release Notes, Breaking changes]
      text: |-
        Remove the Python dependency from conda-forge builds ([conda-forge/ruff-feedstock#361](https://github.com/conda-forge/ruff-feedstock/pull/361))

          The conda-forge build no longer depends on Python, now supports linux-riscv64, win-arm64, and linux-ppc64le platforms, and now includes shell completions. However, no longer depending on Python means that `python -m ruff` and `import ruff` will no longer work. Use `ruff` directly from `PATH` instead. PyPI installations and those from the standalone installer are unaffected.
      breaking: true
    - version: 0.17.0
      heading: [Release Notes, Stabilization]
      text: 'The following rules have been stabilized and are no longer in preview:'
      breaking: false
