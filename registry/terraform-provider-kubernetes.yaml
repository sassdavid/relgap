# yaml-language-server: $schema=../schemas/registry-v1.json
# Release bodies and CHANGELOG.md both carry the notes; each major has an upgrade guide.
name: terraform-provider-kubernetes
repo: hashicorp/terraform-provider-kubernetes
version:
  scheme: semver
  tag_prefix: "v"
  universe: releases
sources:
  - kind: gh-release
  - kind: changelog-file
    path_template: CHANGELOG.md
    ref: main
    heading: "^{version} \\("
  - kind: upgrade-guide
    path_template: "docs/guides/v{major}-upgrade-guide.md"
    ref: main
