# yaml-language-server: $schema=../schemas/registry-v1.json
# Each version has change_logs/release_v<version>.md; the Notes section is a sponsor preamble.
name: k9s
repo: derailed/k9s
version:
  scheme: semver
  tag_prefix: "v"
  universe: releases
sources:
  - kind: changelog-file
    path_template: "change_logs/release_v{version}.md"
    heading: "^Release v{version}$"
    ignore_sections: ["Notes"]
  - kind: gh-release
    ignore_sections: ["Notes"]
