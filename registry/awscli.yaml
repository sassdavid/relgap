# yaml-language-server: $schema=../schemas/registry-v1.json
# No GitHub releases; v1 and v2 share the repo. v2 notes are .changes/<version>.json on the v2 branch.
name: awscli
aliases: [aws-cli, aws]
repo: aws/aws-cli
version:
  scheme: semver
  universe: tags
  line: major
sources:
  - kind: structured-json
    path_template: ".changes/{version}.json"
    ref: v2
