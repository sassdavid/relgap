# yaml-language-server: $schema=../schemas/registry-v1.json
# Release bodies are an edited summary; CHANGELOG.md (1 MB, git-cliff) has every commit. The
# v tag prefix also keeps the vfox-v* tags out.
name: mise
repo: jdx/mise
version:
  scheme: semver
  tag_prefix: "v"
  universe: releases
sources:
  - kind: gh-release
  - kind: changelog-file
    path_template: CHANGELOG.md
osv:
  - { ecosystem: crates.io, name: mise }
