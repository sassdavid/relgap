# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
# Release pipeline (ADR-0009). Runs on tags created by release-please; locally use
# `mise run snapshot`, which skips cosign signing (keyless signing needs CI's OIDC token).
version: 2

project_name: relgap

before:
  hooks:
    - go mod tidy -diff

snapshot:
  version_template: "{{ incpatch .Version }}-next"

report_sizes: true

metadata:
  mod_timestamp: "{{ .CommitTimestamp }}"

builds:
  - id: relgap
    main: ./cmd/relgap
    binary: relgap
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/sassdavid/relgap/internal/buildinfo.version={{ .Version }}
      - -X github.com/sassdavid/relgap/internal/buildinfo.commit={{ .FullCommit }}
      - -X github.com/sassdavid/relgap/internal/buildinfo.date={{ .CommitDate }}
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: relgap
    ids: [relgap]
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md

checksum:
  name_template: checksums.txt
  algorithm: sha256

# One SPDX SBOM per archive, generated by syft.
sboms:
  - artifacts: archive

# cosign v3 keyless: checksums.txt.sigstore.json bundles signature + certificate.
# Verify with:
#   cosign verify-blob --bundle checksums.txt.sigstore.json \
#     --certificate-identity-regexp '^https://github.com/sassdavid/relgap/\.github/workflows/release\.yml@' \
#     --certificate-oidc-issuer https://token.actions.githubusercontent.com checksums.txt
signs:
  - cmd: cosign
    artifacts: checksum
    signature: "${artifact}.sigstore.json"
    args:
      - sign-blob
      - "--bundle=${signature}"
      - "${artifact}"
      - --yes
    output: true

# release-please creates a draft release with the notes. goreleaser finds it by name,
# uploads the assets and then publishes it.
release:
  github:
    owner: sassdavid
    name: relgap
  name_template: "{{ .Tag }}" # release-please names the release after the tag
  use_existing_draft: true
  mode: keep-existing
  preflight:
    fail_on_error: true

changelog:
  disable: true

homebrew_casks:
  - name: relgap
    ids: [relgap]
    binaries: [relgap]
    repository:
      owner: sassdavid
      name: homebrew-tap
      token: '{{ envOrDefault "HOMEBREW_TAP_TOKEN" "" }}'
    directory: Casks
    skip_upload: '{{ if eq (envOrDefault "HOMEBREW_TAP_TOKEN" "") "" }}true{{ else }}false{{ end }}'
    homepage: https://github.com/sassdavid/relgap
    description: Release-notes digests and toolchain drift for the tools you pin
    license: Apache-2.0
    commit_msg_template: "chore(cask): {{ .ProjectName }} {{ .Tag }}"
    generate_completions_from_executable:
      executable: relgap
      args: [completion]
      base_name: relgap
      shell_parameter_format: cobra
      shells: [bash, zsh, fish]
    hooks:
      post:
        # The binaries aren't notarized; without this macOS Gatekeeper blocks them.
        install_steps: |
          on_macos do
            run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "{{ .StagedPath }}/relgap"]
          end

scoops:
  - name: relgap
    ids: [relgap]
    repository:
      owner: sassdavid
      name: scoop-bucket
      token: '{{ envOrDefault "SCOOP_BUCKET_TOKEN" "" }}'
    directory: bucket
    skip_upload: '{{ if eq (envOrDefault "SCOOP_BUCKET_TOKEN" "") "" }}true{{ else }}false{{ end }}'
    homepage: https://github.com/sassdavid/relgap
    description: Release-notes digests and toolchain drift for the tools you pin
    license: Apache-2.0
    commit_msg_template: "chore(scoop): {{ .ProjectName }} {{ .Tag }}"
