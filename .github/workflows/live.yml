name: live

# Nightly live corpus (docs/plan/testing.md): digests the 30 tools of testdata/corpus.yaml against
# GitHub and the web, then opens or updates a "corpus drift: <tool>" issue for each difference and
# closes the issues of tools that are clean again. It never updates goldens or corpus.yaml: the
# corpus job can only read the repository.
#
# The bedrock job sends one --summarize prompt to Amazon Bedrock. It runs only when the repository
# variables RELGAP_BEDROCK_ROLE_ARN (an IAM role GitHub's OIDC provider can assume, allowed
# bedrock:InvokeModel) and RELGAP_BEDROCK_MODEL (a model or inference profile ID) are both set, so
# nothing calls Bedrock until they are. RELGAP_BEDROCK_REGION defaults to us-east-1.
on:
  schedule:
    - cron: "41 4 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  corpus:
    name: live corpus
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8
        with:
          version: 2026.11.7
      - name: digest the corpus live
        env:
          GH_TOKEN: ${{ github.token }}
          RELGAP_LIVE_OUT: ${{ runner.temp }}/corpus
        run: mise run test:live
      - name: keep the results for the issues job
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: corpus
          path: ${{ runner.temp }}/corpus
          if-no-files-found: error
          retention-days: 14

  bedrock:
    name: bedrock smoke test
    if: ${{ vars.RELGAP_BEDROCK_ROLE_ARN != '' && vars.RELGAP_BEDROCK_MODEL != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write # assume the Bedrock role with OIDC
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8
        with:
          version: 2026.11.7
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.RELGAP_BEDROCK_ROLE_ARN }}
          aws-region: ${{ vars.RELGAP_BEDROCK_REGION || 'us-east-1' }}
      - name: summarize a digest with Bedrock Converse
        env:
          RELGAP_BEDROCK_MODEL: ${{ vars.RELGAP_BEDROCK_MODEL }}
        run: mise run test:live:bedrock

  issues:
    name: drift issues
    needs: corpus
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read # the script in scripts/
      issues: write # open, comment on and close "corpus drift" issues
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: corpus
          path: corpus
      - name: open, update or close corpus drift issues
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMIT: ${{ github.sha }}
        run: bash scripts/corpus-issues.sh corpus
