# Outdated, end-of-life and vulnerable tool pins: copy this file to .github/workflows/outdated.yml
# in a repository whose mise.toml pins relgap (mise use github:sassdavid/relgap).
#
# One relgap run compares every pin, prints annotations, writes SARIF, Markdown and JSON with
# --out, and gates the job with its exit code. The later steps run even when the gate fails. On a
# pull request from a branch of this repository, relgap notify keeps one comment with the report:
# a re-run edits it only when the report changed, and a report with nothing left turns it into
# "Nothing to report". Pull requests from forks get a read-only GITHUB_TOKEN, so they get the step
# summary only.
name: outdated

on:
  schedule:
    - cron: "23 6 * * 1"
  pull_request:
    paths:
      - "mise.toml"
      - ".tool-versions"
      - "**/*.tf"
      - "**/*.hcl"
      - "**/Dockerfile"
      - ".github/workflows/*.yml"
  workflow_dispatch:

permissions: {}

concurrency:
  group: outdated-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  outdated:
    name: outdated
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write # SARIF upload
      pull-requests: write # the sticky comment
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          version: 2026.11.5
      # Exit 3: a pin is end of life or has a known vulnerability. Exit 1: a source failed and no
      # gate matched. --out writes every file before the exit code is set.
      - name: relgap outdated
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          relgap outdated --format github --out sarif=outdated.sarif --out md=outdated.md \
            --out json=outdated.json --fail-on eol,vuln
      - name: step summary
        if: ${{ !cancelled() && hashFiles('outdated.md') != '' }}
        run: cat outdated.md >> "$GITHUB_STEP_SUMMARY"
      - uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        if: ${{ !cancelled() && hashFiles('outdated.sarif') != '' }}
        with:
          sarif_file: outdated.sarif
          category: relgap-outdated
      - name: pull request comment
        if: >-
          ${{ !cancelled() && hashFiles('outdated.json') != '' && github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: relgap notify --from outdated.json --notify github-pr-comment
