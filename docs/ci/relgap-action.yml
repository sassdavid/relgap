# relgap through relgap-action: copy this file to .github/workflows/relgap.yml. The action installs
# a verified relgap release, so the repository needs no mise.toml entry for relgap.
#
# The outdated job runs relgap outdated, uploads the SARIF to code scanning, appends the Markdown
# to the step summary, and fails on an end-of-life or vulnerable pin. The digest job runs on pull
# requests that change a pin and keeps one comment with the release notes of each upgraded tool.
# Pull requests from forks and from Dependabot get a read-only GITHUB_TOKEN, so they get the step
# summary only.
name: relgap

on:
  push:
    branches: [main]
  schedule:
    - cron: "23 6 * * 1"
  pull_request:
    paths:
      - "mise.toml"
      - ".tool-versions"
      - "**/*.tf"
      - "**/*.hcl"
      - "**/Dockerfile"
      - ".github/workflows/*.yml"

permissions: {}

jobs:
  outdated:
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write # the SARIF upload
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: sassdavid/relgap-action@518ce61cef05d84d2bd980c553bd24fdca9ed0c7 # v1.2.0
        with:
          mode: report
          fail-on: eol, vuln

  digest:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write # the comment
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # relgap reads the pins at the base commit
          persist-credentials: false
      - uses: sassdavid/relgap-action@518ce61cef05d84d2bd980c553bd24fdca9ed0c7 # v1.2.0
        with:
          mode: comment
